  const gueltig = isIsoDate(d.date), zukunft = gueltig && d.date > today(), cur = gueltig ? morningOf(d.date) : null;
  return { gueltig, zukunft, cur, ok: gueltig && !zukunft && d.pain != null && !!d.stiff };
}
function morningEditNotesHtml(c) {
  return (c.zukunft ? '<div class="warnbox">Ein Morgen in der Zukunft lässt sich nicht eintragen.</div>' : '')
    + (!c.zukunft && c.cur && !c.cur.skipped ? '<div class="warnbox">Für diesen Tag gibt es schon einen Morgenwert. Er wird ersetzt.</div>' : '');
}
function morningEditHintText(d, c) { return c.ok || c.zukunft || !c.gueltig ? '' : `Es fehlt noch: ${missingMorning(d)}.`; }
// Datum im Editor geändert: nur Hinweise und Knopf nachführen (siehe refreshEntryForm)
function refreshMorningEdit() {
  if (!mEdit) return;
  const c = morningEditCheck(mEdit);
  setHtml('e-notes', morningEditNotesHtml(c));
  const b = document.querySelector('[data-act="saveMorningEdit"]'); if (b) b.disabled = !c.ok;
  setHint('e-hint', morningEditHintText(mEdit, c));
}
function morningEditorHtml() {
  const d = mEdit, frei = d.where === 'free', c = morningEditCheck(d);
  return `<div class="m-edit">
      <div class="day-title" style="margin-bottom:10px">${frei ? 'Morgen nachtragen' : `Morgen vom ${esc(weekday(d.date))}, ${fmt(d.date)}`}</div>
      ${frei ? `<div class="field"><label class="sublabel" for="e-date">Datum</label>
          <input type="date" id="e-date" value="${esc(d.date)}" max="${today()}" data-epath="date"></div>
        <div id="e-notes">${morningEditNotesHtml(c)}</div>` : ''}
      ${morningFieldsHtml('e', d)}
      <div class="btn-row">
        <button class="btn small" data-act="saveMorningEdit" ${c.ok ? '' : 'disabled'}>Speichern</button>
        <button class="btn quiet small" data-act="cancelMorningEdit">Abbrechen</button>
        ${!frei && c.cur ? '<button type="button" class="edit" data-act="delMorning" style="margin-left:auto">Morgenwert entfernen</button>' : ''}
      </div>
      <p class="hint" id="e-hint" style="margin-top:8px"${morningEditHintText(d, c) ? '' : ' hidden'}>${esc(morningEditHintText(d, c))}</p>
    </div>`;
}

function morningRowHtml(date) {
  if (mEdit && mEdit.where === 'day' && mEdit.date === date) return `<div class="day-row editing">${morningEditorHtml()}</div>`;
  const m = morningOf(date), prev = addDays(date, -1);
  const bezug = hasTraining(prev) ? `<div class="day-sub">gilt für das Training vom ${esc(weekday(prev))}, ${fmt(prev)}</div>` : '';
  if (m && !m.skipped) {
    return `<div class="day-row">
        <span class="day-time">Morgen</span>
        <div class="day-main">
          <div class="day-title">Sehne steif: ${esc(stiffLabel(m.stiff))}</div>
          ${bezug}
          ${m.note ? `<div class="day-sub day-note">${esc(m.note)}</div>` : ''}
        </div>
        <div class="day-side">
          <div class="day-val">Schmerz<b>${esc(m.pain)}</b></div>
          <div class="day-acts"><button type="button" class="edit" data-act="editMorning" data-date="${date}" aria-label="Morgen vom ${fmt(date)} ändern">ändern</button></div>
        </div>
      </div>`;
  }
  return `<div class="day-row day-missing">
      <span class="day-time">Morgen</span>
      <div class="day-main">
        <div class="day-title">${m && m.skipped ? 'übersprungen' : 'nicht erfasst'}</div>
        ${bezug}
      </div>
      <div class="day-side">
        <div class="day-acts"><button type="button" class="edit" data-act="editMorning" data-date="${date}" aria-label="Morgen vom ${fmt(date)} nachtragen">nachtragen</button></div>
      </div>
    </div>`;
}

function entryRowHtml(e) {
  const label = typeLabel(e.type);
  return `<div class="day-row${editingId === e.id ? ' editing' : ''}">
      <span class="day-time">${e.time ? esc(e.time) : '–'}</span>
      <div class="day-main">
        <div class="day-title">${esc(label)}${e.progressed ? ' · gesteigert' + (e.progressedWhat ? ': ' + esc(e.progressedWhat) : '') : ''}</div>
        <div class="day-sub">${esc(summary(e))}${e.effort != null ? ' · Anstrengung ' + esc(e.effort) + '/10' : ''}${e.collagen ? ' · Kollagen' : ''}</div>
        ${e.note ? `<div class="day-sub day-note">${esc(e.note)}</div>` : ''}
      </div>
      <div class="day-side">
        <div class="day-val">während<b>${e.painDuring != null ? esc(e.painDuring) : '–'}</b></div>
        <div class="day-acts"><button type="button" class="edit" data-act="edit" data-id="${esc(e.id)}" aria-label="Einheit vom ${fmt(e.date)} bearbeiten">ändern</button></div>
      </div>
    </div>`;
}

function testRowHtml(date) {
  const x = testOf(date);
  if (!x) return '';
  const diff = x.left - x.right, pct = x.left > 0 ? Math.round(x.right / x.left * 100) : null;
  const abstand = diff === 0 ? 'beide Seiten gleich' : diff > 0 ? `rechts ${diff} weniger` : `rechts ${-diff} mehr`;
  return `<div class="day-row${testDraft && testDraft.orig === date ? ' editing' : ''}">
      <span class="day-time">Test</span>
      <div class="day-main">
        <div class="day-title">Monatstest</div>
        <div class="day-sub">rechts ${x.right} · links ${x.left} · ${abstand}${pct !== null ? ` (${pct} % von links)` : ''}</div>
        ${x.note ? `<div class="day-sub day-note">${esc(x.note)}</div>` : ''}
      </div>
      <div class="day-side">
        <div class="day-val">rechts<b>${x.right}</b></div>
        <div class="day-acts"><button type="button" class="edit" data-act="editTest" data-date="${date}" aria-label="Monatstest vom ${fmt(date)} ändern">ändern</button></div>
      </div>
    </div>`;
}

function dayCardHtml(date) {
  const list = entriesOf(date);
  return `<div class="day">
      <div class="day-head">
        <span class="day-date">${esc(dayLabel(date))}</span>
        <span class="day-tag">${list.length ? `${list.length} ${list.length === 1 ? 'Einheit' : 'Einheiten'}` : testOf(date) ? 'Monatstest' : 'Ruhetag'}</span>
      </div>
      ${morningRowHtml(date)}
      ${testRowHtml(date)}
      ${list.map(entryRowHtml).join('')}
    </div>`;
}

function historyHtml() {
  const dates = dayList(), mehr = dates.length - HIST_KURZ;
  return (histOpen ? dates : dates.slice(0, HIST_KURZ)).map(dayCardHtml).join('')
    + (mehr > 0 ? `<div class="btn-row" style="margin-top:12px"><button type="button" class="btn quiet small" data-act="toggleDays" aria-expanded="${histOpen}">${
        histOpen ? 'Ältere Tage einklappen' : `Ältere Tage anzeigen (${mehr})`}</button></div>` : '')
    + (mEdit && mEdit.where === 'free'
        ? `<div class="day"><div class="day-row editing">${morningEditorHtml()}</div></div>`
        : '<p class="note"><button type="button" class="sc-link" data-act="addMorning">Morgen für einen anderen Tag nachtragen</button></p>');
}

// Zugeklappte Erfassung: die Art der Einheit ist direkt wählbar – ein Tipp öffnet das Formular
function formClosedHtml() {
  const last = sorted().slice(-1)[0];
  return `<div class="card" id="form">
      <h2 tabindex="-1">Einheit erfassen</h2>
      ${uiFlash && uiFlash.where === 'entry' ? `<p class="${uiFlash.ok ? 'flash' : 'err'}" style="margin:0 0 12px">${esc(uiFlash.text)}${uiFlash.undo && lastDeleted ? ' <button type="button" class="sc-link" data-act="undoDel">Rückgängig</button>' : ''}</p>` : ''}
      <div class="seg type-pick">${Object.entries(TYPES).map(([v, t]) =>
        `<button type="button" data-act="openForm" data-type="${v}">${esc(t.label)}</button>`).join('')}<button type="button" data-act="openTest">Monatstest</button></div>
      ${last ? `<p class="hint" style="margin:10px 0 0">Zuletzt: ${esc(typeLabel(last.type))}, ${esc(relDay(last.date))}${last.time ? ' ' + esc(last.time) : ''}</p>` : ''}
    </div>`;
}

// Monatstest erfassen oder ändern – in derselben Karte wie die Einheiten
function countOf(s) { const v = String(s ?? '').trim(); return /^\d{1,3}$/.test(v) ? +v : null; }
function testCheck(d) {
  const r = countOf(d.right), l = countOf(d.left), gueltig = isIsoDate(d.date), zukunft = gueltig && d.date > today();
  return { r, l, gueltig, zukunft, ok: gueltig && !zukunft && r !== null && l !== null };
}
function testMissing(c) {
  if (c.ok) return '';
  if (!c.gueltig) return 'Das Datum fehlt oder ist ungültig.';
  if (c.zukunft) return 'Ein Test in der Zukunft lässt sich nicht eintragen.';
  const fehlt = [c.r === null ? 'rechts' : '', c.l === null ? 'links' : ''].filter(Boolean).join(' und ');
  return `Es fehlt noch die Zahl ${fehlt}.`;
}
// Beim Tippen nur Knopf und Hinweis nachführen – ein Neuaufbau würde das Feld unter dem Finger ersetzen
function testNotesHtml(d, c) {
  return !d.orig && c.gueltig && !c.zukunft && testOf(d.date) ? '<div class="warnbox">Für diesen Tag gibt es schon einen Monatstest. Er wird ersetzt.</div>' : '';
}
function updateTestForm() {
  if (!testDraft) return;
  const c = testCheck(testDraft), b = document.querySelector('[data-act="saveTest"]');
  setHtml('t-notes', testNotesHtml(testDraft, c));
  if (b) b.disabled = !c.ok;
  setHint('t-hint', testMissing(c));
}
function testFormHtml() {
  const d = testDraft, editing = !!d.orig, c = testCheck(d);
  const last = testsSorted().filter(x => x.date !== d.orig).slice(-1)[0];
  return `<div class="card" id="form">
      <h2 tabindex="-1">${editing ? 'Monatstest bearbeiten' : 'Monatstest erfassen'}</h2>
      <p class="lede">Einbeiniges Wadenheben auf ebenem Boden, volle Reichweite, ruhiges Tempo – zählen, bis die Höhe sichtbar einbricht. Beide Seiten, die gesunde zuerst.</p>
      <div class="field"><label class="sublabel" for="t-date">Datum</label><input type="date" id="t-date" value="${esc(d.date)}" max="${today()}" data-tpath="date"></div>
      <div id="t-notes">${testNotesHtml(d, c)}</div>
      <div class="field"><div class="grid2">
        <div><label class="sublabel" for="t-right">Wiederholungen rechts (betroffene Seite)</label>
          <input type="number" id="t-right" inputmode="numeric" min="0" max="999" value="${esc(d.right)}" placeholder="${last ? esc(last.right) : '12'}" data-tpath="right"></div>
        <div><label class="sublabel" for="t-left">Wiederholungen links (gesunde Seite)</label>
          <input type="number" id="t-left" inputmode="numeric" min="0" max="999" value="${esc(d.left)}" placeholder="${last ? esc(last.left) : '25'}" data-tpath="left"></div>
      </div>
      ${last ? `<p class="hint" style="margin:7px 0 0">Zuletzt am ${esc(weekday(last.date))}, ${fmtY(last.date)}: rechts ${last.right}, links ${last.left}.</p>` : ''}</div>
      <div class="field"><label for="t-note">Notiz</label>
        <textarea id="t-note" data-tpath="note" placeholder="Optional – z. B. „mit Rucksack 5 kg“">${esc(d.note)}</textarea></div>
      <div class="btn-row">
        <button class="btn" data-act="saveTest" ${c.ok ? '' : 'disabled'}>${editing ? 'Änderungen speichern' : 'Test speichern'}</button>
        <button class="btn quiet" data-act="cancelTest">Abbrechen</button>
        ${editing ? '<button type="button" class="edit" data-act="delTest" style="margin-left:auto">Test entfernen</button>' : ''}
      </div>
      <p class="hint" id="t-hint" style="margin-top:8px"${c.ok ? ' hidden' : ''}>${esc(testMissing(c))}</p>
    </div>`;
}
// Übersicht aller Monatstests – zugeklappt eine Zeile, bei Fälligkeit markiert
function testAccHtml() {
  const t = testsSorted(), last = t[t.length - 1], due = testDue();
  const meta = last
    ? `${due ? 'Fällig – ' : ''}zuletzt ${fmt(last.date)}: rechts ${last.right}, links ${last.left}`
    : due ? 'Fällig – noch keiner erfasst' : 'Noch keiner erfasst';
  const rows = [...t].reverse();
  const body = `<p class="txt txt-gap">Einmal im Monat, immer gleich ausgeführt: einbeiniges Wadenheben, bis die Höhe einbricht – beide Seiten. Zwei Zahlen sollen sich bewegen: die Wiederholungen rechts und der Abstand zur gesunden Seite.</p>
    ${rows.length ? `<table class="ttab"><thead><tr><th>Datum</th><th>rechts</th><th>links</th><th>Abstand</th></tr></thead><tbody>${rows.map(x =>
      `<tr><td>${esc(weekday(x.date))}, ${fmtY(x.date)}</td><td>${x.right}</td><td>${x.left}</td><td>${x.left - x.right}</td></tr>`).join('')}</tbody></table>` : ''}
    ${last && last.left > 0 && last.right <= last.left / 2 ? '<div class="warnbox" style="margin-top:12px"><b>Rechts schafft höchstens die Hälfte von links.</b> Im Plan steht das unter den Warnzeichen. Schließt sich der Abstand über die nächsten Tests nicht oder wird er größer, gehört das ärztlich angeschaut.</div>' : ''}
    <div class="btn-row" style="margin-top:12px"><button type="button" class="btn ghost small" data-act="openTest">Monatstest eintragen</button></div>`;
  return acc('mtest', 'Monatstest', meta, body, due);
}

// Teile des Formulars, die von Datum, Uhrzeit oder den Häkchen abhängen. Sie werden beim
// Tippen einzeln nachgeführt statt die Karte neu aufzubauen – sonst schließt auf iOS der
// Datumswähler bei jedem Verstellen, weil sein Feld unter dem Finger ersetzt wird.
function whenNoteHtml() {
  return draft.date !== today() && isIsoDate(draft.date)
    ? `<p class="hint" style="margin:7px 0 0">Der Eintrag steht nicht auf heute (${esc(weekday(today()))}, ${fmt(today())}). <button type="button" class="btn quiet small" style="padding:4px 9px;margin-left:4px" data-act="setToday">Auf heute setzen</button></p>` : '';
}
function collagenNoteHtml() {
  const gap = collagenGap();
  return gap !== null ? `<div class="warnbox"><b>Nur ${gap.toFixed(1)} Stunden seit der letzten Dosis.</b> Nach einem Reiz ist die Sehne rund 6 Stunden refraktär – diese Dosis bringt vermutlich nichts.</div>` : '';
}
function entryHintText() {
  return draft.painDuring == null ? 'Der Schmerzwert fehlt noch.' : !isIsoDate(draft.date) ? 'Das Datum fehlt oder ist ungültig.' : '';
}
function setHtml(id, html) { const el = document.getElementById(id); if (el && el.innerHTML !== html) el.innerHTML = html; }
function setHint(id, text) { const el = document.getElementById(id); if (el) { el.textContent = text; el.hidden = !text; } }
function refreshEntryForm() {
  if (!formOpen && !editingId) return;
  setHtml('when-note', whenNoteHtml());
  setHtml('collagen-note', collagenNoteHtml());
  const w = document.getElementById('progressed-what'); if (w) w.hidden = !draft.progressed;
  const b = document.getElementById('save-entry'); if (b) b.disabled = draft.painDuring == null || !isIsoDate(draft.date);
  setHint('entry-hint', entryHintText());
}

      </div>

      ${kind === 'ex' ? exPickerHtml() : kind === 'run' ? runFieldsHtml() : sessionFieldsHtml()}

      <div class="field" id="f-painDuring">
        <span class="field-label">Schmerz während der Einheit</span>
        <p class="hint">Nicht der stärkste Moment, sondern das Grundniveau.${scaleLink('during', 'f-painDuring')}</p>

      ${draft.type === 'kraft' ? `<div class="field" id="f-effort">

        ${scaleHtml('effort', draft.effort, false, 'Anstrengung des letzten Satzes, 0 bis 10')}
        ${draft.painDuring != null && draft.painDuring > SCHMERZ_MAX && draft.effort != null && draft.effort <= ANSTRENGUNG_LEICHT ? `<div class="warnbox" style="margin-top:12px"><b>Muskel leicht, Sehne laut.</b> Die Wade hat noch Reserve, das Gewebe verträgt sie aber nicht. Mehr Gewicht wäre trotz des niedrigen Anstrengungswerts falsch. Verkleinere stattdessen die Bewegungsreichweite oder stell auf Isometrie um – Halten erzeugt hohe Spannung ohne die schmerzhafte Bewegung.</div>` : ''}

      <div id="collagen-note">${collagenNoteHtml()}</div>

        <button class="btn quiet" data-act="cancelEdit">Abbrechen</button>

    <div class="o10">${testAccHtml()}${acc('howto', 'Wie die Bewertung zustande kommt', 'Erklärung – keine Daten',

    </div>
    <div class="log-out">
    <div class="o7"><div class="verdict ${a.tone}">

// Fokus über den Neuaufbau retten: das aktive Element an seinen Datenattributen wiederfinden
function focusKeyOf(el) {
  if (!el || el === document.body || !document.getElementById('root').contains(el)) return null;
  if (el.id) return '#' + CSS.escape(el.id);
  if (el.classList.contains('chart-svg')) return '.chart-svg';
  const attrs = ['data-tab','data-act','data-scale','data-seg','data-extoggle','data-exblock','data-exlast','data-acc','data-val','data-id','data-date','data-snap','data-type','data-range','data-sc','data-where','data-path','data-mpath','data-epath','data-tpath'];
  const parts = attrs.filter(a => el.hasAttribute(a)).map(a => `[${a}="${CSS.escape(el.getAttribute(a))}"]`);
  return parts.length ? parts.join('') : null;
}
function focusEl(sel) {
  const el = sel && document.querySelector(sel);
  if (el) el.focus({ preventScroll: true });
}
// Ansage für Hilfstechnik – die Seite wird komplett neu aufgebaut, sonst hört niemand die Rückmeldung
function announce(text) {
  const l = document.getElementById('live');
  if (!l) return;
  l.textContent = '';
  setTimeout(() => { l.textContent = text; }, 40);
}

function render() {
  if (!state.loaded) return;
  invalidate();
  const focusKey = focusKeyOf(document.activeElement);
  let body;
  try {
    body = tab === 'plan' ? tabPlan() : tab === 'ex' ? tabEx() : tab === 'supp' ? tabSupp() : tab === 'scale' ? tabScales() : tab === 'data' ? tabData() : tabLog();
  } catch (err) {
    body = crashHtml(err);
  }
  document.getElementById('root').innerHTML = `<div class="wrap">
    <header class="masthead">
      <h1>Sehnenlog</h1>
      <p>Plan, Übungen und Trainingstagebuch für die Tibialis-posterior-Sehne. Offline-Version, gespeichert auf diesem Gerät.</p>
    </header>
    <nav class="tabs" role="tablist" aria-label="Bereiche">
      ${TABS.map(([v,l]) => `<button role="tab" id="tab-${v}" aria-controls="panel" data-tab="${v}" aria-selected="${tab===v}" tabindex="${tab===v ? 0 : -1}">${l}</button>`).join('')}
    </nav>
    ${state.error ? `<div class="flag">
      <b>Konnte nicht gespeichert werden</b>
      <div>Deine Daten sind in dieser Sitzung vorhanden – aber beim Neuladen sind sie weg. Erzeug dir jetzt eine Sicherung, damit nichts verlorengeht.</div>
      <div style="margin-top:8px;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--card);border-radius:5px;padding:8px 10px">${esc(state.error)}</div>
      <div class="btn-row" style="margin-top:8px"><button class="btn small" data-act="backupFile">Sicherung als Datei</button><button class="btn quiet small" data-act="retrySave">Speichern erneut versuchen</button></div>
    </div>` : ''}
    <main id="panel" role="tabpanel" aria-labelledby="tab-${tab}">${body}</main>
  </div>`;
  // Das Diagramm rechnet in echten Pixeln – hat sich die Breite beim Aufbau verschoben, neu zeichnen
  if (tab === 'log' && chartOutOfDate()) updateChart();
  focusEl(focusKey);
}

/* ============================================ Sicherung */
function backupPayload() {
  return JSON.stringify({ app:'sehnenlog', v:4, exported:new Date().toISOString(),
    entries: state.entries, mornings: state.mornings, tests: state.tests });
}

// Auf dem Handy ist das Teilen-Blatt der richtige Weg (dort landet OneDrive),
// am Rechner ein normaler Download. Beides zählt als erfolgte Sicherung.
async function saveBackupFile() {
  const name = `sehnenlog-${today()}.json`;
  const text = backupPayload();
  try {
    const file = new File([text], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Sehnenlog-Sicherung' });
      await markBackup();
      return { ok: true, text: 'Sicherung geteilt. Leg sie in OneDrive ab, dann ist sie vom Gerät unabhängig.' };
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return { ok: false, text: 'Abgebrochen – es wurde nichts gesichert.' };
    // sonst fällt es unten auf den Download zurück
  }
  try {
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    await markBackup();
    return { ok: true, text: `Gespeichert als ${name}. Leg die Datei in OneDrive, dann überlebt sie dieses Gerät.` };
  } catch (e) {
    return { ok: false, text: 'Die Datei ließ sich nicht erzeugen. Nimm den Textweg weiter unten.' };
  }
}

// Gemeinsamer Weg für Textfeld und Datei. Nimmt auch Sicherungen aus der Zeit
// vor der Umstellung an und rechnet sie um.
async function applyBackup(raw) {
  if (!raw || !raw.trim()) {
    importMsg = { ok:false, text:'Das Feld ist leer. Füg zuerst den Sicherungstext ein oder wähl eine Datei.' };
    return render();
  }
  // Erst vollständig einlesen und prüfen, dann anwenden – sonst landen bei einem
  // Fehlschlag halbe Daten im Speicher, während die Meldung „ungültig“ behauptet.
  let n = null;
  try { n = normalize(JSON.parse(raw)); } catch (e) { n = null; }
  if (!n) {
    importMsg = { ok:false, text:'Das war keine gültige Sicherung. Nimm die komplette Datei bzw. den kompletten Text, ohne etwas wegzulassen. Es wurde nichts verändert.' };
    return render();
  }
  let neu = 0, ersetzt = 0, mNeu = 0, mErsetzt = 0, tNeu = 0, tErsetzt = 0;
  n.entries.forEach(e => {
    const i = state.entries.findIndex(x => x.id === e.id);
    if (i >= 0) { state.entries[i] = e; ersetzt++; } else { state.entries.push(e); neu++; }
  });
  n.mornings.forEach(m => {
    const cur = morningOf(m.date);
    if (!cur) { state.mornings.push(m); invalidate(); mNeu++; }
    else if (m.skipped && !cur.skipped) { /* einen echten Wert nicht durch „übersprungen“ ersetzen */ }
    else { upsertMorning(m); mErsetzt++; }
  });
  n.tests.forEach(x => {
    if (testOf(x.date)) { upsertTest(x); tErsetzt++; } else { state.tests.push(x); invalidate(); tNeu++; }
  });
  importBuf = ''; state.dataNote = null; mEdit = null; closeForm();
  await save();
  importMsg = { ok:!state.error, text: state.error ? 'Nicht gespeichert – siehe Fehlermeldung oben.' :
    `Einheiten: ${neu} neu, ${ersetzt} aktualisiert. Morgen: ${mNeu} neu, ${mErsetzt} aktualisiert.${n.tests.length ? ` Monatstests: ${tNeu} neu, ${tErsetzt} aktualisiert.` : ''} Insgesamt ${state.entries.length} ${state.entries.length === 1 ? 'Einheit' : 'Einheiten'}.`
    + (n.dropped ? ` ${n.dropped} unvollständige ${n.dropped === 1 ? 'Zeile wurde' : 'Zeilen wurden'} übersprungen.` : '')
    + (n.doppelt ? ` Bei ${n.doppelt} Morgen gab es zwei Werte – übernommen wurde der Morgen-Check, der zweite steht in der Notiz.` : '') };
  announce(importMsg.text);
  render();
}

/* ============================================ Events */
// Erfassung zuklappen und Entwurf verwerfen – nach Speichern, Abbrechen, Löschen, Import, Zurückholen
function closeForm() { editingId = null; draft = newDraft(); formOpen = false; whenOpen = false; testDraft = null; }
// Steht noch nichts im Entwurf, beginnt „Einheit erfassen“ frisch – mit der aktuellen Uhrzeit
function draftIsEmpty(d) {
  return d.painDuring == null && d.effort == null && !d.collagen && !d.progressed && !d.progressedWhat.trim() && !d.note.trim()
    && !Object.keys(d.ex).length && !Object.values(d.run).some(v => String(v).trim()) && !Object.values(d.session).some(v => String(v).trim());
}
function setPath(path, val) {
  const p = path.split('.');
  let o = draft;
  for (let i = 0; i < p.length - 1; i++) o = o[p[i]];
  o[p[p.length-1]] = val;
}

document.addEventListener('click', async (ev) => {
  if (chartState && chartState.sel && !(ev.target.closest && ev.target.closest('.chart-svg'))) chartShow(null);
  const t = ev.target.closest('[data-scale],[data-seg],[data-act],[data-tab],[data-extoggle],[data-exblock],[data-exlast],[data-acc]');
  if (!t) return;
  uiFlash = null;   // Rückmeldungen gelten nur bis zum nächsten Tippen

  if (t.dataset.tab) { tab = t.dataset.tab; openAcc = null; scaleJump = null; window.scrollTo(0,0); return render(); }
  if (t.dataset.acc) { openAcc = openAcc === t.dataset.acc ? null : t.dataset.acc; return render(); }
  if (t.dataset.extoggle) {
    const id = t.dataset.extoggle;
    if (draft.ex[id]) delete draft.ex[id]; else draft.ex[id] = { sets:'', reps:'', weight:'' };
    return render();
  }
  if (t.dataset.exblock) {
    const ids = Object.keys(EX).filter(id => EX[id].g === t.dataset.exblock);
    const all = ids.every(id => draft.ex[id]);
    ids.forEach(id => { if (all) delete draft.ex[id]; else if (!draft.ex[id]) draft.ex[id] = { sets:'', reps:'', weight:'' }; });
    return render();
  }
  if (t.dataset.exlast) {
    const last = lastExUse(t.dataset.exlast);
    if (last) draft.ex[t.dataset.exlast] = { sets: last.sets, reps: last.reps, weight: last.weight };
    return render();
  }
  if (t.dataset.scale) {
    const v = +t.dataset.val;
    if (t.dataset.scale === 'mPain') morningDraft.pain = v;
    else if (t.dataset.scale === 'ePain') { if (mEdit) mEdit.pain = v; }
    else draft[t.dataset.scale] = v;
    return render();
  }
  if (t.dataset.seg) {
    if (t.dataset.seg === 'mStiff') morningDraft.stiff = t.dataset.val;
    else if (t.dataset.seg === 'eStiff') { if (mEdit) mEdit.stiff = t.dataset.val; }
    else { draft.type = t.dataset.val; draft.ex = {}; }
    return render();
  }

  const act = t.dataset.act;
  if (act === 'gotoScale') {
    const sc = t.dataset.sc, from = t.dataset.from;
    scaleJump = { sc, from };
    tab = 'scale'; openAcc = null;
    render();
    document.getElementById('sc-' + sc)?.scrollIntoView({ block:'start' });
    return;
  }
  if (act === 'backFromScale') {
    const from = scaleJump && scaleJump.from;
    scaleJump = null; tab = 'log';
    render();
    const el = from && document.getElementById(from);
    if (el) el.scrollIntoView({ block:'center' }); else window.scrollTo(0,0);
    return;
  }
  if (act === 'setToday') { draft.date = today(); draft.time = nowTime(); whenOpen = false; return render(); }
  if (act === 'editWhen') { whenOpen = true; return render(); }
  if (act === 'openForm') {
    if (!TYPES[t.dataset.type]) return;
    if (draftIsEmpty(draft)) draft = newDraft();
    if (draft.type !== t.dataset.type) { draft.type = t.dataset.type; draft.ex = {}; }
    testDraft = null; formOpen = true;
    render();
    document.getElementById('form')?.scrollIntoView({ block: 'start', behavior: 'smooth' });
    focusEl('#form h2');
    return;
  }
  if (act === 'saveEntry') {
    const kind = TYPES[draft.type].kind;
    const details = kind === 'ex' ? { ex: JSON.parse(JSON.stringify(draft.ex)) }
      : kind === 'run' ? { ...draft.run } : { ...draft.session };
    const base = { date:draft.date, time:draft.time, type:draft.type, details,
      painDuring:draft.painDuring, effort: draft.type === 'kraft' ? draft.effort : null,
      collagen:draft.collagen, progressed:draft.progressed, progressedWhat: draft.progressed ? draft.progressedWhat.trim() : '', note:draft.note.trim() };

    if (base.painDuring == null || !isIsoDate(base.date)) return;   // der Knopf ist dann ohnehin gesperrt
    const art = typeLabel(base.type);
    const wann = `${relDay(base.date)}${base.time ? ' ' + base.time : ''}`;
    let text;
    if (editingId) {
      // Morgenwerte hängen nicht mehr an der Einheit – Umdatieren ist deshalb unkritisch
      const e = state.entries.find(x => x.id === editingId);
      // Alteinträge (v1/v2) trugen den Freitext in „detail“; der steht seit dem Öffnen in der Notiz und würde sonst die neuen Felder verdecken
      if (e) { delete e.detail; Object.assign(e, base); text = `Änderung gespeichert: ${art}, ${wann}.`; }
      else text = null;   // die Einheit gibt es nicht mehr (gelöscht, zurückgeholt, ersetzt)
      editingId = null;
    } else {
      state.entries.push({ id:'e'+Date.now(), ...base });
      text = `Gespeichert: ${art}, ${wann}.`;
    }
    closeForm();
    await save();
    // Erst nach dem Speichern bestätigen – ein Speicherfehler zeigt sonst „Gespeichert“ neben der Fehlerkarte
    if (text === null) uiFlash = { where: 'entry', ok: false, text: 'Diese Einheit gibt es nicht mehr – die Änderung wurde nicht gespeichert.' };
    else if (!state.error) uiFlash = { where: 'entry', ok: true, text };
    if (uiFlash) announce(uiFlash.text);
    render();
    // Das Formular klappt zu – die Bestätigung im Blick behalten, Fokus auf den Kartentitel
    document.getElementById('form')?.scrollIntoView({ block: 'nearest' });
    focusEl('#form h2');
    return;
  }
  if (act === 'edit') {
    const e = state.entries.find(x => x.id === t.dataset.id);
    if (e) { editingId = e.id; draft = draftFromEntry(e); formOpen = true; render(); document.getElementById('form')?.scrollIntoView({ block:'start', behavior:'smooth' }); focusEl('#form h2'); }
    return;
  }
  if (act === 'cancelEdit') { closeForm(); return render(); }

  if (act === 'saveMorning') {
    const date = t.dataset.date;
    if (!isIsoDate(date) || morningDraft.pain == null || !morningDraft.stiff) return;
    const m = makeMorning(date, morningDraft.pain, morningDraft.stiff, morningDraft.note);
    upsertMorning(m);
    morningDraft = {}; morningOpen = false; await save();
    const text = `Morgen vom ${fmt(date)} gespeichert: Schmerz ${m.pain}, Sehne steif ${stiffLabel(m.stiff)}`;
    if (!state.error) { uiFlash = { where: 'morning', ok: true, text: text.endsWith('.') ? text : text + '.' }; announce(uiFlash.text); }
    render(); focusEl('#morning-flash');
    return;
  }
  if (act === 'skipMorning') {
    const date = t.dataset.date;
    if (!isIsoDate(date)) return;
    upsertMorning(skippedMorning(date));
    morningDraft = {}; await save();
    if (!state.error) { uiFlash = { where: 'morning', ok: true, text: `Morgen vom ${fmt(date)} übersprungen – im Verlauf lässt er sich nachtragen.` }; announce(uiFlash.text); }
    render(); focusEl('#morning-flash');
    return;
  }
  if (act === 'openMorning') { morningOpen = true; return render(); }
  if (act === 'closeMorning') { morningOpen = false; morningDraft = {}; return render(); }
  if (act === 'editMorning') {
    const date = t.dataset.date, m = morningOf(date);
    mEdit = { date, pain: m && !m.skipped ? m.pain : null, stiff: m && !m.skipped ? m.stiff : null,
      note: m ? m.note || '' : '', where: t.dataset.where || 'day' };
    return render();
  }
  if (act === 'addMorning') {
    mEdit = { date: today(), pain: null, stiff: null, note: '', where: 'free' };
    render();
    document.querySelector('.m-edit')?.scrollIntoView({ block: 'center' });
    return;
  }
  if (act === 'saveMorningEdit') {
    if (!mEdit || !isIsoDate(mEdit.date) || mEdit.date > today() || mEdit.pain == null || !mEdit.stiff) return;
    upsertMorning(makeMorning(mEdit.date, mEdit.pain, mEdit.stiff, mEdit.note));
    const gespeichert = mEdit.date;
    mEdit = null; await save();
    announce(`Morgen vom ${fmt(gespeichert)} gespeichert.`);
    return;
  }
  if (act === 'cancelMorningEdit') { mEdit = null; return render(); }
  if (act === 'delMorning') {
    if (!mEdit || !confirm(`Morgenwert vom ${fmt(mEdit.date)} entfernen?`)) return;
    const date = mEdit.date;
    state.mornings = state.mornings.filter(x => x.date !== date);
    mEdit = null; await save();
    return;
  }
  if (act === 'toggleDays') {
    histOpen = !histOpen;
    // Ein offener Morgen-Editor in einem jetzt verborgenen Tag würde unsichtbar weiterlaufen
    if (!histOpen && mEdit && mEdit.where === 'day' && !dayList().slice(0, HIST_KURZ).includes(mEdit.date)) mEdit = null;
    render();
    // Beim Einklappen schrumpft die Seite – den Knopf im Blick behalten statt irgendwo weiter unten zu landen
    if (!histOpen) document.querySelector('[data-act="toggleDays"]')?.scrollIntoView({ block: 'center' });
    return;
  }
  if (act === 'chartRange') { chartRange = t.dataset.range === 'all' ? 'all' : +t.dataset.range; updateChart(); return; }
  if (act === 'dismissMigration') { state.migrationNote = null; return render(); }
  if (act === 'dismissItp') { state.meta.itpSeen = true; await saveMeta(); return render(); }
  if (act === 'copyRescue') {
    if (!state.rescue) return;
    try { await navigator.clipboard.writeText(state.rescue.raw); t.textContent = 'Kopiert'; announce('Rohtext kopiert.'); setTimeout(() => { t.textContent = 'Kopieren'; }, 1600); }
    catch (e) { importMsg = { ok:false, text:'Kopieren hat nicht geklappt – der Rohtext bleibt im Sicherheitsnetz liegen.' }; render(); }
    return;
  }
  if (act === 'dropRescue') {
    if (!confirm('Den unlesbaren Rohtext verwerfen? Danach ist er weg.')) return;
    await dropSnapshot(KEY_RESCUE); state.rescue = null;
    return render();
  }

  // Löschen gibt es nur im Bearbeitungsformular – die Zeilen im Verlauf haben alle denselben einen Knopf „ändern“
  if (act === 'del') {
    const e = state.entries.find(x => x.id === t.dataset.id);
    if (!e) return;
    closeForm();
    state.entries = state.entries.filter(x => x.id !== e.id);
    lastDeleted = e;
    await save();
    if (!state.error) { uiFlash = { where: 'entry', ok: true, undo: true, text: `Einheit vom ${fmt(e.date)} (${typeLabel(e.type)}) gelöscht.` }; announce(uiFlash.text + ' Rückgängig ist möglich.'); }
    render();
    document.getElementById('form')?.scrollIntoView({ block: 'nearest' });
    focusEl('#form h2');
    return;
  }
  if (act === 'undoDel') {
    if (!lastDeleted) return;
    const e = lastDeleted;
    if (!state.entries.some(x => x.id === e.id)) state.entries.push(e);
    lastDeleted = null;
    await save();
    if (!state.error) { uiFlash = { where: 'entry', ok: true, text: `Einheit vom ${fmt(e.date)} wiederhergestellt.` }; announce(uiFlash.text); }
    return render();
  }

  if (act === 'openTest') {
    closeForm();
    testDraft = { date: today(), right: '', left: '', note: '', orig: null };
    render();
    document.getElementById('form')?.scrollIntoView({ block: 'start', behavior: 'smooth' });
    focusEl('#form h2');
    return;
  }
  if (act === 'editTest') {
    const x = testOf(t.dataset.date);
    if (!x) return;
    closeForm();
    testDraft = { date: x.date, right: String(x.right), left: String(x.left), note: x.note || '', orig: x.date };
    render();
    document.getElementById('form')?.scrollIntoView({ block: 'start', behavior: 'smooth' });
    focusEl('#form h2');
    return;
  }
  if (act === 'cancelTest') { testDraft = null; return render(); }
  if (act === 'saveTest') {
    if (!testDraft) return;
    const d = testDraft, c = testCheck(d);
    if (!c.ok) return;   // der Knopf ist dann ohnehin gesperrt
    if (d.orig && d.orig !== d.date) state.tests = state.tests.filter(x => x.date !== d.orig);   // umdatiert
    upsertTest(makeTest(d.date, c.r, c.l, d.note));
    const text = `${d.orig ? 'Änderung gespeichert' : 'Gespeichert'}: Monatstest, ${relDay(d.date)} – rechts ${c.r}, links ${c.l}.`;
    testDraft = null;
    await save();
    if (!state.error) { uiFlash = { where: 'entry', ok: true, text }; announce(text); }
    render();
    document.getElementById('form')?.scrollIntoView({ block: 'nearest' });
    focusEl('#form h2');
    return;
  }
  if (act === 'delTest') {
    if (!testDraft || !testDraft.orig || !confirm(`Monatstest vom ${fmt(testDraft.orig)} entfernen?`)) return;
    const date = testDraft.orig;
    state.tests = state.tests.filter(x => x.date !== date);
    testDraft = null;
    await save();
    announce(`Monatstest vom ${fmt(date)} entfernt.`);
    return;
  }
  if (act === 'export') { showExport = true; render(); document.getElementById('exportbox')?.scrollIntoView({block:'nearest'}); return; }
  if (act === 'copy') {
    const box = document.getElementById('exportbox');
    if (box) {
      box.select();
      try { await navigator.clipboard.writeText(box.value); } catch (e) { document.execCommand('copy'); }
      t.textContent = 'Kopiert'; announce('In die Zwischenablage kopiert.'); setTimeout(() => { t.textContent = 'Kopieren'; }, 1600);
    }
    return;
  }
  if (act === 'retrySave') { await save(); return; }
  if (act === 'backup') {
    showBackup = true;
    importMsg = null; render();
    document.getElementById('backupbox')?.scrollIntoView({ block:'nearest' });
    return;
  }
  if (act === 'copyBackup') {
    const box = document.getElementById('backupbox');
    if (box) {
      box.select();
      try { await navigator.clipboard.writeText(box.value); } catch (e) { document.execCommand('copy'); }
      await markBackup();
      t.textContent = 'Kopiert'; setTimeout(() => { t.textContent = 'Kopieren'; }, 1600);
    }
    return;
  }
  if (act === 'restore') {
    const box = document.getElementById('impbox');
    const raw = (box && box.value ? box.value : importBuf) || '';
    await applyBackup(raw);
    return;
  }
  if (act === 'reset') {
    if (!hasData()) return;
    const ersetzt = state.snapTrash ? `\n\nAchtung: Im Papierkorb liegt schon ein Stand vom ${fmtWhen(state.snapTrash.at)} – der wird dabei ersetzt.` : '';
    if (!confirm('Alle Einträge löschen?\n\nDer Stand wandert in den Papierkorb und lässt sich danach zurückholen – bis du ihn dort endgültig leerst. Ältere Kopien auf diesem Gerät werden entfernt.' + ersetzt)) return;
    await writeSnapshot(KEY_TRASH, packState());
    state.entries = []; state.mornings = []; state.tests = []; mEdit = null; morningDraft = {}; state.dataNote = null;
    closeForm(); lastDeleted = null;
    await save({ skipPrev: true, silent: true });                    // sonst läge das Gelöschte noch einmal im Vorgängerstand
    await dropSnapshot(KEY_PREV);
    for (const k of KEYS_ALT) { try { await window.storage.remove(k); } catch (e) {} }   // Kopien aus der Zeit vor der Umstellung
    state.snapPrev = null;
    state.snapTrash = await readSnapshot(KEY_TRASH);
    announce('Alle Einträge gelöscht. Der Stand liegt im Papierkorb.');
    return render();
  }

  if (act === 'backupFile') {
    const r = await saveBackupFile();
    importMsg = tab === 'data' ? r : null;
    if (tab === 'log') uiFlash = { where: 'backup', ok: r.ok, text: r.text };
    announce(r.text);
    return render();
  }
  if (act === 'restoreSnap') {
    const snap = t.dataset.snap === 'trash' ? state.snapTrash : state.snapPrev;
    if (!snap) return;
    // save() legt den jetzigen Stand automatisch als Vorgänger ab – also umkehrbar
    // Kopieren – sonst teilen sich Verlauf und Papierkorb dieselben Objekte und jede Änderung landet im Papierkorb
    state.entries = JSON.parse(JSON.stringify(snap.entries)); state.mornings = JSON.parse(JSON.stringify(snap.mornings));
    state.tests = JSON.parse(JSON.stringify(snap.tests || [])); mEdit = null;
    state.dataNote = null; importMsg = null;
    closeForm(); lastDeleted = null;
    await save({ silent: true });
    return render();
  }
  if (act === 'emptyTrash') {
    if (!confirm('Papierkorb endgültig leeren? Der gelöschte Stand ist danach wirklich weg.')) return;
    await dropSnapshot(KEY_TRASH);
    state.snapTrash = null;
    return render();
  }
  if (act === 'askPersist') {
    await checkPersistence(true);
    return render();
  }
});

async function readBackupFile(file) {
  if (!file) return;
  try {
    const text = await file.text();
    await applyBackup(text);
  } catch (e) {
    importMsg = { ok:false, text:'Die Datei ließ sich nicht lesen.' };
    render();
  }
}

function onField(ev) {
  if (ev.target.id === 'impfile') {
    const f = ev.target.files && ev.target.files[0];
    ev.target.value = '';   // damit dieselbe Datei erneut gewählt werden kann
    readBackupFile(f);
    return;
  }
  if (ev.target.id === 'impbox') { importBuf = ev.target.value; return; }
  const ep = ev.target.dataset.epath;
  if (ep) { if (mEdit) { mEdit[ep] = ev.target.value; if (ep === 'date') refreshMorningEdit(); } return; }
  const tp = ev.target.dataset.tpath;
  if (tp) { if (testDraft) { testDraft[tp] = ev.target.value; updateTestForm(); } return; }
  const mp = ev.target.dataset.mpath;
  if (mp) { morningDraft[mp] = ev.target.value; return; }
  const p = ev.target.dataset.path;
  if (!p) return;
  const isCb = ev.target.type === 'checkbox';
  setPath(p, isCb ? ev.target.checked : ev.target.value);
  // Kein Neuaufbau beim Tippen – nur die abhängigen Hinweise und der Knopf werden nachgeführt
  if (isCb || p === 'time' || p === 'date') refreshEntryForm();
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);

/* Diagramm: Antippen, Maus, Tastatur. Das Fadenkreuz springt zum nächsten Tag mit
   Werten – man zielt auf ein Datum, nicht auf einen Punkt. */
function chartPick(ev) {
  const svg = ev.target && ev.target.closest ? ev.target.closest('.chart-svg') : null;
  if (!svg || !chartState || !chartState.dataDays.length) return;
  const r = svg.getBoundingClientRect();
  const px = (ev.clientX - r.left) * (chartState.W / r.width);
  const pos = ((px - chartState.M.l) / chartState.pw) * chartState.nDays - 0.5;
  let best = null, dist = Infinity;
  chartState.dataDays.forEach(day => {
    const k = Math.abs(daysBetween(chartState.start, day) - pos);
    if (k < dist) { dist = k; best = day; }
  });
  if (best !== chartState.sel) chartShow(best);
}
document.addEventListener('pointermove', chartPick);
document.addEventListener('pointerdown', chartPick);
document.addEventListener('pointerout', ev => {
  if (ev.pointerType !== 'mouse') return;
  const svg = ev.target && ev.target.closest ? ev.target.closest('.chart-svg') : null;
  if (svg && !svg.contains(ev.relatedTarget)) chartShow(null);
});
document.addEventListener('focusin', ev => {
  const c = ev.target.classList;
  if (c && c.contains('chart-svg') && chartState && chartState.dataDays.length && !chartState.sel)
    chartShow(chartState.dataDays[chartState.dataDays.length - 1]);
});
document.addEventListener('keydown', ev => {
  const c = ev.target.classList;
  if (!c || !c.contains('chart-svg') || !chartState || !chartState.dataDays.length) return;
  const list = chartState.dataDays;
  let i = list.indexOf(chartState.sel);
  if (ev.key === 'ArrowLeft') i = i < 0 ? list.length - 1 : Math.max(0, i - 1);
  else if (ev.key === 'ArrowRight') i = i < 0 ? list.length - 1 : Math.min(list.length - 1, i + 1);
  else if (ev.key === 'Escape') { chartShow(null); return; }
  else return;
  ev.preventDefault();
  chartShow(list[i]);
});
// Tabs: Pfeiltasten wechseln den Bereich (der gewählte Tab ist der einzige mit tabindex 0)
document.addEventListener('keydown', ev => {
  const b = ev.target && ev.target.closest ? ev.target.closest('.tabs [data-tab]') : null;
  if (!b) return;
  const i = TABS.findIndex(([v]) => v === tab);
  let j = null;
  if (ev.key === 'ArrowRight') j = (i + 1) % TABS.length;
  else if (ev.key === 'ArrowLeft') j = (i - 1 + TABS.length) % TABS.length;
  else if (ev.key === 'Home') j = 0;
  else if (ev.key === 'End') j = TABS.length - 1;
  if (j === null) return;
  ev.preventDefault();
  tab = TABS[j][0]; openAcc = null; scaleJump = null; render();
  focusEl(`[data-tab="${tab}"]`);
});

// Nur bei geänderter Breite neu zeichnen – die Bildschirmtastatur ändert nur die Höhe
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (chartOutOfDate()) updateChart();
  }, 150);
});

/* Offline-Cache. Nur unter http(s) möglich – wird die Datei direkt vom Dateisystem
   geöffnet (file://), gibt es keinen Service Worker. Die App läuft dann trotzdem,
   nur eben ohne Offline-Garantie. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { /* ohne Cache weiterarbeiten */ });
  });
}

// Nur für Tests (siehe test/): Uhr, Datenstand und Entwurf von außen setzen
const _test = {
  setNow(f) { _now = f; },
  setState(s) { state.entries = s.entries || []; state.mornings = s.mornings || []; state.tests = s.tests || []; state.loaded = true; invalidate(); },
  setDraft(d, editing) { draft = d; editingId = editing ?? null; },
  setTab(t) { tab = t; },
  ui() { return { tab, formOpen, editingId, testDraft, uiFlash, lastDeleted, draft, mEdit }; },
  setMEdit(m) { mEdit = m; },
  openForm(on) { formOpen = !!on; }
};

load();

</script>
