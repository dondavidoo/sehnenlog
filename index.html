<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Sehnenlog</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%2318211F%22%2F%3E%3Cpath%20d%3D%22M20%2044%20L20%2020%20M20%2032%20Q32%2020%2044%2032%22%20stroke%3D%22%235FB79A%22%20stroke-width%3D%226%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<link rel="manifest" href="manifest.webmanifest">

<style>
html, body { margin: 0; padding: 0; background: #F1F4F5; }
body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }

  :root {
    --paper: #F1F4F5; --card: #FFFFFF; --ink: #18211F; --ink-soft: #5C6A6B;
    --rule: #D2DBDC; --rule-soft: #E5EBEC; --act: #1D5B6E;
    --up: #2E7D5B; --down: #A93B31;
    --up-bg: #E6F1EC; --hold-bg: #F6EEDD; --down-bg: #F7E7E5;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  #root { font-family: var(--sans); color: var(--ink); background: var(--paper); line-height: 1.5;
    -webkit-font-smoothing: antialiased; padding: 20px 14px 48px; }
  #root * { box-sizing: border-box; }
  .boot { padding: 40px 0; text-align: center; color: var(--ink-soft); }
  .wrap { max-width: 640px; margin: 0 auto; }

  .masthead { margin-bottom: 14px; }
  .masthead h1 { margin: 0; font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }
  .masthead p { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-soft); }

  .tabs { display: flex; gap: 5px; margin-bottom: 16px; flex-wrap: wrap; }
  .tabs button { font-family: inherit; font-size: 14px; font-weight: 600; padding: 9px 14px;
    border-radius: 7px; border: 1px solid var(--rule); background: #fff; color: var(--ink-soft); cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }

  .card { background: var(--card); border: 1px solid var(--rule-soft); border-radius: 10px; padding: 18px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 4px; font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  .card .lede { margin: 0 0 14px; font-size: 13.5px; color: var(--ink-soft); }

  .verdict { border: 1px solid var(--rule); border-radius: 10px; padding: 20px; margin-bottom: 14px; }
  .verdict.up { background: var(--up-bg); border-color: #BFDACE; }
  .verdict.hold { background: var(--hold-bg); border-color: #E3D2AE; }
  .verdict.down { background: var(--down-bg); border-color: #E8C4C0; }
  .verdict.none { background: var(--card); }
  .verdict-kicker { font-size: 13px; color: var(--ink-soft); margin: 0 0 6px; }
  .verdict-word { margin: 0; font-size: 32px; font-weight: 680; letter-spacing: -0.03em; line-height: 1.1; }
  .verdict.up .verdict-word { color: var(--up); }
  .verdict.hold .verdict-word { color: #9A6B12; }
  .verdict.down .verdict-word { color: var(--down); }
  .verdict ul { margin: 12px 0 0; padding-left: 18px; font-size: 14px; }
  .verdict li { margin-bottom: 5px; }
  .verdict .todo { margin: 14px 0 0; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.09); font-size: 14px; }

  .field { margin-bottom: 18px; }
  .field > label, .field-label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .hint { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 8px; }

  .scale { display: flex; gap: 3px; }
  .scale button { flex: 1; min-width: 0; height: 42px; font-family: inherit; font-size: 14px;
    font-variant-numeric: tabular-nums; color: var(--ink); background: #EDF1F2;
    border: 1px solid transparent; border-radius: 5px; cursor: pointer; padding: 0; }
  .scale button:hover { background: #E2E9EA; }
  .scale button[aria-pressed="true"] { background: var(--ink); color: #fff; font-weight: 650; }
  .scale-rule { position: relative; height: 17px; margin-top: 4px; font-size: 11.5px; color: var(--ink-soft); }
  .scale-rule span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
  .scale-rule i { position: absolute; top: -4px; width: 1px; height: 6px; background: var(--ink-soft); }

  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { font-family: inherit; font-size: 13.5px; padding: 8px 13px; border-radius: 6px;
    border: 1px solid var(--rule); background: #fff; color: var(--ink); cursor: pointer; }
  .seg button:hover { border-color: var(--act); }
  .seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }

  input[type="text"], input[type="date"], input[type="time"], input[type="number"], textarea {
    width: 100%; font-family: inherit; font-size: 15px; color: var(--ink);
    padding: 9px 11px; border: 1px solid var(--rule); border-radius: 6px; background: #fff; }
  input[type="number"] { -moz-appearance: textfield; }
  textarea { resize: vertical; min-height: 58px; }
  input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--act); outline-offset: 1px; }

  .grid2 { display: flex; gap: 10px; }
  .grid2 > div { flex: 1; min-width: 0; }
  .sublabel { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 3px; display: block; }

  .exrow { background: #F7F9F9; border: 1px solid var(--rule-soft); border-radius: 7px; padding: 10px 11px; margin-bottom: 8px; }
  .exrow-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 7px; }
  .exrow-name { font-size: 14px; font-weight: 600; }
  .exrow-dose { font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; }
  .exrow-in { display: flex; gap: 7px; }
  .exrow-in > div { flex: 1; min-width: 0; }
  .exrow-in input { padding: 7px 8px; font-size: 14px; text-align: center; }
  .exrow-in span { font-size: 11px; color: var(--ink-soft); display: block; text-align: center; margin-bottom: 2px; }

  .check { display: flex; align-items: flex-start; gap: 9px; font-size: 14px; cursor: pointer; margin-bottom: 10px; }
  .check input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--act); }

  .btn { font-family: inherit; font-size: 15px; font-weight: 600; padding: 11px 18px; border-radius: 7px;
    border: 1px solid var(--act); background: var(--act); color: #fff; cursor: pointer; }
  .btn:hover { background: #17495A; }
  .btn.ghost { background: #fff; color: var(--act); }
  .btn.quiet { background: #fff; color: var(--ink-soft); border-color: var(--rule); font-weight: 500; }
  .btn.small { font-size: 13.5px; padding: 8px 13px; }
  .btn[disabled] { opacity: .45; cursor: default; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  .pending { border-left: 3px solid var(--act); }
  .warnbox { background: var(--hold-bg); border: 1px solid #E3D2AE; border-radius: 7px;
    padding: 10px 12px; font-size: 13px; margin: -2px 0 12px; }
  .warnbox b { color: #9A6B12; }

  .row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--rule-soft); }
  .row:last-child { border-bottom: 0; }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font-size: 14.5px; font-weight: 600; }
  .row-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 1px; }
  .del { background: none; border: 0; cursor: pointer; color: var(--rule); font-size: 18px;
    line-height: 1; padding: 4px 2px; flex-shrink: 0; font-family: inherit; }
  .del:hover { color: var(--down); }
  .rowbtns { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
  .edit { background: none; border: 0; cursor: pointer; color: var(--ink-soft); font-size: 11.5px;
    padding: 2px 3px; font-family: inherit; text-decoration: underline; }
  .edit:hover { color: var(--act); }
  .row.editing { background: #EAF1F3; border-radius: 6px; }
  .editbar { background: #EAF1F3; border: 1px solid #C4D7DD; border-radius: 7px;
    padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }
  .editbar b { color: var(--act); }
  .empty { font-size: 14px; color: var(--ink-soft); padding: 6px 0 2px; }

  /* Diagramm */
  .chart-head { display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; flex-wrap: wrap; margin: 2px 0 8px; }
  .chart-title { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  .chart-range button { padding: 5px 10px; font-size: 12.5px; }
  .chart-wrap { position: relative; }
  .chart-svg { display: block; width: 100%; height: auto; touch-action: pan-y; -webkit-tap-highlight-color: transparent; }
  .chart-svg:focus { outline: none; }
  .chart-svg:focus-visible { outline: 2px solid var(--act); outline-offset: 2px; }
  .chart-axis { font-size: 11px; fill: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .chart-label { font-size: 11.5px; font-weight: 600; fill: var(--ink); }
  .chart-halo { paint-order: stroke; stroke: #fff; stroke-width: 3px; stroke-linejoin: round; }
  .chart-tip { position: absolute; top: 0; left: 0; background: #fff; border: 1px solid var(--rule); border-radius: 6px;
    padding: 6px 9px; font-size: 12.5px; line-height: 1.35; box-shadow: 0 2px 8px rgba(24,33,31,.10);
    pointer-events: none; white-space: nowrap; }
  .chart-tip-date { font-weight: 600; margin-bottom: 3px; }
  .chart-tip-row { display: flex; align-items: center; gap: 6px; color: var(--ink-soft); }
  .chart-tip-row i { display: inline-block; width: 12px; height: 2px; border-radius: 1px; }
  .chart-tip-row b { color: var(--ink); font-size: 14px; font-weight: 650; min-width: 10px; }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-soft); margin: 6px 0 2px; }
  .chart-legend span { display: inline-flex; align-items: center; gap: 6px; }

  /* Verlauf: eine Karte pro Tag */
  .day { border: 1px solid var(--rule-soft); border-radius: 8px; margin-top: 12px; overflow: hidden; }
  .day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    padding: 8px 12px; background: #F7F9F9; border-bottom: 1px solid var(--rule-soft); }
  .day-date { font-size: 14px; font-weight: 650; }
  .day-tag { font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
  .day-row { display: flex; gap: 10px; padding: 10px 12px; align-items: flex-start; }
  .day-row + .day-row { border-top: 1px solid var(--rule-soft); }
  .day-row.editing { background: #EAF1F3; }
  .day-time { flex: 0 0 50px; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; padding-top: 1px; }
  .day-main { flex: 1; min-width: 0; }
  .day-title { font-size: 14px; font-weight: 600; }
  .day-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .day-note { font-style: italic; }
  .day-missing .day-title { color: var(--ink-soft); font-weight: 500; }
  .day-side { flex-shrink: 0; text-align: right; }
  .day-val { font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; }
  .day-val b { font-size: 16px; color: var(--ink); font-weight: 650; margin-left: 4px; }
  .day-acts { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 3px; }
  .m-edit { flex: 1; min-width: 0; }
  .infobox { background: #EAF1F3; border: 1px solid #C4D7DD; border-radius: 8px; padding: 12px 14px; font-size: 13.5px; margin-bottom: 14px; }

  .flag { background: var(--down-bg); border: 1px solid #E8C4C0; border-radius: 8px;
    padding: 14px 16px; font-size: 14px; margin-bottom: 14px; }
  .flag b { display: block; margin-bottom: 4px; color: var(--down); }

  .exportbox { width: 100%; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; line-height: 1.45; min-height: 150px; margin-top: 10px; }
  .note { font-size: 12.5px; color: var(--ink-soft); margin-top: 14px; }
  .err { font-size: 13px; color: var(--down); margin-top: 8px; }

  /* Akkordeon (Übungen & Plan) */
  .blockhead { font-size: 15px; font-weight: 650; margin: 20px 0 3px; }
  .blockhead:first-child { margin-top: 0; }
  .blocksub { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 10px; }
  .acc { border: 1px solid var(--rule-soft); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
  .acc > button { width: 100%; text-align: left; font-family: inherit; cursor: pointer; background: #fff;
    border: 0; padding: 13px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .acc > button:hover { background: #F7F9F9; }
  .acc-name { font-size: 14.5px; font-weight: 600; display: block; }
  .acc-meta { font-size: 12px; color: var(--act); font-weight: 600; margin-top: 2px; display: block; }
  .acc-chev { color: var(--rule); font-size: 15px; flex-shrink: 0; }
  .acc-body { padding: 0 14px 14px; border-top: 1px solid var(--rule-soft); background: #FAFCFC; }
  .acc-body h4 { margin: 13px 0 5px; font-size: 12px; color: var(--ink-soft); font-weight: 600;
    letter-spacing: .04em; text-transform: uppercase; }
  .acc-body ul { margin: 0; padding-left: 17px; font-size: 13.5px; }
  .acc-body li { margin-bottom: 4px; }
  .acc-err { background: var(--down-bg); border-radius: 6px; padding: 9px 11px; font-size: 13px; margin-top: 11px; }
  .acc-err b { color: var(--down); }
  .fig { background: #fff; border: 1px solid var(--rule-soft); border-radius: 7px;
    padding: 8px; margin-top: 12px; }
  .fig svg { width: 100%; height: auto; display: block; }

  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0;
    border-bottom: 1px solid var(--rule-soft); font-size: 13.5px; }
  .kv:last-child { border-bottom: 0; }
  .kv b { font-weight: 600; }
  .kv span { color: var(--act); font-weight: 600; white-space: nowrap; }

  .prod { border: 1px solid var(--rule-soft); border-radius: 8px; padding: 13px 14px; margin-bottom: 9px; }
  .prod-name { font-size: 14.5px; font-weight: 650; }
  .prod-price { font-size: 13px; color: var(--act); font-weight: 600; margin: 2px 0 6px; }
  .prod-role { font-size: 13px; color: var(--ink-soft); }

  /* Skalen */
  .sc-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-soft); margin: 0; }
  .sc-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sc-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
  .sc-list { margin-top: 2px; }
  .sc-row { display: grid; grid-template-columns: var(--sc-w, 46px) 1fr; column-gap: 12px; align-items: baseline;
    padding: 9px 0; border-bottom: 1px solid var(--rule-soft); font-size: 14px; }
  .sc-list > .sc-row:last-child { border-bottom: 0; }
  .sc-val { text-align: center; font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums;
    padding: 2px 6px; border-radius: 5px; background: #EDF1F2; color: var(--ink); white-space: nowrap; }
  .sc-val.up { background: var(--up-bg); color: var(--up); }
  .sc-val.hold { background: var(--hold-bg); color: #9A6B12; }
  .sc-val.down { background: var(--down-bg); color: var(--down); }
  .sc-val.act { background: #EAF1F3; color: var(--act); }
  .sc-link { background: none; border: 0; padding: 0; font: inherit; color: var(--act);
    text-decoration: underline; cursor: pointer; white-space: nowrap; }
  .card.sc-target { border-color: var(--act); }

  @media (max-width: 420px) {
    .scale button { height: 38px; font-size: 13px; }
    .verdict-word { font-size: 27px; }
    .grid2 { flex-wrap: wrap; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .btn, .seg button, .scale button, .tabs button { transition: background-color .12s ease, color .12s ease; }
  }

</style>
</head>

<div id="root"><div class="boot">Wird geladen…</div></div>
<script type="module">


/* Lokaler Speicher dieses Geräts. Ersetzt die Artefakt-Schnittstelle der Chat-Version. */
const LOCAL_PREFIX = 'sehnenlog.local:';
let memFallback = {};
let lsOk = true;
try { localStorage.setItem(LOCAL_PREFIX + 'probe', '1'); localStorage.removeItem(LOCAL_PREFIX + 'probe'); }
catch (e) { lsOk = false; }

window.storage = {
  async get(k) {
    const key = LOCAL_PREFIX + k;
    const v = lsOk ? localStorage.getItem(key) : (key in memFallback ? memFallback[key] : null);
    return v === null || v === undefined ? null : { key: k, value: v };
  },
  async set(k, v) {
    const key = LOCAL_PREFIX + k;
    if (lsOk) localStorage.setItem(key, v); else memFallback[key] = v;
    if (!lsOk) throw new Error('Der Browser erlaubt keinen dauerhaften Speicher (privater Modus?). Die Daten gelten nur für diese Sitzung – bitte eine Sicherung erzeugen.');
    return { key: k, value: v };
  }
};

const KEY = 'sehnenlog:v4';
const KEYS_ALT = ['sehnenlog:v3', 'sehnenlog:v2', 'sehnenlog:v1'];   // ältere Formate – bleiben beim Umzug unangetastet liegen
const KEY_PREV  = 'sehnenlog:prev';   // Stand vor der letzten Änderung
const KEY_TRASH = 'sehnenlog:trash';  // Stand vor „Alles löschen“
const KEY_META  = 'sehnenlog:meta';   // u. a. wann zuletzt gesichert wurde

/* ============================================ State */
let state = { entries: [], mornings: [], loaded: false, error: null, dataNote: null, migrationNote: null,
  persist: null, snapPrev: null, snapTrash: null, meta: { lastBackup: null } };
let tab = 'log';
let openAcc = null;
let scaleJump = null;   // { sc, from }: Sprung aus dem Formular in den Skalen-Tab und zurück
let draft = newDraft();
let morningDraft = {};
let exportText = null;
let editingId = null;
let backupText = null;
let importBuf = '';
let importMsg = null;

function nowTime() { const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function today() {
  // Bewusst lokale Datumsteile statt toISOString() – letzteres rechnet auf UTC
  // und liefert in mitteleuropäischer Zeit nachts den Vortag.
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function newDraft() {
  return { date: today(), time: nowTime(), type: 'kraft', ex: {},
    run: { min:'', pace:'', hr:'', intervals:'' }, session: { min:'', hr:'', what:'' },
    painDuring: null, effort: null, collagen: false, progressed: false, note: '' };
}
function fmt(iso) { const [y,m,d] = iso.split('-'); return `${+d}.${+m}.`; }
function fmtWhen(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '–';
  return d.toLocaleDateString('de-DE', { day:'numeric', month:'numeric' })
       + ' um ' + d.toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' });
}
function draftFromEntry(e) {
  const kind = TYPES[e.type] ? TYPES[e.type].kind : 'session';
  const d = newDraft();
  d.date = e.date; d.time = e.time || '';
  d.type = TYPES[e.type] ? e.type : 'crossfit';
  d.painDuring = e.painDuring; d.effort = e.effort;
  d.collagen = !!e.collagen; d.progressed = !!e.progressed;
  d.note = [e.note, e.detail ? 'Alteintrag: ' + e.detail : ''].filter(Boolean).join(' · ');
  if (kind === 'ex') d.ex = JSON.parse(JSON.stringify((e.details || {}).ex || {}));
  else if (kind === 'run') d.run = { min:'', pace:'', hr:'', intervals:'', ...(e.details || {}) };
  else d.session = { min:'', hr:'', what:'', ...(e.details || {}) };
  return d;
}
function daysBetween(a,b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
// Datumsrechnung über UTC, damit die Zeitumstellung keinen Tag verschluckt
function addDays(iso, n) {
  const d = new Date(iso + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function weekday(iso, form) {
  return new Date(iso + 'T12:00:00Z').toLocaleDateString('de-DE', { weekday: form || 'short', timeZone: 'UTC' }).replace(/\.$/, '');
}
function dayLabel(iso) {
  const base = `${weekday(iso)}, ${fmt(iso)}`;
  if (iso === today()) return 'Heute · ' + base;
  if (addDays(iso, 1) === today()) return 'Gestern · ' + base;
  return base;
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================================ Storage */
// Ohne Kennung und Datum lässt sich ein Datensatz weder sortieren noch anzeigen –
// er würde beim Rendern eine Ausnahme werfen und die App unbenutzbar machen.
// Darum an jeder Außengrenze prüfen: beim Laden und beim Einspielen.
const isIsoDate = d => typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d);
function validEntry(e) { return !!e && typeof e === 'object' && !!e.id && isIsoDate(e.date); }
function validRest(r)  { return !!r && typeof r === 'object' && !!r.id && isIsoDate(r.date); }
function validMorning(m) {
  return !!m && typeof m === 'object' && isIsoDate(m.date)
    && (m.skipped === true || (typeof m.pain === 'number' && m.pain >= 0 && m.pain <= 10));
}
function keepValid(list, check) {
  const arr = Array.isArray(list) ? list : [];
  const ok = arr.filter(check);
  return { ok, dropped: arr.length - ok.length };
}
function noteDropped(n) {
  state.dataNote = n
    ? `${n} ${n === 1 ? 'Datensatz war' : 'Datensätze waren'} unvollständig (Kennung oder Datum fehlt) und ${n === 1 ? 'wurde' : 'wurden'} nicht übernommen. Der Rest deiner Daten ist unverändert.`
    : null;
}

// Ein Morgen je Kalendertag – an dem Tag, an dem du aufwachst.
function makeMorning(date, pain, stiff, note) {
  return { id: 'm' + date, date, pain, stiff: stiff || null, note: String(note || '').trim(), skipped: false };
}
function skippedMorning(date) { return { id: 'm' + date, date, pain: null, stiff: null, note: '', skipped: true }; }
function stripEntry(e) {
  const c = { ...e };
  delete c.painMorning; delete c.stiffness; delete c.morningNote; delete c.skipped;
  return c;
}

// Bis v3 hing der Morgenwert an den Einheiten des Vortags (Wert an jeder Einheit
// vom Di = Morgen vom Mi), Morgen nach Ruhetagen lagen getrennt unter „rest“.
// Beides wird hier zu einem Morgen je Kalendertag.
function fromLegacy(rawEntries, rawRest) {
  const e = keepValid(rawEntries, validEntry), r = keepValid(rawRest, validRest);
  const map = new Map();
  let dropped = e.dropped + r.dropped, doppelt = 0;
  [...e.ok].sort((a,b) => String(a.date + (a.time||'')).localeCompare(String(b.date + (b.time||'')))).forEach(x => {
    const md = addDays(x.date, 1);
    if (typeof x.painMorning === 'number') map.set(md, makeMorning(md, x.painMorning, x.stiffness, x.morningNote));
    else if (x.skipped && !map.has(md)) map.set(md, skippedMorning(md));
  });
  r.ok.forEach(x => {
    if (typeof x.pain !== 'number') { dropped++; return; }
    const cur = map.get(x.date);
    if (cur && !cur.skipped) {
      // Doppelt erfasst: der Morgen-Check gewinnt, der zweite Wert bleibt in der Notiz erhalten
      doppelt++;
      const st = STIFF.find(s => s.v === x.stiff);
      const extra = [x.pain !== cur.pain ? 'Schmerz ' + x.pain : '',
        x.stiff !== cur.stiff && st ? 'Sehne steif ' + st.label : '', String(x.note || '').trim()].filter(Boolean).join(', ');
      if (extra) cur.note = [cur.note, 'zweiter Eintrag: ' + extra].filter(Boolean).join(' · ');
    } else map.set(x.date, makeMorning(x.date, x.pain, x.stiff, x.note));
  });
  return { entries: e.ok.map(stripEntry), mornings: [...map.values()], dropped, doppelt, legacy: true };
}

// Nimmt jedes bekannte Format an (v1–v4) und liefert den aktuellen Aufbau – oder null.
function normalize(p) {
  if (Array.isArray(p)) return fromLegacy(p, []);
  if (!p || typeof p !== 'object' || !Array.isArray(p.entries)) return null;
  if (!Array.isArray(p.mornings)) return fromLegacy(p.entries, p.rest);
  const e = keepValid(p.entries, validEntry), m = keepValid(p.mornings, validMorning);
  const map = new Map();
  m.ok.forEach(x => map.set(x.date, x.skipped ? skippedMorning(x.date) : makeMorning(x.date, x.pain, x.stiff, x.note)));
  return { entries: e.ok.map(stripEntry), mornings: [...map.values()], dropped: e.dropped + m.dropped, doppelt: 0, legacy: false };
}

function adopt(n) {
  if (!n) return false;
  state.entries = n.entries;
  state.mornings = n.mornings;
  noteDropped(n.dropped);
  return state.entries.length > 0 || state.mornings.length > 0;
}
function packState() { return { v: 4, entries: state.entries, mornings: state.mornings }; }
function migrationText(n) {
  return 'Morgenwerte stehen jetzt an dem Tag, an dem du aufgewacht bist – nicht mehr beim Training vom Vortag. Deine Daten wurden übernommen, der alte Stand bleibt zusätzlich unverändert gespeichert.'
    + (n.doppelt ? ` Für ${n.doppelt} Morgen gab es zwei Werte (Morgen-Check und „Morgen ohne Training“). Übernommen wurde der Morgen-Check, der zweite Wert steht in der Notiz.` : '');
}

// Rueckfallebenen. Duerfen nie das eigentliche Speichern gefaehrden – darum
// schluckt hier alles seine Fehler und liefert im Zweifel null.
async function writeSnapshot(key, payload) {
  try { await window.storage.set(key, JSON.stringify({ at: new Date().toISOString(), payload })); }
  catch (e) { /* Rueckfallebene ist Kuer, nicht Pflicht */ }
}
async function readSnapshot(key) {
  try {
    const r = await window.storage.get(key);
    if (!r || !r.value) return null;
    const s = JSON.parse(r.value);
    if (!s || !s.at || !s.payload) return null;
    const n = normalize(s.payload);   // auch Zwischenstände aus der Zeit vor der Umstellung
    if (!n || (!n.entries.length && !n.mornings.length)) return null;
    return { at: s.at, entries: n.entries, mornings: n.mornings };
  } catch (e) { return null; }
}
async function dropSnapshot(key) {
  try { await window.storage.set(key, ''); } catch (e) {}
}

async function loadMeta() {
  try {
    const r = await window.storage.get(KEY_META);
    const m = r && r.value ? JSON.parse(r.value) : null;
    state.meta = (m && typeof m === 'object') ? m : { lastBackup: null };
  } catch (e) { state.meta = { lastBackup: null }; }
}
async function markBackup() {
  state.meta.lastBackup = new Date().toISOString();
  try { await window.storage.set(KEY_META, JSON.stringify(state.meta)); } catch (e) {}
}
function backupAge() {
  if (!state.meta || !state.meta.lastBackup) return null;
  const d = new Date(state.meta.lastBackup);
  if (isNaN(d)) return null;
  return Math.max(0, Math.floor((Date.now() - d.getTime()) / 86400000));
}
function backupFaellig() {
  if (!state.entries.length && !state.mornings.length) return false;
  const a = backupAge();
  return a === null || a >= BACKUP_FAELLIG_TAGE;
}

// Ohne Zusage darf der Browser den Speicher raeumen, wenn er Platz braucht.
async function checkPersistence(fragen) {
  if (!navigator.storage || !navigator.storage.persist) { state.persist = 'na'; return; }
  try {
    if (await navigator.storage.persisted()) { state.persist = true; return; }
    state.persist = fragen ? await navigator.storage.persist() : false;
  } catch (e) { state.persist = 'na'; }
}

async function load() {
  let raw = null;
  try { const r = await window.storage.get(KEY); raw = r && r.value ? r.value : null; } catch (e) { raw = null; }
  if (raw) {
    let n = null;
    try { n = normalize(JSON.parse(raw)); } catch (e) { n = null; }
    if (n) adopt(n);
    else state.dataNote = 'Der gespeicherte Stand ließ sich nicht lesen. Spiel deine letzte Sicherung ein oder hol unten im Sicherheitsnetz einen Zwischenstand zurück.';
  } else {
    // Erster Start im neuen Format: ältere Stände übernehmen.
    // Die alten Schlüssel bleiben unangetastet liegen – als Rückfallebene.
    for (const old of KEYS_ALT) {
      let n = null;
      try {
        const r = await window.storage.get(old);
        n = r && r.value ? normalize(JSON.parse(r.value)) : null;
      } catch (e) { n = null; }
      if (n && adopt(n)) {
        state.migrationNote = migrationText(n);
        try { await window.storage.set(KEY, JSON.stringify(packState())); }
        catch (e) { state.error = (e && e.message) ? String(e.message) : String(e); }
        break;
      }
    }
  }
  await loadMeta();
  state.snapPrev  = await readSnapshot(KEY_PREV);
  state.snapTrash = await readSnapshot(KEY_TRASH);
  state.loaded = true;
  render();
  checkPersistence(true).then(render);
}
async function save() {
  try {
    if (!window.storage || typeof window.storage.set !== 'function') throw new Error('window.storage steht in dieser Umgebung nicht zur Verfügung');
    // Den Stand vor dieser Änderung als Rückfallebene behalten
    try {
      const before = await window.storage.get(KEY);
      if (before && before.value) {
        const b = JSON.parse(before.value);
        if (b) await writeSnapshot(KEY_PREV, b);
      }
    } catch (e) { /* ohne Rückfallebene weiter */ }
    await window.storage.set(KEY, JSON.stringify(packState()));
    state.snapPrev = await readSnapshot(KEY_PREV);
    state.error = null;
  } catch (e) {
    state.error = (e && e.message) ? String(e.message) : String(e);
  }
  render();
}

/* ============================================ Logik */
function summary(e) {
  const d = e.details || {};
  if (e.detail) return e.detail;
  const k = TYPES[e.type] ? TYPES[e.type].kind : null;
  if (k === 'ex') {
    const list = Object.entries(d.ex || {}).map(([id,v]) => {
      const ex = EX[id]; if (!ex) return null;
      const b = [];
      if (v.sets) b.push(v.sets + '×');
      if (v.reps) b.push(v.reps + ' ' + UNIT_LABEL[ex.unit]);
      if (v.weight) b.push(v.weight + ' kg');
      return ex.name.split('(')[0].trim() + (b.length ? ' ' + b.join(' ') : '');
    }).filter(Boolean);
    return list.length ? list.join(' · ') : 'keine Übungen erfasst';
  }
  if (k === 'run') {
    const b = [];
    if (d.min) b.push(d.min + ' Min.');
    if (d.pace) b.push(d.pace);
    if (d.hr) b.push('Ø ' + d.hr + ' bpm');
    if (d.intervals) b.push('Intervalle: ' + d.intervals);
    return b.length ? b.join(' · ') : 'keine Angabe';
  }
  if (k === 'session') {
    const b = [];
    if (d.min) b.push(d.min + ' Min.');
    if (d.hr) b.push('Ø ' + d.hr + ' bpm');
    if (d.what) b.push(d.what);
    return b.length ? b.join(' · ') : 'keine Angabe';
  }
  return 'keine Angabe';
}

function collagenGap() {
  if (!draft.collagen || !draft.time || !draft.date) return null;
  const mine = new Date(draft.date + 'T' + draft.time);
  if (isNaN(mine)) return null;
  let best = null;
  state.entries.forEach(e => {
    if (!e.collagen || !e.time || !e.date) return;
    const t = new Date(e.date + 'T' + e.time);
    if (isNaN(t)) return;
    const h = (mine - t) / 3600000;
    if (h > 0 && h < 6 && (best === null || h < best)) best = h;
  });
  return best;
}

function sorted() { return [...state.entries].sort((a,b) => String(a.date + (a.time||'')).localeCompare(String(b.date + (b.time||'')))); }

function entriesOf(date) { return sorted().filter(e => e.date === date); }
function hasTraining(date) { return state.entries.some(e => e.date === date); }
function morningOf(date) { return state.mornings.find(m => m.date === date) || null; }
function upsertMorning(m) { state.mornings = state.mornings.filter(x => x.date !== m.date).concat([m]); }
function maxDuring(date) {
  const v = state.entries.filter(e => e.date === date && typeof e.painDuring === 'number').map(e => e.painDuring);
  return v.length ? Math.max(...v) : null;
}
// Alle Tage mit irgendeinem Eintrag, neueste zuerst
function dayList() {
  const s = new Set();
  state.entries.forEach(e => s.add(e.date));
  state.mornings.forEach(m => s.add(m.date));
  return [...s].sort().reverse();
}

// Trainingstage, jeweils verbunden mit dem Morgen danach – die 24-Stunden-Regel.
// Der Morgen selbst gehört zu dem Tag, an dem du aufwachst.
function days() {
  const map = new Map();
  sorted().forEach(e => {
    if (!map.has(e.date)) map.set(e.date, { date:e.date, n:0, painDuring:null, progressed:false, efforts:[], labels:[] });
    const d = map.get(e.date);
    d.n++;
    d.labels.push(TYPES[e.type] ? TYPES[e.type].label : e.type);
    if (e.painDuring != null) d.painDuring = d.painDuring == null ? e.painDuring : Math.max(d.painDuring, e.painDuring);
    if (e.progressed) d.progressed = true;
    if (e.effort != null) d.efforts.push(e.effort);
  });
  return [...map.values()].sort((a,b) => a.date.localeCompare(b.date)).map(d => {
    const md = addDays(d.date, 1), m = morningOf(md);
    return { ...d, morningDate: md, skipped: !!(m && m.skipped),
      painMorning: m && !m.skipped ? m.pain : null, stiffness: m && !m.skipped ? m.stiff : null };
  });
}
function pending() { return days().filter(d => d.painMorning == null && !d.skipped && d.morningDate <= today()); }

function assess() {
  const all = days();
  const done = all.filter(d => d.painMorning != null);
  if (pending().length) return { tone:'none', word:'Morgen-Check offen', kicker:'Noch keine Bewertung möglich',
    reasons:['Ohne den Wert vom Folgemorgen fehlt der wichtigste Marker.'], todo:'Trag den Morgen-Check oben nach, dann bewerte ich die Einheit.' };
  if (done.length < 2) return { tone:'none', word:'Noch zu wenig Daten', kicker:`${done.length} von 2 bewerteten Trainingstagen`,
    reasons:['Ein Trainingstag gilt als vollständig, sobald am Folgetag der Morgen-Check ausgefüllt ist. Ab dem zweiten vergleiche ich die beiden Morgenwerte miteinander.'], todo:'Weiter erfassen und nichts an der Last ändern.' };

  const last = done[done.length-1], prev = done[done.length-2];
  const stiff = STIFF.find(s => s.v === last.stiffness);
  const stiffMins = stiff ? stiff.mins : 0;
  const delta = last.painMorning - prev.painMorning;
  const red = [], amber = [], green = [];

  if (last.painDuring > 3) red.push(`Höchster Schmerzwert an diesem Tag lag bei ${last.painDuring}/10 – über der 3/10-Grenze.`);
  if (delta >= 2) red.push(`Morgenschmerz ist von ${prev.painMorning} auf ${last.painMorning} gestiegen.`);
  else if (delta === 1) amber.push(`Morgenschmerz ist um einen Punkt gestiegen (${prev.painMorning} → ${last.painMorning}).`);
  if (stiffMins > 45) red.push('Die Sehne war morgens über 45 Minuten steif.');
  else if (stiffMins > 30) amber.push('Die Sehne war morgens 30 bis 45 Minuten steif.');

  const recent = done.slice(-3);
  const calm = recent.length === 3 && recent.every(d => d.painDuring <= 3)
    && recent.every(d => { const s = STIFF.find(x => x.v === d.stiffness); return !s || s.mins <= 30; })
    && recent[2].painMorning <= recent[0].painMorning;

  const lastProgress = [...all].reverse().find(d => d.progressed);
  const sinceProgress = lastProgress ? daysBetween(lastProgress.date, today()) : 999;

  if (calm) {
    green.push('Die letzten drei Trainingstage waren ruhig: Schmerz während ≤ 3/10, Sehne morgens höchstens 30 Minuten steif, Schmerz am Morgen nicht gestiegen.');
    const eff = recent.flatMap(d => d.efforts);
    if (eff.length && Math.max(...eff) <= 6) green.push(`Der letzte Satz fühlte sich zuletzt bei höchstens ${Math.max(...eff)}/10 an – das ist zu leicht.`);
  }

  if (red.length) return { tone:'down', word:'Zurücknehmen', kicker:`Nach dem Trainingstag ${fmt(last.date)}`, reasons:red.concat(amber),
    todo:'Auf das letzte funktionierende Level zurück, dort ein bis zwei Wochen bleiben, dann in kleineren Schritten weiter. Isometrie geht fast immer.' };
  if (amber.length) return { tone:'hold', word:'Level halten', kicker:`Nach dem Trainingstag ${fmt(last.date)}`, reasons:amber,
    todo:'Nichts steigern. Gleiche Last noch einmal wiederholen und beobachten, ob sich der Wert einpendelt.' };
  if (green.length && sinceProgress < 7) return { tone:'hold', word:'Level halten', kicker:'Alles ruhig – aber die Woche ist noch nicht um',
    reasons:green.concat([`Die letzte Steigerung war vor ${sinceProgress} ${sinceProgress===1?'Tag':'Tagen'}. Eine Variable pro Woche.`]),
    todo:`Noch ${7-sinceProgress} ${7-sinceProgress===1?'Tag':'Tage'} auf diesem Level bleiben.` };
  if (green.length) return { tone:'up', word:'Steigern', kicker:'Die Sehne verträgt mehr', reasons:green,
    todo:'Beim Krafttraining zuerst das Gewicht erhöhen, nicht die Wiederholungen. Beim Laufen eine Variable um etwa 10 %. Hak beim nächsten Eintrag „Das war eine Steigerung“ an.' };
  return { tone:'hold', word:'Level halten', kicker:`Nach dem Trainingstag ${fmt(last.date)}`,
    reasons:['Keine Warnzeichen, aber auch noch keine drei durchgehend ruhigen Trainingstage.'],
    todo:'Gleiche Last beibehalten, bis drei Trainingstage in Folge ruhig verlaufen sind.' };
}

// Warnzeichen zählen jeden erfassten Morgen – auch nach Ruhetagen. Gerade in einer
// Trainingspause zeigt nur der Morgen, ob es schlechter wird.
function redFlags() {
  const t = today();
  const recent = state.mornings
    .filter(m => !m.skipped && typeof m.pain === 'number' && m.date <= t && daysBetween(m.date, t) <= 21)
    .sort((a,b) => a.date.localeCompare(b.date));
  const out = [];
  if (recent.filter(m => m.pain >= 6).length >= 3) out.push('Der Morgenschmerz lag in den letzten drei Wochen mehrfach bei 6/10 oder höher.');
  if (recent.filter(m => m.stiff === 'ueber45').length >= 2) out.push('Die Sehne war morgens mehrfach über 45 Minuten steif.');
  if (recent.length >= 4) {
    const f = (recent[0].pain + recent[1].pain) / 2;
    const l = (recent[recent.length - 2].pain + recent[recent.length - 1].pain) / 2;
    if (l - f >= 2) out.push('Der Morgenschmerz steigt über die letzten Wochen kontinuierlich an.');
  }
  return out;
}

function buildExport() {
  const dates = dayList();
  if (!dates.length) return 'Noch keine Einträge.';
  const a = assess();
  const L = ['Sehnenlog – Auswertung bitte', `Stand: ${new Date().toLocaleDateString('de-DE')}`,
    `Einheiten: ${state.entries.length}, erfasste Morgen: ${state.mornings.filter(m => !m.skipped).length}`,
    `Aktuelle Einschätzung der App: ${a.word}`,
    'Schmerzwerte 0–10. Ein Morgenwert gilt jeweils für das Training vom Vortag (24-Stunden-Regel).', ''];
  dates.slice(0, 30).reverse().forEach(date => {
    const list = entriesOf(date), prev = addDays(date, -1), m = morningOf(date);
    L.push(`${weekday(date)}, ${fmt(date)}${list.length ? '' : ' – Ruhetag'}`);
    if (m && !m.skipped) {
      const st = STIFF.find(x => x.v === m.stiff);
      L.push(`  Morgen: Schmerz ${m.pain}/10, Sehne steif ${st ? st.label : '–'}${hasTraining(prev) ? ` (gilt für das Training vom ${fmt(prev)})` : ''}${m.note ? ' – ' + m.note : ''}`);
    } else if (m && m.skipped) L.push('  Morgen: übersprungen');
    else if (hasTraining(prev)) L.push('  Morgen: nicht erfasst');
    list.forEach(e => {
      const parts = [`${e.time || '–'} ${TYPES[e.type] ? TYPES[e.type].label : e.type}: ${summary(e)}`,
        `während ${e.painDuring != null ? e.painDuring + '/10' : '–'}`];
      if (e.effort != null) parts.push(`Anstrengung ${e.effort}/10`);
      parts.push(`Kollagen ${e.collagen ? 'ja' : 'nein'}`);
      if (e.progressed) parts.push('Steigerung');
      L.push('  ' + parts.join(' | '));
      if (e.note) L.push(`    Notiz: ${e.note}`);
    });
    L.push('');
  });
  return L.join('\n').trimEnd();
}

/* ============================================ Diagramm */
// Zwei Reihen, eine Achse (beides Schmerz 0–10). Farben aus einer auf Farbenblindheit
// geprüften Palette – Rot bleibt in der App dem „Zurücknehmen“ vorbehalten.
const C_MORNING = '#2a78d6', C_DURING = '#eb6834';
let chartState = null;   // Geometrie + Tage mit Werten – fürs Antippen, bei jedem Zeichnen neu

function chartWidth() {
  const root = document.getElementById('root');
  const w = root && root.clientWidth ? root.clientWidth : 390;
  // #root: 14px Rand je Seite · .wrap: max. 640px · Karte: 18px Innenabstand + 1px Rand je Seite
  return Math.max(260, Math.min(w - 28, 640) - 38);
}

function chartInnerHtml() {
  const t = today();
  const morn = state.mornings.filter(m => !m.skipped && typeof m.pain === 'number' && m.date <= t)
    .sort((a,b) => a.date.localeCompare(b.date));
  const dur = new Map();
  state.entries.forEach(e => {
    if (typeof e.painDuring !== 'number' || e.date > t) return;
    dur.set(e.date, Math.max(dur.has(e.date) ? dur.get(e.date) : 0, e.painDuring));
  });
  const firstDate = [...morn.map(m => m.date), ...dur.keys()].sort()[0];
  if (!firstDate) { chartState = null; return ''; }

  let start = chartRange === 'all' ? firstDate : addDays(t, -(chartRange - 1));
  if (daysBetween(start, t) < 13) start = addDays(t, -13);   // mindestens zwei Wochen breit
  const nDays = daysBetween(start, t) + 1;

  const W = chartWidth(), H = 200, M = { l: 26, r: 8, t: 14, b: 26 };
  const pw = W - M.l - M.r, ph = H - M.t - M.b;
  // Jeder Tag bekommt eine Spalte: der Morgen links darin, das Training rechts – so, wie der Tag abläuft
  const X = (d, f) => M.l + ((daysBetween(start, d) + f) / nDays) * pw;
  const Y = v => M.t + ph - (v / 10) * ph;
  const n1 = v => v.toFixed(1);

  const mIn = morn.filter(m => m.date >= start);
  const dIn = [...dur.entries()].filter(([d]) => d >= start).sort((a,b) => a[0].localeCompare(b[0]));

  // Y-Achse: Raster als feine, durchgezogene Linien
  let s = '';
  for (let v = 0; v <= 10; v += 2) {
    s += `<line x1="${M.l}" x2="${W - M.r}" y1="${n1(Y(v))}" y2="${n1(Y(v))}" stroke="${v ? '#E5EBEC' : '#C9D3D4'}" stroke-width="1"/>`
       + `<text x="${M.l - 7}" y="${n1(Y(v) + 3.5)}" text-anchor="end" class="chart-axis">${v}</text>`;
  }
  // Die Grenze ist eine Schwelle, kein Raster – deshalb gestrichelt und beschriftet
  s += `<line x1="${M.l}" x2="${W - M.r}" y1="${n1(Y(3))}" y2="${n1(Y(3))}" stroke="#8C9899" stroke-width="1" stroke-dasharray="4 3"/>`
     + `<text x="${M.l + 4}" y="${n1(Y(3) - 5)}" class="chart-axis chart-halo">Grenze 3</text>`;

  // X-Achse: Montage als Raster, Abstand passend zur verfügbaren Breite
  const maxTicks = Math.max(2, Math.floor(pw / 58));
  const step = [7, 14, 28, 56, 91, 182, 364].find(k => nDays / k <= maxTicks) || 364;
  let tick = start, lastX = -Infinity;
  while (new Date(tick + 'T12:00:00Z').getUTCDay() !== 1) tick = addDays(tick, 1);
  for (; tick <= t; tick = addDays(tick, step)) {
    const x = X(tick, 0.5);
    s += `<line x1="${n1(x)}" x2="${n1(x)}" y1="${n1(Y(0))}" y2="${n1(Y(0) + 4)}" stroke="#C9D3D4" stroke-width="1"/>`
       + `<text x="${n1(Math.min(Math.max(x, M.l + 12), W - M.r - 12))}" y="${H - 7}" text-anchor="middle" class="chart-axis">${fmt(tick)}</text>`;
    lastX = x;
  }
  if (W - M.r - lastX > 52) s += `<text x="${W - M.r}" y="${H - 7}" text-anchor="end" class="chart-axis">heute</text>`;

  // Morgen: Linie nur zwischen aufeinanderfolgenden Tagen – eine Lücke bleibt eine Lücke
  let path = '', prev = null;
  mIn.forEach(m => {
    path += `${prev && daysBetween(prev, m.date) === 1 ? 'L' : 'M'}${n1(X(m.date, 0.3))},${n1(Y(m.pain))} `;
    prev = m.date;
  });
  if (path) s += `<path d="${path.trim()}" fill="none" stroke="${C_MORNING}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  s += mIn.map(m => `<circle cx="${n1(X(m.date, 0.3))}" cy="${n1(Y(m.pain))}" r="4" fill="${C_MORNING}" stroke="#fff" stroke-width="2"/>`).join('');
  // Während: einzelne Ringe – zwischen zwei Trainingstagen gibt es keinen Verlauf
  s += dIn.map(([day, v]) => `<circle cx="${n1(X(day, 0.7))}" cy="${n1(Y(v))}" r="4.5" fill="none" stroke="${C_DURING}" stroke-width="2"/>`).join('');

  // Namen am jeweils letzten Punkt – außer sie kämen sich ins Gehege, dann tragen Legende und Antippen
  const lm = mIn[mIn.length - 1], ld = dIn[dIn.length - 1];
  const pM = lm && { x: X(lm.date, 0.3), y: Y(lm.pain), text: 'Morgen' };
  const pD = ld && { x: X(ld[0], 0.7), y: Y(ld[1]), text: 'während' };
  const eng = pM && pD && Math.abs(pM.x - pD.x) < 64 && Math.abs(pM.y - pD.y) < 16;
  if (!eng) [pM, pD].filter(Boolean).forEach(q => {
    const links = q.x - M.l > 64;
    const y = q.y - M.t < 16 ? q.y + 16 : q.y - 8;
    s += `<text x="${n1(links ? q.x - 7 : q.x + 7)}" y="${n1(y)}" text-anchor="${links ? 'end' : 'start'}" class="chart-label chart-halo">${q.text}</text>`;
  });

  if (!mIn.length && !dIn.length) s += `<text x="${n1(M.l + pw / 2)}" y="${n1(M.t + ph / 2)}" text-anchor="middle" class="chart-axis">Keine Werte in diesem Zeitraum</text>`;

  s += `<line class="chart-cross" x1="0" x2="0" y1="${M.t}" y2="${n1(Y(0))}" stroke="#18211F" stroke-width="1" visibility="hidden"/>`
     + `<rect x="${M.l}" y="0" width="${pw}" height="${H}" fill="transparent"/>`;

  const root = document.getElementById('root');
  chartState = { W, M, pw, start, nDays, X, sel: null, rootW: root ? root.clientWidth : null,
    dataDays: [...new Set([...mIn.map(m => m.date), ...dIn.map(([day]) => day)])].sort() };

  const zeitraum = chartRange === 28 ? 'den letzten 4 Wochen' : chartRange === 91 ? 'den letzten 3 Monaten' : `der Zeit seit ${fmt(start)}`;
  return `<div class="chart-head">
      <span class="chart-title">Schmerz 0–10</span>
      <div class="seg chart-range">${[[28, '4 Wochen'], [91, '3 Monate'], ['all', 'alles']].map(([v, l]) =>
        `<button type="button" data-act="chartRange" data-range="${v}" aria-pressed="${chartRange === v}">${l}</button>`).join('')}</div>
    </div>
    <div class="chart-wrap">
      <svg class="chart-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" tabindex="0"
        aria-label="Schmerzverlauf in ${zeitraum}: ${mIn.length} Morgenwerte, ${dIn.length} Trainingstage. Antippen oder Pfeiltasten zeigen die Werte eines Tages; alle Werte stehen auch in der Tagesliste darunter.">${s}</svg>
      <div class="chart-tip" hidden></div>
    </div>
    <div class="chart-legend">
      <span><svg width="22" height="10" aria-hidden="true"><line x1="1" y1="5" x2="21" y2="5" stroke="${C_MORNING}" stroke-width="2"/><circle cx="11" cy="5" r="3.5" fill="${C_MORNING}" stroke="#fff" stroke-width="1.5"/></svg>Schmerz am Morgen</span>
      <span><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="4.2" fill="none" stroke="${C_DURING}" stroke-width="2"/></svg>Schmerz während (höchster Wert des Tages)</span>
    </div>`;
}

function updateChart() {
  const box = document.getElementById('chartbox');
  if (box) box.innerHTML = chartInnerHtml();
}

// Fadenkreuz + Werte eines Tages. Inhalt über textContent – Wert vorne und kräftig.
function chartShow(date) {
  const box = document.getElementById('chartbox');
  if (!box || !chartState) return;
  const tip = box.querySelector('.chart-tip'), cross = box.querySelector('.chart-cross'), svg = box.querySelector('.chart-svg');
  if (!tip || !cross || !svg) return;
  chartState.sel = date || null;
  if (!date) { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); return; }
  const x = chartState.X(date, 0.5);
  cross.setAttribute('x1', x.toFixed(1)); cross.setAttribute('x2', x.toFixed(1)); cross.setAttribute('visibility', 'visible');
  tip.replaceChildren();
  const head = document.createElement('div');
  head.className = 'chart-tip-date';
  head.textContent = `${weekday(date)}, ${fmt(date)}`;
  tip.append(head);
  const m = morningOf(date);
  [[C_MORNING, m && !m.skipped ? m.pain : null, 'Morgen'], [C_DURING, maxDuring(date), 'während']].forEach(([c, v, name]) => {
    const row = document.createElement('div');
    row.className = 'chart-tip-row';
    const key = document.createElement('i');
    key.style.background = c;
    const val = document.createElement('b');
    val.textContent = v == null ? '–' : String(v);
    row.append(key, val, document.createTextNode(name));
    tip.append(row);
  });
  tip.hidden = false;
  const w = svg.getBoundingClientRect().width;
  const px = x * (w / chartState.W);
  tip.style.left = Math.min(Math.max(px - tip.offsetWidth / 2, 0), Math.max(0, w - tip.offsetWidth)) + 'px';
}

// Welcher Morgen fehlt? Pflicht, wenn am Vortag trainiert wurde – sonst heute, freiwillig.
function morningTarget() {
  const pend = pending();
  if (pend.length) return { date: pend[0].morningDate, due: true, left: pend.length - 1 };
  const t = today();
  return morningOf(t) ? null : { date: t, due: false, left: 0 };
}
function morningCardHtml(mt) {
  const prev = addDays(mt.date, -1);
  if (!mt.due && !morningOpen) return `<div class="card">
      <h2>Heute Morgen</h2>
      <p class="lede">Noch nicht eingetragen. Freiwillig, weil gestern kein Training war – hilft aber später zu sehen, wie schnell sich die Sehne erholt.</p>
      <button class="btn ghost" data-act="openMorning">Heute Morgen eintragen</button>
    </div>`;
  const labels = entriesOf(prev).map(e => TYPES[e.type] ? TYPES[e.type].label : e.type);
  const title = mt.date === today() ? 'Wie war es heute Morgen?' : `Wie war es am ${weekday(mt.date, 'long')}morgen, ${fmt(mt.date)}?`;
  const ok = morningDraft.pain != null && !!morningDraft.stiff;
  return `<div class="card${mt.due ? ' pending' : ''}">
      <h2>${esc(title)}</h2>
      <p class="lede">${mt.due
        ? `Gilt für das Training vom ${esc(weekday(prev, 'long'))}, ${fmt(prev)} (${esc(labels.join(', '))}). Ohne diesen Wert kann die App die Einheit nicht bewerten.`
        : 'Freiwillig, weil gestern kein Training war.'}</p>
      ${morningFieldsHtml('m', morningDraft)}
      <div class="btn-row">
        <button class="btn" data-act="saveMorning" data-date="${mt.date}" ${ok ? '' : 'disabled'}>Speichern</button>
        ${mt.due ? `<button class="btn quiet small" data-act="skipMorning" data-date="${mt.date}">Vergessen – überspringen</button>`
                 : '<button class="btn quiet small" data-act="closeMorning">Abbrechen</button>'}
        ${mt.left > 0 ? `<span class="hint" style="margin:0">Danach noch ${mt.left} Morgen offen.</span>` : ''}
      </div>
    </div>`;
}

// Morgen ändern oder nachtragen – im Verlauf, direkt am Tag oder mit frei wählbarem Datum
function morningEditorHtml() {
  const d = mEdit, frei = d.where === 'free', cur = morningOf(d.date);
  const zukunft = !!d.date && d.date > today();
  const ok = isIsoDate(d.date) && !zukunft && d.pain != null && !!d.stiff;
  return `<div class="m-edit">
      <div class="day-title" style="margin-bottom:10px">${frei ? 'Morgen nachtragen' : `Morgen vom ${esc(weekday(d.date))}, ${fmt(d.date)}`}</div>
      ${frei ? `<div class="field"><span class="sublabel">Datum</span>
          <input type="date" value="${esc(d.date)}" max="${today()}" data-epath="date"></div>
        ${zukunft ? '<div class="warnbox">Ein Morgen in der Zukunft lässt sich nicht eintragen.</div>' : ''}
        ${!zukunft && cur && !cur.skipped ? '<div class="warnbox">Für diesen Tag gibt es schon einen Morgenwert. Er wird ersetzt.</div>' : ''}` : ''}
      ${morningFieldsHtml('e', d)}
      <div class="btn-row">
        <button class="btn small" data-act="saveMorningEdit" ${ok ? '' : 'disabled'}>Speichern</button>

function morningRowHtml(date) {
  if (mEdit && mEdit.where === 'day' && mEdit.date === date) return `<div class="day-row editing">${morningEditorHtml()}</div>`;

  const bezug = hasTraining(prev) ? `<div class="day-sub">gilt für das Training vom ${esc(weekday(prev))}, ${fmt(prev)}</div>` : '';
  if (m && !m.skipped) {
    const st = STIFF.find(x => x.v === m.stiff);
    return `<div class="day-row">
        <span class="day-time">Morgen</span>
        <div class="day-main">
          <div class="day-title">Sehne steif: ${st ? esc(st.label) : '–'}</div>

        <div class="day-side">
          <div class="day-val">Schmerz<b>${esc(m.pain)}</b></div>

        </div>

  }
  return `<div class="day-row day-missing">
      <span class="day-time">Morgen</span>

      } Beim Einspielen werden Einheiten mit gleicher Kennung und Morgen mit gleichem Datum ersetzt, alles andere kommt dazu – nichts wird gelöscht. Sicherungen aus der Zeit vor der Umstellung lassen sich ebenfalls einspielen.</p>
      ${importMsg ? `<p class="${importMsg.ok ? 'note' : 'err'}" style="margin-top:6px">${esc(importMsg.text)}</p>` : ''}

      <h4 style="margin:20px 0 6px;font-size:12px;color:var(--ink-soft);font-weight:600;letter-spacing:.04em;text-transform:uppercase">Dauerhafter Speicher</h4>
      ${state.persist === true
        ? '<p class="note" style="margin-top:0">Der Browser hat zugesagt, diese Daten nicht von selbst zu löschen. Das schützt nicht davor, dass du die Browserdaten von Hand löschst – dafür sind die Sicherungen da.</p>'
        : state.persist === false
        ? `<p class="note" style="margin-top:0">Der Browser hat den dauerhaften Speicher <b>nicht</b> zugesagt. Er darf die Daten räumen, wenn er Platz braucht. Was hilft: die App über „Zum Home-Bildschirm“ installieren und sie regelmäßig benutzen – dann wird die Zusage meist erteilt.</p>
           <div class="btn-row" style="margin-top:8px"><button class="btn quiet small" data-act="askPersist">Erneut anfragen</button></div>`
        : state.persist === 'na'
        ? '<p class="note" style="margin-top:0">Dieser Browser kennt die Anfrage nach dauerhaftem Speicher nicht. Sichere entsprechend häufiger.</p>'
        : '<p class="note" style="margin-top:0">Wird geprüft …</p>'}

      <h4 style="margin:20px 0 6px;font-size:12px;color:var(--ink-soft);font-weight:600;letter-spacing:.04em;text-transform:uppercase">Als Text statt als Datei</h4>
      <p class="hint">Falls der Dateiweg auf deinem Gerät klemmt.</p>
      <div class="btn-row">
        <button class="btn quiet small" data-act="backup">Text erzeugen</button>
        ${backupText ? '<button class="btn quiet small" data-act="copyBackup">Kopieren</button>' : ''}
      </div>
      ${backupText ? `<textarea class="exportbox" readonly id="backupbox">${esc(backupText)}</textarea>` : ''}
      <div class="field" style="margin-top:14px">
        <label for="impbox">Text einspielen</label>
        <textarea class="exportbox" id="impbox" placeholder="Hier den kopierten Sicherungstext einfügen">${esc(importBuf)}</textarea>
      </div>
      <button class="btn quiet small" data-act="restore">Text einspielen</button>
    </div>

    <div class="card">
      <h2>Sicherheitsnetz</h2>
      <p class="lede">Zwischenstände auf diesem Gerät. Ersetzen keine Sicherung – aber sie fangen den Fehlgriff ab.</p>
      ${state.snapPrev ? `<div class="row">
        <div class="row-main">
          <div class="row-title">Stand vor der letzten Änderung</div>
          <div class="row-sub">${esc(fmtWhen(state.snapPrev.at))} · ${state.snapPrev.entries.length} ${state.snapPrev.entries.length === 1 ? 'Einheit' : 'Einheiten'}, ${state.snapPrev.mornings.filter(m => !m.skipped).length} Morgen</div>
        </div>
        <button class="btn quiet small" data-act="restoreSnap" data-snap="prev">Zurückholen</button>
      </div>` : ''}
      ${state.snapTrash ? `<div class="row">
        <div class="row-main">
          <div class="row-title">Papierkorb – Stand vor „Alles löschen“</div>
          <div class="row-sub">${esc(fmtWhen(state.snapTrash.at))} · ${state.snapTrash.entries.length} ${state.snapTrash.entries.length === 1 ? 'Einheit' : 'Einheiten'}, ${state.snapTrash.mornings.filter(m => !m.skipped).length} Morgen</div>
        </div>
        <div class="rowbtns">
          <button class="btn quiet small" data-act="restoreSnap" data-snap="trash">Zurückholen</button>
          <button class="edit" data-act="emptyTrash">endgültig leeren</button>
        </div>
      </div>` : ''}
      ${!state.snapPrev && !state.snapTrash ? '<p class="empty">Noch nichts aufgefangen – Zwischenstände entstehen ab der ersten Änderung.</p>' : ''}
      <p class="note">Zurückholen ist selbst wieder umkehrbar: der jetzige Stand wird dabei zum Zwischenstand.</p>
    </div>

    <div class="card">
      <h2>Alles löschen</h2>
      <p class="lede">Setzt das Logbuch zurück. Der Stand wandert vorher in den Papierkorb oben.</p>
      <button class="btn quiet small" data-act="reset">Alles löschen</button>
    </div>`;
}

/* ============================================ Render */
const TABS = [['log','Logbuch'],['scale','Skalen'],['plan','Plan'],['ex','Übungen'],['supp','Supplemente']];

// Notausgang: wirft ein Tab beim Aufbau, bleibt die Seite sonst auf dem alten Stand
// stehen und ist auch nach dem Neuladen tot. Lieber die Rohdaten zum Sichern anbieten.
function crashHtml(err) {
  let dump;
  try { dump = backupPayload(); }
  catch (e) { dump = ''; }
  return `<div class="flag">
      <b>Die Ansicht konnte nicht aufgebaut werden</b>
      <div>Deine Daten sind nicht verloren. Kopier den Text unten und leg ihn beiseite – damit kannst du nach „Alles löschen“ alles wieder einspielen.</div>
      <div style="margin-top:8px;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#fff;border-radius:5px;padding:8px 10px">${esc(err && err.message ? err.message : String(err))}</div>
    </div>
    <div class="card">
      <h2>Rohdaten sichern</h2>
      <p class="lede">Vollständige Kopie deiner Einträge – erst sichern, dann zurücksetzen.</p>
      ${dump ? `<textarea class="exportbox" readonly>${esc(dump)}</textarea>` : '<p class="err">Die Daten ließen sich nicht in Text umwandeln.</p>'}
      <div class="btn-row" style="margin-top:10px"><button class="btn quiet small" data-act="reset">Alles löschen</button></div>
    </div>`;
}

function render() {
  if (!state.loaded) return;
  let body;
  try {
    body = tab === 'plan' ? tabPlan() : tab === 'ex' ? tabEx() : tab === 'supp' ? tabSupp() : tab === 'scale' ? tabScales() : tabLog();
  } catch (err) {
    body = crashHtml(err);
  }
  document.getElementById('root').innerHTML = `<div class="wrap">
    <div class="masthead">
      <h1>Sehnenlog</h1>
      <p>Plan, Übungen und Trainingstagebuch für die Tibialis-posterior-Sehne. Offline-Version, gespeichert auf diesem Gerät.</p>
    </div>
    <div class="tabs" role="tablist">
      ${TABS.map(([v,l]) => `<button role="tab" data-tab="${v}" aria-selected="${tab===v}">${l}</button>`).join('')}
    </div>
    ${body}
  </div>`;
  // Das Diagramm rechnet in echten Pixeln – hat sich die Breite beim Aufbau verschoben, neu zeichnen
  const root = document.getElementById('root');
  if (tab === 'log' && chartState && root.clientWidth !== chartState.rootW) updateChart();
}

/* ============================================ Sicherung */
function backupPayload() {
  return JSON.stringify({ app:'sehnenlog', v:4, exported:new Date().toISOString(),
    entries: state.entries, mornings: state.mornings });
}

// Auf dem Handy ist das Teilen-Blatt der richtige Weg (dort landet OneDrive),
// am Rechner ein normaler Download. Beides zaehlt als erfolgte Sicherung.
async function saveBackupFile() {
  const name = `sehnenlog-${today()}.json`;
  const text = backupPayload();
  try {
    const file = new File([text], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Sehnenlog-Sicherung' });
      await markBackup();
      return { ok: true, text: 'Sicherung geteilt. Leg sie in OneDrive ab, dann ist sie vom Gerät unabhängig.' };
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return { ok: false, text: 'Abgebrochen – es wurde nichts gesichert.' };
    // sonst faellt es unten auf den Download zurueck
  }
  try {
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    await markBackup();
    return { ok: true, text: `Gespeichert als ${name}. Leg die Datei in OneDrive, dann überlebt sie dieses Gerät.` };
  } catch (e) {
    return { ok: false, text: 'Die Datei ließ sich nicht erzeugen. Nimm den Textweg weiter unten.' };
  }
}

// Gemeinsamer Weg fuer Textfeld und Datei. Nimmt auch Sicherungen aus der Zeit
// vor der Umstellung an und rechnet sie um.
async function applyBackup(raw) {
  if (!raw || !raw.trim()) {
    importMsg = { ok:false, text:'Das Feld ist leer. Füg zuerst den Sicherungstext ein oder wähl eine Datei.' };
    return render();
  }
  // Erst vollständig einlesen und prüfen, dann anwenden – sonst landen bei einem
  // Fehlschlag halbe Daten im Speicher, während die Meldung „ungültig“ behauptet.
  let n = null;
  try { n = normalize(JSON.parse(raw)); } catch (e) { n = null; }
  if (!n) {
    importMsg = { ok:false, text:'Das war keine gültige Sicherung. Nimm die komplette Datei bzw. den kompletten Text, ohne etwas wegzulassen. Es wurde nichts verändert.' };
    return render();
  }
  let neu = 0, ersetzt = 0, mNeu = 0, mErsetzt = 0;
  n.entries.forEach(e => {
    const i = state.entries.findIndex(x => x.id === e.id);
    if (i >= 0) { state.entries[i] = e; ersetzt++; } else { state.entries.push(e); neu++; }
  });
  n.mornings.forEach(m => {
    const cur = morningOf(m.date);
    if (!cur) { state.mornings.push(m); mNeu++; }
    else if (m.skipped && !cur.skipped) { /* einen echten Wert nicht durch „übersprungen“ ersetzen */ }
    else { upsertMorning(m); mErsetzt++; }
  });
  importBuf = ''; exportText = null; state.dataNote = null; mEdit = null;
  importMsg = { ok:true, text:
    `Einheiten: ${neu} neu, ${ersetzt} aktualisiert. Morgen: ${mNeu} neu, ${mErsetzt} aktualisiert. Insgesamt ${state.entries.length} ${state.entries.length === 1 ? 'Einheit' : 'Einheiten'}.`
    + (n.dropped ? ` ${n.dropped} unvollständige ${n.dropped === 1 ? 'Zeile wurde' : 'Zeilen wurden'} übersprungen.` : '')
    + (n.doppelt ? ` Bei ${n.doppelt} Morgen gab es zwei Werte – übernommen wurde der Morgen-Check, der zweite steht in der Notiz.` : '') };
  await save();
}

/* ============================================ Events */
function setPath(path, val) {
  const p = path.split('.');
  let o = draft;
  for (let i = 0; i < p.length - 1; i++) o = o[p[i]];
  o[p[p.length-1]] = val;
}

document.addEventListener('click', async (ev) => {
  if (chartState && chartState.sel && !(ev.target.closest && ev.target.closest('.chart-svg'))) chartShow(null);
  const t = ev.target.closest('[data-scale],[data-seg],[data-act],[data-tab],[data-extoggle],[data-acc]');
  if (!t) return;

  if (t.dataset.tab) { tab = t.dataset.tab; openAcc = null; scaleJump = null; window.scrollTo(0,0); return render(); }
  if (t.dataset.acc) { openAcc = openAcc === t.dataset.acc ? null : t.dataset.acc; return render(); }
  if (t.dataset.extoggle) {
    const id = t.dataset.extoggle;
    if (draft.ex[id]) delete draft.ex[id]; else draft.ex[id] = { sets:'', reps:'', weight:'' };
    return render();
  }
  if (t.dataset.scale) {
    const v = +t.dataset.val;
    if (t.dataset.scale === 'mPain') morningDraft.pain = v;
    else if (t.dataset.scale === 'ePain') { if (mEdit) mEdit.pain = v; }
    else draft[t.dataset.scale] = v;
    return render();
  }
  if (t.dataset.seg) {
    if (t.dataset.seg === 'mStiff') morningDraft.stiff = t.dataset.val;
    else if (t.dataset.seg === 'eStiff') { if (mEdit) mEdit.stiff = t.dataset.val; }
    else { draft.type = t.dataset.val; draft.ex = {}; }
    return render();
  }

  const act = t.dataset.act;
  if (act === 'gotoScale') {
    const sc = t.dataset.sc, from = t.dataset.from;
    scaleJump = { sc, from };
    tab = 'scale'; openAcc = null;
    render();
    document.getElementById('sc-' + sc)?.scrollIntoView({ block:'start' });
    return;
  }
  if (act === 'backFromScale') {
    const from = scaleJump && scaleJump.from;
    scaleJump = null; tab = 'log';
    render();
    const el = from && document.getElementById(from);
    if (el) el.scrollIntoView({ block:'center' }); else window.scrollTo(0,0);
    return;
  }
  if (act === 'setToday') { draft.date = today(); draft.time = nowTime(); return render(); }
  if (act === 'saveEntry') {
    const kind = TYPES[draft.type].kind;
    const details = kind === 'ex' ? { ex: JSON.parse(JSON.stringify(draft.ex)) }
      : kind === 'run' ? { ...draft.run } : { ...draft.session };
    const base = { date:draft.date, time:draft.time, type:draft.type, details,
      painDuring:draft.painDuring, effort: draft.type === 'kraft' ? draft.effort : null,
      collagen:draft.collagen, progressed:draft.progressed, note:draft.note.trim() };

    if (editingId) {
      // Morgenwerte hängen nicht mehr an der Einheit – Umdatieren ist deshalb unkritisch
      const e = state.entries.find(x => x.id === editingId);
      if (e) Object.assign(e, base);
      editingId = null;
    } else {
      state.entries.push({ id:'e'+Date.now(), ...base });
    }
    draft = newDraft(); exportText = null; await save();
  }
  if (act === 'edit') {
    const e = state.entries.find(x => x.id === t.dataset.id);
    if (e) { editingId = e.id; draft = draftFromEntry(e); render(); document.getElementById('form')?.scrollIntoView({ block:'start', behavior:'smooth' }); }
    return;
  }
  if (act === 'cancelEdit') { editingId = null; draft = newDraft(); return render(); }

  if (act === 'saveMorning') {
    const date = t.dataset.date;
    if (!isIsoDate(date) || morningDraft.pain == null || !morningDraft.stiff) return;
    upsertMorning(makeMorning(date, morningDraft.pain, morningDraft.stiff, morningDraft.note));
    morningDraft = {}; morningOpen = false; exportText = null; await save();
  }
  if (act === 'skipMorning') {
    const date = t.dataset.date;
    if (!isIsoDate(date)) return;
    upsertMorning(skippedMorning(date));
    morningDraft = {}; await save();
  }
  if (act === 'openMorning') { morningOpen = true; return render(); }
  if (act === 'closeMorning') { morningOpen = false; morningDraft = {}; return render(); }
  if (act === 'editMorning') {
    const date = t.dataset.date, m = morningOf(date);
    mEdit = { date, pain: m && !m.skipped ? m.pain : null, stiff: m && !m.skipped ? m.stiff : null,
      note: m ? m.note || '' : '', where: 'day' };
    return render();
  }
  if (act === 'addMorning') {
    mEdit = { date: today(), pain: null, stiff: null, note: '', where: 'free' };
    render();
    document.querySelector('.m-edit')?.scrollIntoView({ block: 'center' });
    return;
  }
  if (act === 'saveMorningEdit') {
    if (!mEdit || !isIsoDate(mEdit.date) || mEdit.date > today() || mEdit.pain == null || !mEdit.stiff) return;
    upsertMorning(makeMorning(mEdit.date, mEdit.pain, mEdit.stiff, mEdit.note));
    mEdit = null; exportText = null; await save();
  }
  if (act === 'cancelMorningEdit') { mEdit = null; return render(); }
  if (act === 'delMorning') {
    if (!mEdit || !confirm(`Morgenwert vom ${fmt(mEdit.date)} entfernen?`)) return;
    const date = mEdit.date;
    state.mornings = state.mornings.filter(x => x.date !== date);
    mEdit = null; exportText = null; await save();
  }
  if (act === 'moreDays') { histDays += 14; return render(); }
  if (act === 'chartRange') { chartRange = t.dataset.range === 'all' ? 'all' : +t.dataset.range; updateChart(); return; }
  if (act === 'dismissMigration') { state.migrationNote = null; return render(); }

  if (act === 'del') { if (editingId === t.dataset.id) { editingId = null; draft = newDraft(); } state.entries = state.entries.filter(x => x.id !== t.dataset.id); exportText = null; await save(); }
  if (act === 'export') { exportText = buildExport(); render(); document.getElementById('exportbox')?.scrollIntoView({block:'nearest'}); }
  if (act === 'copy') {
    const box = document.getElementById('exportbox');
    if (box) {
      box.select();
      try { await navigator.clipboard.writeText(box.value); } catch (e) { document.execCommand('copy'); }
      t.textContent = 'Kopiert'; setTimeout(() => { t.textContent = 'Kopieren'; }, 1600);
    }
  }
  if (act === 'retrySave') { await save(); return; }
  if (act === 'backup') {
    backupText = backupPayload();
    importMsg = null; render();
    document.getElementById('backupbox')?.scrollIntoView({ block:'nearest' });
    return;
  }
  if (act === 'copyBackup') {
    const box = document.getElementById('backupbox');
    if (box) {
      box.select();
      try { await navigator.clipboard.writeText(box.value); } catch (e) { document.execCommand('copy'); }
      await markBackup();
      t.textContent = 'Kopiert'; setTimeout(() => { t.textContent = 'Kopieren'; }, 1600);
    }
    return;
  }
  if (act === 'restore') {
    const box = document.getElementById('impbox');
    const raw = (box && box.value ? box.value : importBuf) || '';
    await applyBackup(raw);
    return;
  }
  if (act === 'reset') {
    if (!state.entries.length && !state.mornings.length) return;
    if (!confirm('Alle Einträge löschen?\n\nDer Stand wandert in den Papierkorb und lässt sich danach zurückholen – bis du ihn dort endgültig leerst.')) return;
    await writeSnapshot(KEY_TRASH, packState());
    state.entries = []; state.mornings = []; mEdit = null; morningDraft = {}; exportText = null; state.dataNote = null;
    await save();
    state.snapTrash = await readSnapshot(KEY_TRASH);
    return render();
  }

  if (act === 'backupFile') {
    const r = await saveBackupFile();
    importMsg = r;
    return render();
  }
  if (act === 'restoreSnap') {
    const snap = t.dataset.snap === 'trash' ? state.snapTrash : state.snapPrev;
    if (!snap) return;
    // save() legt den jetzigen Stand automatisch als Vorgänger ab – also umkehrbar
    state.entries = snap.entries; state.mornings = snap.mornings; mEdit = null;
    exportText = null; state.dataNote = null; importMsg = null;
    await save();
    return render();
  }
  if (act === 'emptyTrash') {
    if (!confirm('Papierkorb endgültig leeren? Der gelöschte Stand ist danach wirklich weg.')) return;
    await dropSnapshot(KEY_TRASH);
    state.snapTrash = null;
    return render();
  }
  if (act === 'askPersist') {
    await checkPersistence(true);
    return render();
  }
});

async function readBackupFile(file) {
  if (!file) return;
  try {
    const text = await file.text();
    await applyBackup(text);
  } catch (e) {
    importMsg = { ok:false, text:'Die Datei ließ sich nicht lesen.' };
    render();
  }
}

function onField(ev) {
  if (ev.target.id === 'impfile') {
    const f = ev.target.files && ev.target.files[0];
    ev.target.value = '';   // damit dieselbe Datei erneut gewaehlt werden kann
    readBackupFile(f);
    return;
  }
  if (ev.target.id === 'impbox') { importBuf = ev.target.value; return; }
  const ep = ev.target.dataset.epath;
  if (ep) { if (mEdit) mEdit[ep] = ev.target.value; if (ep === 'date' && ev.type === 'change') render(); return; }
  const mp = ev.target.dataset.mpath;
  if (mp) { morningDraft[mp] = ev.target.value; return; }
  const p = ev.target.dataset.path;
  if (!p) return;
  const isCb = ev.target.type === 'checkbox';
  setPath(p, isCb ? ev.target.checked : ev.target.value);
  // Neu zeichnen erst, wenn das Feld fertig ist – sonst springt der Fokus beim Tippen
  if (isCb || (ev.type === 'change' && (p === 'time' || p === 'date'))) render();
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);

/* Diagramm: Antippen, Maus, Tastatur. Das Fadenkreuz springt zum nächsten Tag mit
   Werten – man zielt auf ein Datum, nicht auf einen Punkt. */
function chartPick(ev) {
  const svg = ev.target && ev.target.closest ? ev.target.closest('.chart-svg') : null;
  if (!svg || !chartState || !chartState.dataDays.length) return;
  const r = svg.getBoundingClientRect();
  const px = (ev.clientX - r.left) * (chartState.W / r.width);
  const pos = ((px - chartState.M.l) / chartState.pw) * chartState.nDays - 0.5;
  let best = null, dist = Infinity;
  chartState.dataDays.forEach(day => {
    const k = Math.abs(daysBetween(chartState.start, day) - pos);
    if (k < dist) { dist = k; best = day; }
  });
  if (best !== chartState.sel) chartShow(best);
}
document.addEventListener('pointermove', chartPick);
document.addEventListener('pointerdown', chartPick);
document.addEventListener('pointerout', ev => {
  if (ev.pointerType !== 'mouse') return;
  const svg = ev.target && ev.target.closest ? ev.target.closest('.chart-svg') : null;
  if (svg && !svg.contains(ev.relatedTarget)) chartShow(null);
});
document.addEventListener('focusin', ev => {
  const c = ev.target.classList;
  if (c && c.contains('chart-svg') && chartState && chartState.dataDays.length && !chartState.sel)
    chartShow(chartState.dataDays[chartState.dataDays.length - 1]);
});
document.addEventListener('keydown', ev => {
  const c = ev.target.classList;
  if (!c || !c.contains('chart-svg') || !chartState || !chartState.dataDays.length) return;
  const list = chartState.dataDays;
  let i = list.indexOf(chartState.sel);
  if (ev.key === 'ArrowLeft') i = i < 0 ? list.length - 1 : Math.max(0, i - 1);
  else if (ev.key === 'ArrowRight') i = i < 0 ? list.length - 1 : Math.min(list.length - 1, i + 1);
  else if (ev.key === 'Escape') { chartShow(null); return; }
  else return;
  ev.preventDefault();
  chartShow(list[i]);
});
// Nur bei geänderter Breite neu zeichnen – die Bildschirmtastatur ändert nur die Höhe
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const root = document.getElementById('root');
    if (root && chartState && root.clientWidth !== chartState.rootW) updateChart();
  }, 150);
});

/* Offline-Cache. Nur unter http(s) moeglich – wird die Datei direkt vom Dateisystem
   geoeffnet (file://), gibt es keinen Service Worker. Die App laeuft dann trotzdem,
   nur eben ohne Offline-Garantie. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { /* ohne Cache weiterarbeiten */ });
  });
}

load();

</script>
