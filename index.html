<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F1F4F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121716" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sehnenlog">
<meta name="description" content="Trainingstagebuch und Reha-Plan für die Tibialis-posterior-Sehne">
<title>Sehnenlog</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%2318211F%22%2F%3E%3Cpath%20d%3D%22M20%2044%20L20%2020%20M20%2032%20Q32%2020%2044%2032%22%20stroke%3D%22%235FB79A%22%20stroke-width%3D%226%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
html, body { margin: 0; padding: 0; background: var(--paper); }
body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }

  :root {
    color-scheme: light;
    --paper: #F1F4F5; --card: #FFFFFF; --ink: #18211F; --ink-soft: #5C6A6B;
    --rule: #D2DBDC; --rule-soft: #E5EBEC; --rule-strong: #849192; --placeholder: #6E7778;
    --act: #1D5B6E; --act-hover: #17495A; --act-ink: #1D5B6E; --on-act: #FFFFFF; --on-ink: #FFFFFF;
    --up: #2E7D5B; --up-ink: #276B4E; --down: #A93B31; --hold-ink: #84590C;
    --up-bg: #E6F1EC; --hold-bg: #F6EEDD; --down-bg: #F7E7E5;
    --up-border: #BFDACE; --hold-border: #E3D2AE; --down-border: #E8C4C0;
    --surface-1: #FAFCFC; --surface-2: #F7F9F9; --surface-3: #EDF1F2; --surface-3h: #E2E9EA;
    --tint: #EAF1F3; --tint-border: #C4D7DD;
    --chart-grid: #E5EBEC; --chart-axis: #C9D3D4; --chart-limit: #8C9899; --c-morning: #2a78d6; --c-during: #eb6834;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  /* Dunkel: eigene Stufen derselben Töne – gedämpft, nicht schwarz. Zeichnungen bleiben auf Weiß. */
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --paper: #121716; --card: #1B2221; --ink: #E6ECEA; --ink-soft: #9FACAD;
      --rule: #3A4645; --rule-soft: #2A3332; --rule-strong: #6B7A7A; --placeholder: #7F8C8D;
      --act: #2F7A90; --act-hover: #3A8DA5; --act-ink: #7FC0D2; --on-act: #FFFFFF; --on-ink: #121716;
      --up: #7AC7A2; --up-ink: #7AC7A2; --down: #E0857A; --hold-ink: #E0B35A;
      --up-bg: #1E3A2E; --hold-bg: #3A3120; --down-bg: #3E2422;
      --up-border: #2F5A45; --hold-border: #5A4A25; --down-border: #5E3330;
      --surface-1: #1F2726; --surface-2: #222B2A; --surface-3: #2A3433; --surface-3h: #33403E;
      --tint: #1E2F35; --tint-border: #2F4A54;
      --chart-grid: #2A3332; --chart-axis: #3A4645; --chart-limit: #7B8A8B; --c-morning: #5FA0E8; --c-during: #F08A5B;
    }
  }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #root { --gutter: 14px; font-family: var(--sans); color: var(--ink); background: var(--paper); line-height: 1.5;
    -webkit-font-smoothing: antialiased; padding: 20px var(--gutter) 48px;
    padding-left: max(var(--gutter), env(safe-area-inset-left)); padding-right: max(var(--gutter), env(safe-area-inset-right)); }
  #root * { box-sizing: border-box; }
  .boot { padding: 40px 0; text-align: center; color: var(--ink-soft); }
  .wrap { max-width: 640px; margin: 0 auto; }

  .masthead { margin-bottom: 14px; }
  .masthead h1 { margin: 0; font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }
  .masthead p { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-soft); }
  .txt { font-size: 13.5px; margin: 0; }
  .txt-gap { margin-top: 13px; }
  .txt.soft { color: var(--ink-soft); }

  .tabs { display: flex; gap: 5px; margin-bottom: 16px; flex-wrap: wrap; }
  .tabs button { font-family: inherit; font-size: 14px; font-weight: 600; padding: 9px 14px; min-height: 40px;
    border-radius: 7px; border: 1px solid var(--rule); background: var(--card); color: var(--ink-soft); cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }

  .card { background: var(--card); border: 1px solid var(--rule-soft); border-radius: 10px; padding: 18px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 4px; font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  .card .lede { margin: 0 0 14px; font-size: 13.5px; color: var(--ink-soft); }

  .verdict { border: 1px solid var(--rule); border-radius: 10px; padding: 20px; margin-bottom: 14px; }
  .verdict.up { background: var(--up-bg); border-color: var(--up-border); }
  .verdict.hold { background: var(--hold-bg); border-color: var(--hold-border); }
  .verdict.down { background: var(--down-bg); border-color: var(--down-border); }
  .verdict.none { background: var(--card); }
  .verdict-kicker { font-size: 13px; color: var(--ink-soft); margin: 0 0 6px; }
  .verdict-word { margin: 0; font-size: 32px; font-weight: 680; letter-spacing: -0.03em; line-height: 1.1; }
  .verdict.up .verdict-word { color: var(--up); }
  .verdict.hold .verdict-word { color: var(--hold-ink); }
  .verdict.down .verdict-word { color: var(--down); }
  .verdict ul { margin: 12px 0 0; padding-left: 18px; font-size: 14px; }
  .verdict li { margin-bottom: 5px; }
  .verdict .todo { margin: 14px 0 0; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.09); font-size: 14px; }

  .field { margin-bottom: 18px; }
  .field > label, .field-label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .hint { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 8px; }

  .scale { display: grid; grid-template-columns: repeat(11, 1fr); gap: 3px; }
  .scale button { min-width: 0; height: 42px; font-family: inherit; font-size: 14px;
    font-variant-numeric: tabular-nums; color: var(--ink); background: var(--surface-3);
    border: 1px solid transparent; border-radius: 5px; cursor: pointer; padding: 0; }
  .scale button:hover { background: var(--surface-3h); }
  .scale button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); font-weight: 650; }
  .scale button.ok { box-shadow: inset 0 -3px 0 var(--up); }
  .scale button.ok[aria-pressed="true"] { box-shadow: none; }
  .scale-note { font-size: 12px; color: var(--ink-soft); margin: 5px 0 0; }

  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { font-family: inherit; font-size: 13.5px; padding: 8px 13px; min-height: 36px; border-radius: 6px;
    border: 1px solid var(--rule); background: var(--card); color: var(--ink); cursor: pointer; }
  .seg button:hover { border-color: var(--act); }
  .seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); font-weight: 600; }

  input[type="text"], input[type="date"], input[type="time"], input[type="number"], textarea {
    width: 100%; font-family: inherit; font-size: 16px; color: var(--ink);   /* unter 16px zoomt iOS beim Fokussieren */
    padding: 9px 11px; border: 1px solid var(--rule-strong); border-radius: 6px; background: var(--card); }
  input::placeholder, textarea::placeholder { color: var(--placeholder); opacity: 1; }
  input[type="number"] { -moz-appearance: textfield; }
  textarea { resize: vertical; min-height: 58px; }
  input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--act); outline-offset: 1px; }

  .grid2 { display: flex; gap: 10px; }
  .grid2 > div { flex: 1; min-width: 0; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .grid4 > div { min-width: 0; }
  .subfield { margin: -2px 0 12px 25px; }
  .sublabel { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 3px; display: block; }

  .exrow { background: var(--surface-2); border: 1px solid var(--rule-soft); border-radius: 7px; padding: 10px 11px; margin-bottom: 8px; }
  .exrow-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 7px; }
  .exrow-name { font-size: 14px; font-weight: 600; }
  .exrow-dose { font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; }
  .exrow-in { display: flex; gap: 7px; }
  .exrow-in > div { flex: 1; min-width: 0; }
  .exrow-in input { padding: 7px 6px; font-size: 16px; text-align: center; }
  .exrow-in label { font-size: 12.5px; color: var(--ink-soft); display: block; text-align: center; margin-bottom: 2px; }
  .exblock { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 12px 0 6px; }
  .exblock:first-of-type { margin-top: 0; }
  .exblock-name { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
  .exblock .sc-link, .exrow-last .sc-link { font-size: 12.5px; }
  .exrow-last { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--ink-soft); margin-top: 7px; }
  /* Monatstest-Tabelle */
  .ttab { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 12px; font-variant-numeric: tabular-nums; }
  .ttab th, .ttab td { text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--rule-soft); }
  .ttab th { font-size: 12px; font-weight: 600; color: var(--ink-soft); }
  .ttab th:first-child, .ttab td:first-child { text-align: left; }
  .ttab tr:last-child td { border-bottom: 0; }

  .check { display: flex; align-items: flex-start; gap: 9px; font-size: 14px; cursor: pointer; margin-bottom: 10px; }
  .check input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--act); }

  .btn { font-family: inherit; font-size: 15px; font-weight: 600; padding: 11px 18px; border-radius: 7px;
    border: 1px solid var(--act); background: var(--act); color: var(--on-act); cursor: pointer; }
  .btn:hover { background: var(--act-hover); }
  .btn.ghost { background: var(--card); color: var(--act-ink); }
  .btn.quiet { background: var(--card); color: var(--ink-soft); border-color: var(--rule); font-weight: 500; }
  .btn.small { font-size: 13.5px; padding: 8px 13px; }
  .btn[disabled] { opacity: .45; cursor: default; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  .pending { border-left: 3px solid var(--act); }
  .warnbox { background: var(--hold-bg); border: 1px solid var(--hold-border); border-radius: 7px;
    padding: 10px 12px; font-size: 13px; margin: -2px 0 12px; }
  .warnbox b { color: var(--hold-ink); }

  .row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--rule-soft); }
  .row:last-child { border-bottom: 0; }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font-size: 14.5px; font-weight: 600; }
  .row-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 1px; }
  .rowbtns { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
  .edit { background: none; border: 0; cursor: pointer; color: var(--ink-soft); font-size: 13px;
    padding: 6px 8px; min-height: 32px; font-family: inherit; text-decoration: underline; }
  .edit:hover { color: var(--act); }
  .editbar { background: var(--tint); border: 1px solid var(--tint-border); border-radius: 7px;
    padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }
  .editbar b { color: var(--act-ink); }
  .empty { font-size: 14px; color: var(--ink-soft); padding: 6px 0 2px; }

  /* Diagramm */
  .chart-head { display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; flex-wrap: wrap; margin: 2px 0 8px; }
  .chart-title { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  .chart-range button { padding: 6px 12px; min-height: 32px; font-size: 12.5px; }
  .chart-wrap { position: relative; }
  .chart-svg { display: block; width: 100%; height: auto; touch-action: pan-y; -webkit-tap-highlight-color: transparent; }
  .chart-svg:focus { outline: none; }
  .chart-svg:focus-visible { outline: 2px solid var(--act); outline-offset: 2px; }
  .chart-axis { font-size: 11px; fill: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .chart-label { font-size: 11.5px; font-weight: 600; fill: var(--ink); }
  .chart-halo { paint-order: stroke; stroke: var(--card); stroke-width: 3px; stroke-linejoin: round; }
  .chart-tip { position: absolute; top: 0; left: 0; background: var(--card); border: 1px solid var(--rule); border-radius: 6px;
    padding: 6px 9px; font-size: 12.5px; line-height: 1.35; box-shadow: 0 2px 8px rgba(24,33,31,.10);
    pointer-events: none; max-width: 230px; }
  .chart-tip-date { font-weight: 600; margin-bottom: 3px; }
  .chart-tip-row { display: flex; align-items: center; gap: 6px; color: var(--ink-soft); }
  .chart-tip-row i { display: inline-block; width: 12px; height: 2px; border-radius: 1px; }
  .chart-tip-row b { color: var(--ink); font-size: 14px; font-weight: 650; min-width: 10px; }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-soft); margin: 6px 0 2px; }
  .chart-legend span { display: inline-flex; align-items: center; gap: 6px; }

  /* Verlauf: eine Karte pro Tag */
  .day { border: 1px solid var(--rule-soft); border-radius: 8px; margin-top: 12px; overflow: hidden; }
  .day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    padding: 8px 12px; background: var(--surface-2); border-bottom: 1px solid var(--rule-soft); }
  .day-date { font-size: 14px; font-weight: 650; }
  .day-tag { font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
  .day-row { display: flex; gap: 10px; padding: 10px 12px; align-items: flex-start; }
  .day-row + .day-row { border-top: 1px solid var(--rule-soft); }
  .day-row.editing { background: var(--tint); }
  .day-time { flex: 0 0 50px; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; padding-top: 1px; }
  .day-main { flex: 1; min-width: 0; }
  .day-title { font-size: 14px; font-weight: 600; }
  .day-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .day-note { font-style: italic; }
  .day-missing .day-title { color: var(--ink-soft); font-weight: 500; }
  .day-side { flex-shrink: 0; text-align: right; }
  .day-val { font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; }
  .day-val b { font-size: 16px; color: var(--ink); font-weight: 650; margin-left: 4px; }
  .day-acts { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 3px; }
  .m-edit { flex: 1; min-width: 0; }
  .when { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; font-size: 14px; }
  .flash { margin: 0 0 12px; font-size: 13.5px; font-weight: 600; color: var(--up); }
  .type-pick button { font-weight: 600; }
  .infobox { background: var(--tint); border: 1px solid var(--tint-border); border-radius: 8px; padding: 12px 14px; font-size: 13.5px; margin-bottom: 14px; }

  .flag { background: var(--down-bg); border: 1px solid var(--down-border); border-radius: 8px;
    padding: 14px 16px; font-size: 14px; margin-bottom: 14px; }
  .flag b { display: block; margin-bottom: 4px; color: var(--down); }

  /* Der unsichtbare Datei-Wähler gibt seinen Fokusring an den sichtbaren Knopf dahinter */
  #impfile:focus-visible + label { outline: 2px solid var(--act); outline-offset: 2px; }
  .exportbox { width: 100%; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; line-height: 1.45; min-height: 150px; margin-top: 10px; }
  @media (max-width: 700px) { .exportbox { font-size: 16px; } }
  .note { font-size: 12.5px; color: var(--ink-soft); margin-top: 14px; }
  .err { font-size: 13px; color: var(--down); margin-top: 8px; }

  /* Akkordeon (Übungen & Plan) */
  .blockhead { font-size: 15px; font-weight: 650; margin: 20px 0 3px; }
  .blockhead:first-child { margin-top: 0; }
  .blocksub { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 10px; }
  .acc { border: 1px solid var(--rule-soft); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
  .acc > button { width: 100%; text-align: left; font-family: inherit; cursor: pointer; background: var(--card);
    border: 0; padding: 13px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .acc > button:hover { background: var(--surface-2); }
  .acc-name { font-size: 14.5px; font-weight: 600; display: block; }
  .acc-meta { font-size: 12px; color: var(--act-ink); font-weight: 600; margin-top: 2px; display: block; }
  .acc-chev { color: var(--ink-soft); font-size: 15px; flex-shrink: 0; }
  .acc-body { padding: 0 14px 14px; border-top: 1px solid var(--rule-soft); background: var(--surface-1); }
  .acc-body h3, .kicker { margin: 13px 0 5px; font-size: 12px; color: var(--ink-soft); font-weight: 600;
    letter-spacing: .04em; text-transform: uppercase; }
  .acc-body ul { margin: 0; padding-left: 17px; font-size: 13.5px; }
  .acc-body li { margin-bottom: 4px; }
  .acc.due { border-left: 3px solid var(--act); }
  .acc.due .acc-meta { color: var(--hold-ink); }
  .acc-err { background: var(--down-bg); border-radius: 6px; padding: 9px 11px; font-size: 13px; margin-top: 11px; }
  .acc-err b { color: var(--down); }
  .fig { background: #fff; color-scheme: light; border: 1px solid var(--rule-soft); border-radius: 7px;   /* Zeichnungen sind für Weiß gezeichnet */
    padding: 8px; margin-top: 12px; }
  .fig svg { width: 100%; height: auto; display: block; }

  /* Titel, Zeitangabe und Erklärung als ein Block – die Linie trennt Blöcke, nicht Titel von Text */
  .kvblock { padding: 9px 0; border-bottom: 1px solid var(--rule-soft); }
  .kvblock:last-of-type { border-bottom: 0; }
  .kv-head { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; }
  .kv-head b { font-weight: 600; }
  .kv-head span { color: var(--act-ink); font-weight: 600; white-space: nowrap; }
  .kv-text { font-size: 13px; color: var(--ink-soft); margin: 3px 0 0; }

  .prod { border: 1px solid var(--rule-soft); border-radius: 8px; padding: 13px 14px; margin-bottom: 9px; }
  .prod-name { font-size: 14.5px; font-weight: 650; }
  .prod-price { font-size: 13px; color: var(--act-ink); font-weight: 600; margin: 2px 0 6px; }
  .prod-role { font-size: 13px; color: var(--ink-soft); }

  /* Skalen */
  .sc-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-soft); margin: 0; }
  .sc-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sc-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
  .sc-list { margin-top: 2px; }
  .sc-row { display: grid; grid-template-columns: var(--sc-w, 46px) 1fr; column-gap: 12px; align-items: baseline;
    padding: 9px 0; border-bottom: 1px solid var(--rule-soft); font-size: 14px; }
  .sc-list > .sc-row:last-child { border-bottom: 0; }
  .sc-val { text-align: center; font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums;
    padding: 2px 6px; border-radius: 5px; background: var(--surface-3); color: var(--ink); white-space: nowrap; }
  .sc-val.up { background: var(--up-bg); color: var(--up-ink); }
  .sc-val.hold { background: var(--hold-bg); color: var(--hold-ink); }
  .sc-val.down { background: var(--down-bg); color: var(--down); }
  .sc-val.act { background: var(--tint); color: var(--act-ink); }
  .sc-link { background: none; border: 0; padding: 0; font: inherit; color: var(--act-ink);
    text-decoration: underline; cursor: pointer; white-space: nowrap; }
  .card.sc-target { border-color: var(--act); }

  /* ---------- Layout je Bildschirmbreite ---------- */
  /* Logbuch: auf dem Handy eine Spalte in der gewohnten Reihenfolge (order),
     auf dem Desktop links Erfassen, rechts Urteil und Verlauf */
  .log { display: flex; flex-direction: column; }
  .log-top, .log-in, .log-out { display: contents; }
  .o1 { order: 1; } .o2 { order: 2; } .o3 { order: 3; } .o5 { order: 5; } .o7 { order: 7; } .o7b { order: 8; }
  .o8 { order: 9; } .o9 { order: 10; } .o10 { order: 11; } .o11 { order: 12; }
  .h3 { margin: 14px 0 6px; font-size: 14px; font-weight: 650; }
  .kicker { margin: 20px 0 6px; }

  @media (min-width: 700px) {
    #root { --gutter: 24px; padding-top: 28px; }
    .wrap { max-width: 720px; }
  }
  @media (min-width: 1000px) {
    #root { --gutter: 32px; }
    .wrap { max-width: 1160px; }
    .masthead { margin-bottom: 18px; }
    .log { display: grid; grid-template-columns: minmax(360px, 420px) minmax(0, 1fr);
      grid-template-areas: "top top" "in out"; column-gap: 24px; align-items: start; }
    .log-top, .log-in, .log-out { display: block; min-width: 0; }
    .log-top { grid-area: top; }
    .log-in { grid-area: in; }
    .log-out { grid-area: out; }
    /* Tab Daten: links die Sicherung, rechts Export, Sicherheitsnetz, Löschen */
    .data-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto 1fr; column-gap: 24px; align-items: start; }
    .data-grid .dg-s { grid-column: 1; grid-row: 1 / span 3; }
    .data-grid .dg-a { grid-column: 2; grid-row: 1; }
    .data-grid .dg-n { grid-column: 2; grid-row: 2; }
    .data-grid .dg-l { grid-column: 2; grid-row: 3; }
    /* Andere Tabs: Karten nebeneinander */
    .cards2 { display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; align-items: stretch; }
    .acc-grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 10px; align-items: start; }
    /* Geöffnete Übung über beide Spalten: Text links, Zeichnung rechts – sonst bliebe daneben ein Loch */
    .acc-grid .acc.open { grid-column: 1 / -1; }
    .acc-grid .acc.open .acc-body:has(> .fig) { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 20px; align-items: start; }
    .acc-grid .acc.open .acc-body:has(> .fig) > :not(.fig) { grid-column: 1; }
    .acc-grid .acc.open .acc-body:has(> .fig) > .fig { grid-column: 2; grid-row: 1 / span 4; }
  }

  /* Handy: alle sechs Bereiche auf einen Blick – zwei Reihen à drei, nichts zum Wischen */
  @media (max-width: 560px) {
    .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
    .tabs button { padding: 8px 6px; font-size: 13.5px; }
    .masthead p { display: none; }   /* drei Zeilen Untertitel auf jedem Tab – auf dem Handy entbehrlich */
    .masthead { margin-bottom: 12px; }
    .grid4 { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 560px) {
    /* Skala in zwei Reihen (0–5 / 6–10): Tasten 44 px hoch und ≥ 50 px breit statt 25 px */
    .scale { grid-template-columns: repeat(6, 1fr); gap: 4px; }
    .scale button { height: 44px; font-size: 15px; }
  }
  @media (max-width: 420px) {
    .verdict-word { font-size: 27px; }
    .grid2 { flex-wrap: wrap; }
  }
  /* Kleine Handys: weniger Rand, damit die 0–10-Tasten breit genug bleiben */
  @media (max-width: 360px) {
    #root { --gutter: 10px; }
    .card { padding: 14px; }
    .verdict { padding: 16px; }
    .day-row { padding: 10px 9px; gap: 8px; }
    .day-time { flex-basis: 46px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .btn, .seg button, .scale button, .tabs button { transition: background-color .12s ease, color .12s ease; }
  }

</style>
</head>

function nowTime() { const d = _now(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function today() {
  // Bewusst lokale Datumsteile statt toISOString() – letzteres rechnet auf UTC
  // und liefert in mitteleuropäischer Zeit nachts den Vortag.
  const d = _now();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function newDraft() {
  return { date: today(), time: nowTime(), type: 'kraft', ex: {},
    run: { min:'', pace:'', hr:'', cadence:'', intervals:'' }, session: { min:'', hr:'', what:'' },
    painDuring: null, effort: null, collagen: false, progressed: false, progressedWhat: '', note: '' };
}
function fmt(iso) { const [y,m,d] = iso.split('-'); return `${+d}.${+m}.`; }
function fmtY(iso) { return fmt(iso) + iso.slice(0, 4); }
function fmtWhen(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '–';
  return d.toLocaleDateString('de-DE', { day:'numeric', month:'numeric' })
       + ' um ' + d.toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' });
}
function draftFromEntry(e) {
  const kind = TYPES[e.type] ? TYPES[e.type].kind : 'session';
  const d = newDraft();
  d.date = e.date; d.time = e.time || '';
  d.type = TYPES[e.type] ? e.type : 'crossfit';
  d.painDuring = e.painDuring; d.effort = e.effort;
  d.collagen = !!e.collagen; d.progressed = !!e.progressed; d.progressedWhat = asStr(e.progressedWhat);
  d.note = [e.note, e.detail ? 'Alteintrag: ' + e.detail : ''].filter(Boolean).join(' · ');
  if (kind === 'ex') d.ex = JSON.parse(JSON.stringify((e.details || {}).ex || {}));
  else if (kind === 'run') d.run = { min:'', pace:'', hr:'', cadence:'', intervals:'', ...(e.details || {}) };
  else d.session = { min:'', hr:'', what:'', ...(e.details || {}) };
  return d;
}
function daysBetween(a,b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
// Datumsrechnung über UTC, damit die Zeitumstellung keinen Tag verschluckt
function addDays(iso, n) {
  const d = new Date(iso + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function weekday(iso, form) {
  return new Date(iso + 'T12:00:00Z').toLocaleDateString('de-DE', { weekday: form || 'short', timeZone: 'UTC' }).replace(/\.$/, '');
}
function relDay(iso) {
  if (iso === today()) return 'heute';
  if (addDays(iso, 1) === today()) return 'gestern';
  return `${weekday(iso)}, ${fmt(iso)}`;
}
function dayLabel(iso) {
  const base = `${weekday(iso)}, ${fmt(iso)}`, r = relDay(iso);
  return r === base ? base : r[0].toUpperCase() + r.slice(1) + ' · ' + base;
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function typeLabel(t) { return TYPES[t] ? TYPES[t].label : t; }
function stiffLabel(v) { const s = STIFF.find(x => x.v === v); return s ? s.label : '–'; }
function stiffMins(v) { const s = STIFF.find(x => x.v === v); return s ? s.mins : 0; }
function hasData() { return state.entries.length > 0 || state.mornings.length > 0 || state.tests.length > 0; }

/* ============================================ Storage */
// Ohne Kennung und Datum lässt sich ein Datensatz weder sortieren noch anzeigen –
// er würde beim Rendern eine Ausnahme werfen und die App unbenutzbar machen.
// Darum an jeder Außengrenze prüfen: beim Laden und beim Einspielen.
// Muster UND Kalender: „2026-13-01“ passt aufs Muster, würde aber jede Datumsrechnung werfen
const isIsoDate = d => {
  if (typeof d !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(d)) return false;
  const t = new Date(d + 'T00:00:00Z');
  return !isNaN(t) && t.toISOString().slice(0, 10) === d;
};
const hasId = x => (typeof x.id === 'string' && x.id.length > 0) || typeof x.id === 'number';
function validEntry(e) { return !!e && typeof e === 'object' && hasId(e) && isIsoDate(e.date); }
function validMorning(m) {
  return !!m && typeof m === 'object' && isIsoDate(m.date)
    && (m.skipped === true || (typeof m.pain === 'number' && m.pain >= 0 && m.pain <= 10));
}
function keepValid(list, check) {
  const arr = Array.isArray(list) ? list : [];
  const ok = arr.filter(check);
  return { ok, dropped: arr.length - ok.length };
}
function noteDropped(n) {
  state.dataNote = n
    ? `${n} ${n === 1 ? 'Datensatz war' : 'Datensätze waren'} unvollständig (Kennung, Datum oder Zahlen fehlen) und ${n === 1 ? 'wurde' : 'wurden'} nicht übernommen. Der Rest deiner Daten ist unverändert.`
    : null;
}

// Ein Morgen je Kalendertag – an dem Tag, an dem du aufwachst.
function makeMorning(date, pain, stiff, note) {
  return { id: 'm' + date, date, pain, stiff: asStiff(stiff), note: asStr(note).trim(), skipped: false };
}
function skippedMorning(date) { return { id: 'm' + date, date, pain: null, stiff: null, note: '', skipped: true }; }
// Monatstest: einbeiniges Wadenheben, Wiederholungen je Seite – einer je Kalendertag.
// Rechts ist die betroffene Seite, links die gesunde (so steht es im Plan).
const asCount = v => (typeof v === 'number' && Number.isFinite(v) && v >= 0 && v <= 999) ? Math.round(v) : null;
function validTest(x) { return !!x && typeof x === 'object' && isIsoDate(x.date) && asCount(x.right) !== null && asCount(x.left) !== null; }
function makeTest(date, right, left, note) { return { id: 't' + date, date, right: asCount(right), left: asCount(left), note: asStr(note).trim() }; }
// Alles, was aus einer Sicherung kommt, wird hier auf die erwarteten Typen gebracht.
// Sonst landet ein „time“ als Attribut-Injektion im Formular oder ein null in summary().
const asStr = v => (typeof v === 'string' || typeof v === 'number') ? String(v) : '';
const asScore = v => (typeof v === 'number' && v >= 0 && v <= 10) ? v : null;
const asStiff = v => STIFF.some(s => s.v === v) ? v : null;
function cleanEntry(e) {
  const c = { ...e };
  delete c.painMorning; delete c.stiffness; delete c.morningNote; delete c.skipped;
  c.id = String(c.id);
  c.time = /^\d{2}:\d{2}$/.test(asStr(c.time)) ? asStr(c.time) : '';
  c.type = asStr(c.type);
  c.note = asStr(c.note);
  if (c.detail != null) c.detail = asStr(c.detail);
  c.painDuring = asScore(c.painDuring);
  c.effort = asScore(c.effort);
  c.collagen = !!c.collagen; c.progressed = !!c.progressed; c.progressedWhat = asStr(c.progressedWhat);
  const d = (c.details && typeof c.details === 'object') ? c.details : {};
  const det = {};
  ['min', 'pace', 'hr', 'cadence', 'intervals', 'what'].forEach(k => { if (k in d) det[k] = asStr(d[k]); });
  if (d.ex && typeof d.ex === 'object') {
    det.ex = {};
    Object.entries(d.ex).forEach(([k, v]) => {
      if (v && typeof v === 'object') det.ex[k] = { sets: asStr(v.sets), reps: asStr(v.reps), weight: asStr(v.weight) };
    });
  }
  c.details = det;
  return c;
}

// Bis v3 hing der Morgenwert an den Einheiten des Vortags (Wert an jeder Einheit
// vom Di = Morgen vom Mi), Morgen nach Ruhetagen lagen getrennt unter „rest“.
// Beides wird hier zu einem Morgen je Kalendertag.
function fromLegacy(rawEntries, rawRest) {
  const e = keepValid(rawEntries, validEntry), r = keepValid(rawRest, validEntry);
  const map = new Map();
  let dropped = e.dropped + r.dropped, doppelt = 0;
  [...e.ok].sort((a,b) => String(a.date + (a.time||'')).localeCompare(String(b.date + (b.time||'')))).forEach(x => {
    const md = addDays(x.date, 1);
    if (typeof x.painMorning === 'number') map.set(md, makeMorning(md, x.painMorning, x.stiffness, x.morningNote));
    else if (x.skipped && !map.has(md)) map.set(md, skippedMorning(md));
  });
  r.ok.forEach(x => {
    if (typeof x.pain !== 'number') { dropped++; return; }
    const cur = map.get(x.date);
    if (cur && !cur.skipped) {
      // Doppelt erfasst: der Morgen-Check gewinnt, der zweite Wert bleibt in der Notiz erhalten
      doppelt++;
      const extra = [x.pain !== cur.pain ? 'Schmerz ' + x.pain : '',
        x.stiff !== cur.stiff && asStiff(x.stiff) ? 'Sehne steif ' + stiffLabel(x.stiff) : '', String(x.note || '').trim()].filter(Boolean).join(', ');
      if (extra) cur.note = [cur.note, 'zweiter Eintrag: ' + extra].filter(Boolean).join(' · ');
    } else map.set(x.date, makeMorning(x.date, x.pain, x.stiff, x.note));
  });
  return { entries: e.ok.map(cleanEntry), mornings: [...map.values()], tests: [], dropped, doppelt, legacy: true };
}

// Nimmt jedes bekannte Format an (v1–v4) und liefert den aktuellen Aufbau – oder null.
function normalize(p) {
  if (Array.isArray(p)) return fromLegacy(p, []);
  if (!p || typeof p !== 'object' || !Array.isArray(p.entries)) return null;
  if (!Array.isArray(p.mornings)) return fromLegacy(p.entries, p.rest);
  const e = keepValid(p.entries, validEntry), m = keepValid(p.mornings, validMorning), t = keepValid(p.tests, validTest);
  const map = new Map(), tmap = new Map();
  m.ok.forEach(x => map.set(x.date, x.skipped ? skippedMorning(x.date) : makeMorning(x.date, x.pain, x.stiff, x.note)));
  t.ok.forEach(x => tmap.set(x.date, makeTest(x.date, x.right, x.left, x.note)));
  return { entries: e.ok.map(cleanEntry), mornings: [...map.values()], tests: [...tmap.values()],
    dropped: e.dropped + m.dropped + t.dropped, doppelt: 0, legacy: false };
}

function adopt(n) {
  if (!n) return false;
  state.entries = n.entries;
  state.mornings = n.mornings;
  state.tests = n.tests || [];
  invalidate();
  noteDropped(n.dropped);
  return hasData();
}
function packState() { return { v: 4, entries: state.entries, mornings: state.mornings, tests: state.tests }; }
function migrationText(n) {
  return 'Morgenwerte stehen jetzt an dem Tag, an dem du aufgewacht bist – nicht mehr beim Training vom Vortag. Deine Daten wurden übernommen, der alte Stand bleibt zusätzlich unverändert gespeichert.'
    + (n.doppelt ? ` Für ${n.doppelt} Morgen gab es zwei Werte (Morgen-Check und „Morgen ohne Training“). Übernommen wurde der Morgen-Check, der zweite Wert steht in der Notiz.` : '');
}

// Rückfallebenen. Dürfen nie das eigentliche Speichern gefährden – darum
// schluckt hier alles seine Fehler und liefert im Zweifel null.
async function writeSnapshot(key, payload) {
  try { await window.storage.set(key, JSON.stringify({ at: new Date().toISOString(), payload })); }
  catch (e) { /* Rückfallebene ist Kür, nicht Pflicht */ }
}
async function readSnapshot(key) {
  try {
    const r = await window.storage.get(key);
    if (!r || !r.value) return null;
    const s = JSON.parse(r.value);
    if (!s || !s.at || !s.payload) return null;
    const n = normalize(s.payload);   // auch Zwischenstände aus der Zeit vor der Umstellung
    if (!n || (!n.entries.length && !n.mornings.length && !n.tests.length)) return null;
    return { at: s.at, entries: n.entries, mornings: n.mornings, tests: n.tests };
  } catch (e) { return null; }
}
async function dropSnapshot(key) {
  try { await window.storage.remove(key); } catch (e) {}
}

async function loadMeta() {
  try {
    const r = await window.storage.get(KEY_META);
    const m = r && r.value ? JSON.parse(r.value) : null;
    state.meta = (m && typeof m === 'object') ? m : { lastBackup: null };
  } catch (e) { state.meta = { lastBackup: null }; }
}
async function saveMeta() { try { await window.storage.set(KEY_META, JSON.stringify(state.meta)); } catch (e) {} }

// Ein Stand, der sich nicht lesen ließ, wird als Rohtext beiseitegelegt – bevor das nächste
// Speichern ihn überschreibt. Im Tab „Daten“ lässt er sich kopieren oder verwerfen.
async function writeRescue(raw) {
  try {
    const cur = await readRescue();
    if (cur && cur.raw === raw) return;
    await window.storage.set(KEY_RESCUE, JSON.stringify({ at: new Date().toISOString(), raw: String(raw) }));
  } catch (e) {}
}
async function readRescue() {
  try {
    const r = await window.storage.get(KEY_RESCUE);
    const s = r && r.value ? JSON.parse(r.value) : null;
    return s && s.at && typeof s.raw === 'string' ? s : null;
  } catch (e) { return null; }
}
// Safari löscht im Browser-Modus die Daten einer Seite nach rund sieben Tagen ohne Nutzung (ITP).
// Als Home-Bildschirm-App gilt das nicht – darum dort ein Hinweis, hier die Erkennung.
function safariBrowserModus() {
  const ua = navigator.userAgent || '';
  const safari = /Safari\//.test(ua) && !/Chrome|CriOS|FxiOS|EdgiOS|OPiOS|Android/.test(ua);
  const standalone = navigator.standalone === true || !!(window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  return safari && !standalone;
}
function backupAge() {
  if (!state.meta || !state.meta.lastBackup) return null;
  const d = new Date(state.meta.lastBackup);
  if (isNaN(d)) return null;
  return Math.max(0, Math.floor((Date.now() - d.getTime()) / 86400000));
}
function backupFaellig() {
  if (!hasData()) return false;
  // Erst erinnern, wenn es etwas zu verlieren gibt: eine Woche Daten oder zehn Datensätze
  const dates = dayList(), oldest = dates[dates.length - 1];
  const genug = state.entries.length + state.mornings.length + state.tests.length >= 10 || (oldest && daysBetween(oldest, today()) >= 7);
  if (!genug) return false;
  const a = backupAge();
  return a === null || a >= BACKUP_FAELLIG_TAGE;
}

// Ohne Zusage darf der Browser den Speicher räumen, wenn er Platz braucht.
async function checkPersistence(fragen) {
  if (!navigator.storage || !navigator.storage.persist) { state.persist = 'na'; return; }
  try {
    if (await navigator.storage.persisted()) { state.persist = true; return; }
    if (!fragen) { state.persist = false; return; }
    state.persist = await navigator.storage.persist();
    // Firefox stellt dafür einen Dialog – den nur einmal von selbst, danach nur auf Knopfdruck
    if (!state.meta.persistAsked) { state.meta.persistAsked = true; await saveMeta(); }
  } catch (e) { state.persist = 'na'; }
}

async function load() {
  let raw = null;
  try { const r = await window.storage.get(KEY); raw = r && r.value ? r.value : null; } catch (e) { raw = null; }
  if (raw) {
    let n = null;
    try { n = normalize(JSON.parse(raw)); } catch (e) { n = null; }
    if (n) adopt(n);
    else {
      await writeRescue(raw);
      state.dataNote = 'Der gespeicherte Stand ließ sich nicht lesen. Spiel deine letzte Sicherung ein oder hol im Tab „Daten“ unter „Sicherheitsnetz“ einen Zwischenstand zurück – dort liegt der unlesbare Stand auch als Rohtext.';
    }
  } else {
    // Erster Start im neuen Format: ältere Stände übernehmen.
    // Die alten Schlüssel bleiben unangetastet liegen – als Rückfallebene.
    for (const old of KEYS_ALT) {
      let n = null;
      try {
        const r = await window.storage.get(old);
        n = r && r.value ? normalize(JSON.parse(r.value)) : null;
      } catch (e) { n = null; }
      if (n && adopt(n)) {
        state.migrationNote = migrationText(n);
        try { await window.storage.set(KEY, JSON.stringify(packState())); }
        catch (e) { state.error = (e && e.message) ? String(e.message) : String(e); }
        break;
      }
    }
  }
  await loadMeta();
  state.snapPrev  = await readSnapshot(KEY_PREV);
  state.snapTrash = await readSnapshot(KEY_TRASH);
  state.rescue = await readRescue();
  state.loaded = true;
  render();
  checkPersistence(!state.meta.persistAsked).then(render);
}
async function save(opts) {

  try {
    if (!window.storage || typeof window.storage.set !== 'function') throw new Error('window.storage steht in dieser Umgebung nicht zur Verfügung');
    // Den Stand vor dieser Änderung als Rückfallebene behalten
    if (!(opts && opts.skipPrev)) try {
      const before = await window.storage.get(KEY);
      if (before && before.value) {
        const b = JSON.parse(before.value);
        if (b) await writeSnapshot(KEY_PREV, b);
      }
    } catch (e) { /* ohne Rückfallebene weiter */ }
    await window.storage.set(KEY, JSON.stringify(packState()));
    state.snapPrev = await readSnapshot(KEY_PREV);
    state.error = null;
  } catch (e) {
    state.error = (e && e.message) ? String(e.message) : String(e);
  }
  if (!(opts && opts.silent)) render();
}

/* ============================================ Logik */
function summary(e) {
  const d = e.details || {};
  if (e.detail) return e.detail;
  const k = TYPES[e.type] ? TYPES[e.type].kind : null;
  if (k === 'ex') {
    const list = Object.entries(d.ex || {}).map(([id,v]) => {
      const ex = EX[id]; if (!ex || !v || typeof v !== 'object') return null;
      const txt = exDoseText(v, ex.unit);
      return ex.name.split('(')[0].trim() + (txt ? ' ' + txt : '');
    }).filter(Boolean);
    return list.length ? list.join(' · ') : 'keine Übungen erfasst';
  }
  if (k === 'run') {
    const b = [];
    if (d.min) b.push(d.min + ' Min.');
    if (d.pace) b.push(d.pace);
    if (d.hr) b.push('Ø ' + d.hr + ' bpm');
    if (d.cadence) b.push(d.cadence + ' Schritte/Min.');
    if (d.intervals) b.push('Intervalle: ' + d.intervals);
    return b.length ? b.join(' · ') : 'keine Angabe';
  }
  if (k === 'session') {
    const b = [];
    if (d.min) b.push(d.min + ' Min.');
    if (d.hr) b.push('Ø ' + d.hr + ' bpm');
    if (d.what) b.push(d.what);
    return b.length ? b.join(' · ') : 'keine Angabe';
  }
  return 'keine Angabe';
}

// „3× 12 Wdh. 15 kg“ – dieselbe Schreibweise im Verlauf und unter „Zuletzt“
function exDoseText(v, unit) {
  const b = [];
  if (v.sets) b.push(v.sets + '×');
  if (v.reps) b.push(v.reps + ' ' + UNIT_LABEL[unit]);
  if (v.weight) b.push(v.weight + ' kg');
  return b.join(' ');
}

function collagenGap() {
  if (!draft.collagen || !draft.time || !draft.date) return null;
  const mine = new Date(draft.date + 'T' + draft.time);
  if (isNaN(mine)) return null;
  let best = null;
  state.entries.forEach(e => {
    if (e.id === editingId) return;   // die eigene Dosis ist keine zweite Dosis
    if (!e.collagen || !e.time || !e.date) return;
    const t = new Date(e.date + 'T' + e.time);
    if (isNaN(t)) return;
    const h = (mine - t) / 3600000;
    if (h > 0 && h < 6 && (best === null || h < best)) best = h;
  });
  return best;
}

// Abgeleitete Sichten (sortierte Einheiten, Einheiten je Tag, Trainingstage) werden je Aufbau
// einmal berechnet. save() und render() leeren den Speicher – jede Änderung läuft dort durch.
// Die Rückgaben sind geteilt: nur lesen, nicht verändern.
let memo = {};
function invalidate() { memo = {}; }
function sorted() {
  return memo.sorted || (memo.sorted = [...state.entries].sort((a,b) => String(a.date + (a.time||'')).localeCompare(String(b.date + (b.time||'')))));
}
function byDate() {
  if (!memo.byDate) {
    const m = new Map();
    sorted().forEach(e => { if (!m.has(e.date)) m.set(e.date, []); m.get(e.date).push(e); });
    memo.byDate = m;
  }
  return memo.byDate;
}
function entriesOf(date) { return byDate().get(date) || []; }
function hasTraining(date) { return byDate().has(date); }
function morningMap() {
  if (!memo.mornings) { const m = new Map(); state.mornings.forEach(x => m.set(x.date, x)); memo.mornings = m; }
  return memo.mornings;
}
function morningOf(date) { return morningMap().get(date) || null; }
function upsertMorning(m) { state.mornings = state.mornings.filter(x => x.date !== m.date).concat([m]); invalidate(); }
function testOf(date) { return state.tests.find(x => x.date === date) || null; }
function upsertTest(x) { state.tests = state.tests.filter(y => y.date !== x.date).concat([x]); invalidate(); }
function testsSorted() { return memo.tests || (memo.tests = [...state.tests].sort((a,b) => a.date.localeCompare(b.date))); }
function maxDuring(date) {
  const v = entriesOf(date).filter(e => typeof e.painDuring === 'number').map(e => e.painDuring);
  return v.length ? Math.max(...v) : null;
}
// Alle Tage mit irgendeinem Eintrag, neueste zuerst
function dayList() {
  if (memo.dayList) return memo.dayList;
  const s = new Set();
  state.entries.forEach(e => s.add(e.date));
  state.mornings.forEach(m => s.add(m.date));
  state.tests.forEach(x => s.add(x.date));
  return (memo.dayList = [...s].sort().reverse());
}

// Trainingstage, jeweils verbunden mit dem Morgen danach – die 24-Stunden-Regel.
// Der Morgen selbst gehört zu dem Tag, an dem du aufwachst.
function days() {
  if (memo.days) return memo.days;
  const out = [];
  byDate().forEach((list, date) => {
    const md = addDays(date, 1), m = morningOf(md);
    out.push({ date, n: list.length, painDuring: maxDuring(date), progressed: list.some(e => e.progressed),
      efforts: list.filter(e => e.effort != null).map(e => e.effort), labels: list.map(e => typeLabel(e.type)),
      morningDate: md, skipped: !!(m && m.skipped),
      painMorning: m && !m.skipped ? m.pain : null, stiffness: m && !m.skipped ? m.stiff : null });
  });
  return (memo.days = out.sort((a,b) => a.date.localeCompare(b.date)));
}
function pending() { return days().filter(d => d.painMorning == null && !d.skipped && d.morningDate <= today()); }

function assess() {
  const all = days();
  const done = all.filter(d => d.painMorning != null);
  // Nur ein frisch offener Morgen (bis drei Tage) hält das Urteil an. Ältere bleiben
  // unbewertet und stehen in „Noch offene Morgen“ – sie blockieren aber nichts mehr.
  if (pending().some(d => daysBetween(d.morningDate, today()) <= MORGEN_OFFEN_TAGE)) return { tone:'none', word:'Morgen-Check offen', kicker:'Noch keine Bewertung möglich',
    reasons:['Ohne den Wert vom Folgemorgen fehlt der wichtigste Marker.'], todo:'Trag den fehlenden Morgenwert ein oder überspring ihn – dann bewertet die App die Einheit.' };
  if (done.length < 2) return { tone:'none', word:'Noch zu wenig Daten', kicker:`${done.length} von 2 bewerteten Trainingstagen`,
    reasons:['Ein Trainingstag gilt als vollständig, sobald am Folgetag der Morgen-Check ausgefüllt ist. Ab dem zweiten vergleicht die App die beiden Morgenwerte.'], todo:'Weiter erfassen und nichts an der Last ändern.' };

  const last = done[done.length-1], prev = done[done.length-2];
  const stiffMin = stiffMins(last.stiffness);
  const delta = last.painMorning - prev.painMorning;
  const red = [], amber = [], green = [];

  if (last.painDuring > SCHMERZ_MAX) red.push(`Höchster Schmerzwert an diesem Tag lag bei ${last.painDuring}/10 – über der ${SCHMERZ_MAX}/10-Grenze.`);
  if (delta >= 2) red.push(`Morgenschmerz ist von ${prev.painMorning} auf ${last.painMorning} gestiegen.`);
  else if (delta === 1) amber.push(`Morgenschmerz ist um einen Punkt gestiegen (${prev.painMorning} → ${last.painMorning}).`);
  if (stiffMin > 45) red.push('Die Sehne war morgens über 45 Minuten steif.');
  else if (stiffMin > 30) amber.push('Die Sehne war morgens 30 bis 45 Minuten steif.');

  const recent = done.slice(-3);
  const calm = recent.length === 3 && recent.every(d => typeof d.painDuring === 'number' && d.painDuring <= SCHMERZ_MAX)
    && recent.every(d => stiffMins(d.stiffness) <= 30)
    && recent[2].painMorning <= recent[0].painMorning;

  const lastProgress = [...all].reverse().find(d => d.progressed);
  const sinceProgress = lastProgress ? Math.max(0, daysBetween(lastProgress.date, today())) : 999;   // Zukunftsdatum → nicht negativ

  if (calm) {
    green.push('Die letzten drei Trainingstage waren ruhig: Schmerz während ≤ 3/10, Sehne morgens höchstens 30 Minuten steif, Schmerz am Morgen nicht gestiegen.');
    const eff = recent.flatMap(d => d.efforts);
    if (eff.length && Math.max(...eff) <= ANSTRENGUNG_LEICHT) green.push(`Der letzte Satz fühlte sich zuletzt bei höchstens ${Math.max(...eff)}/10 an – das ist zu leicht.`);
  }

  if (red.length) return { tone:'down', word:'Zurücknehmen', kicker:`Nach dem Trainingstag ${fmt(last.date)}`, reasons:red.concat(amber),
    todo:'Auf das letzte funktionierende Level zurück, dort ein bis zwei Wochen bleiben, dann in kleineren Schritten weiter. Isometrie geht fast immer.' };
  if (amber.length) return { tone:'hold', word:'Level halten', kicker:`Nach dem Trainingstag ${fmt(last.date)}`, reasons:amber,
    todo:'Nichts steigern. Gleiche Last noch einmal wiederholen und beobachten, ob sich der Wert einpendelt.' };
  if (green.length && sinceProgress < STEIGERUNG_TAGE) return { tone:'hold', word:'Level halten', kicker:'Alles ruhig – aber die Woche ist noch nicht um',
    reasons:green.concat([`Die letzte Steigerung war vor ${sinceProgress} ${sinceProgress===1?'Tag':'Tagen'}. Eine Variable pro Woche.`]),
    todo:`Noch ${STEIGERUNG_TAGE-sinceProgress} ${STEIGERUNG_TAGE-sinceProgress===1?'Tag':'Tage'} auf diesem Level bleiben.` };
  if (green.length) return { tone:'up', word:'Steigern', kicker:'Die Sehne verträgt mehr', reasons:green,
    todo:'Beim Krafttraining zuerst das Gewicht erhöhen, nicht die Wiederholungen. Beim Laufen eine Variable um etwa 10 %. Hak beim nächsten Eintrag „Das war eine Steigerung“ an.' };
  return { tone:'hold', word:'Level halten', kicker:`Nach dem Trainingstag ${fmt(last.date)}`,
    reasons:['Keine Warnzeichen, aber auch noch keine drei durchgehend ruhigen Trainingstage.'],
    todo:'Gleiche Last beibehalten, bis drei Trainingstage in Folge ruhig verlaufen sind.' };
}

// Warnzeichen zählen jeden erfassten Morgen – auch nach Ruhetagen. Gerade in einer
// Trainingspause zeigt nur der Morgen, ob es schlechter wird.
function redFlags() {
  const t = today();
  const recent = state.mornings
    .filter(m => !m.skipped && typeof m.pain === 'number' && m.date <= t && daysBetween(m.date, t) <= WARN_FENSTER_TAGE)
    .sort((a,b) => a.date.localeCompare(b.date));
  const out = [];
  if (recent.filter(m => m.pain >= 6).length >= 3) out.push('Der Morgenschmerz lag in den letzten drei Wochen mehrfach bei 6/10 oder höher.');
  if (recent.filter(m => m.stiff === 'ueber45').length >= 2) out.push('Die Sehne war morgens mehrfach über 45 Minuten steif.');
  if (recent.length >= 4) {
    const f = (recent[0].pain + recent[1].pain) / 2;
    const l = (recent[recent.length - 2].pain + recent[recent.length - 1].pain) / 2;
    if (l - f >= 2) out.push('Der Morgenschmerz steigt über die letzten Wochen kontinuierlich an.');
  }
  return out.concat(testFlags());
}
// Monatstest als Warnzeichen: rechts kein einbeiniges Wadenheben mehr – oder deutlich weniger als beim letzten Mal.
// Ein Abstand zur gesunden Seite allein ist am Anfang normal und steht darum nur in der Übersicht.
function testFlags() {
  const t = today(), list = testsSorted().filter(x => x.date <= t);
  const last = list[list.length - 1], prev = list[list.length - 2];
  if (!last || daysBetween(last.date, t) > TEST_WARN_TAGE) return [];
  if (last.right === 0 && last.left > 0) return [`Beim Monatstest vom ${fmt(last.date)} war rechts kein einbeiniges Wadenheben möglich.`];
  if (prev && prev.right > 0 && last.right <= prev.right * 0.7) return [`Beim Monatstest ist die Wiederholungszahl rechts von ${prev.right} auf ${last.right} gefallen.`];
  return [];
}
function lastTest() { const l = testsSorted(); return l.length ? l[l.length - 1] : null; }
function testDue() {
  const last = lastTest();
  if (last) return daysBetween(last.date, today()) >= TEST_INTERVALL_TAGE;
  const dates = dayList(), oldest = dates[dates.length - 1];
  return !!oldest && daysBetween(oldest, today()) >= TEST_ERSTER_AB_TAGE;
}

function buildExport() {
  const dates = dayList();
  if (!dates.length) return 'Noch keine Einträge.';
  const a = assess();
  const tests = testsSorted();
  const L = ['Sehnenlog – Auswertung bitte', `Stand: ${_now().toLocaleDateString('de-DE')}`,
    `Einheiten: ${state.entries.length}, erfasste Morgen: ${state.mornings.filter(m => !m.skipped).length}, Monatstests: ${tests.length}`,
    `Aktuelle Einschätzung der App: ${a.word}`,
    'Schmerzwerte 0–10. Ein Morgenwert gilt jeweils für das Training vom Vortag (24-Stunden-Regel).'];
  if (dates.length > EXPORT_TAGE) L.push(`Gekürzt auf die letzten ${EXPORT_TAGE} Tage mit Einträgen (von ${dates.length}).`);
  L.push('');
  if (tests.length) {
    L.push('Monatstests – einbeiniges Wadenheben, Wiederholungen (rechts = betroffene Seite):');
    tests.forEach(x => L.push(`  ${fmtY(x.date)}: rechts ${x.right}, links ${x.left}${x.note ? ' – ' + x.note : ''}`));
    L.push('');
  }
  dates.slice(0, EXPORT_TAGE).reverse().forEach(date => {
    const list = entriesOf(date), prev = addDays(date, -1), m = morningOf(date), x = testOf(date);
    L.push(`${weekday(date)}, ${fmt(date)}${list.length ? '' : x ? ' – Monatstest' : ' – Ruhetag'}`);
    if (m && !m.skipped) {
      L.push(`  Morgen: Schmerz ${m.pain}/10, Sehne steif ${stiffLabel(m.stiff)}${hasTraining(prev) ? ` (gilt für das Training vom ${fmt(prev)})` : ''}${m.note ? ' – ' + m.note : ''}`);
    } else if (m && m.skipped) L.push('  Morgen: übersprungen');
    else if (hasTraining(prev)) L.push('  Morgen: nicht erfasst');
    if (x) L.push(`  Monatstest: rechts ${x.right}, links ${x.left}`);
    list.forEach(e => {
      const parts = [`${e.time || '–'} ${typeLabel(e.type)}: ${summary(e)}`,
        `während ${e.painDuring != null ? e.painDuring + '/10' : '–'}`];
      if (e.effort != null) parts.push(`Anstrengung ${e.effort}/10`);
      parts.push(`Kollagen ${e.collagen ? 'ja' : 'nein'}`);
      if (e.progressed) parts.push('Steigerung' + (e.progressedWhat ? ': ' + e.progressedWhat : ''));
      L.push('  ' + parts.join(' | '));
      if (e.note) L.push(`    Notiz: ${e.note}`);
    });
    L.push('');
  });
  return L.join('\n').trimEnd();
}

/* ============================================ Render-Bausteine */
function scaleHtml(name, value, showLimit, label) {
  let s = `<div class="scale" role="group" aria-label="${esc(label || name)}">`;
  for (let i = 0; i <= 10; i++)
    s += `<button type="button" class="${showLimit && i <= SCHMERZ_MAX ? 'ok' : ''}" data-scale="${name}" data-val="${i}" aria-pressed="${value===i}" aria-label="${i} von 10">${i}</button>`;
  s += '</div>';
  if (showLimit) s += `<p class="scale-note">0 bis ${SCHMERZ_MAX} sind erlaubt – darüber heißt es Zurücknehmen.</p>`;
  return s;
}
function segHtml(name, options, value, label) {
  return `<div class="seg" role="group" aria-label="${esc(label || name)}">` + options.map(o =>
    `<button type="button" data-seg="${name}" data-val="${o.v}" aria-pressed="${value===o.v}">${esc(o.label)}</button>`).join('') + '</div>';
}
function num(path, val, ph, decimal) {
  // Dezimalwerte (kg) als Textfeld mit Dezimaltastatur: type="number" verwirft „12,5“ je nach Browser
  const id = 'f-' + path.replace(/\./g, '-');
  return decimal
    ? `<input type="text" id="${id}" inputmode="decimal" data-path="${path}" value="${esc(val)}" placeholder="${esc(ph||'')}">`
    : `<input type="number" id="${id}" inputmode="numeric" min="0" data-path="${path}" value="${esc(val)}" placeholder="${esc(ph||'')}">`;
}
function acc(id, name, meta, bodyHtml, due) {
  const open = openAcc === id;
  return `<div class="acc${open ? ' open' : ''}${due ? ' due' : ''}">
    <button type="button" data-acc="${id}" aria-expanded="${open}">
      <span><span class="acc-name">${esc(name)}</span>${meta ? `<span class="acc-meta">${esc(meta)}</span>` : ''}</span>
      <span class="acc-chev">${open ? '−' : '+'}</span>
    </button>
    ${open ? `<div class="acc-body">${bodyHtml}</div>` : ''}
  </div>`;
}
// Die Zeichnungen liegen als <template id="fig-…"> im Dokument
function figHtml(key) {
  const t = key ? document.getElementById('fig-' + key) : null;
  return t ? `<div class="fig">${t.innerHTML}</div>` : '';
}

// Letzte Einheit, in der diese Übung stand – ohne die gerade bearbeitete
function lastExUse(id) {
  const list = sorted();
  for (let i = list.length - 1; i >= 0; i--) {
    const e = list[i];
    if (e.id === editingId) continue;
    const v = e.details && e.details.ex && e.details.ex[id];
    if (v && (v.sets || v.reps || v.weight)) return { date: e.date, sets: v.sets || '', reps: v.reps || '', weight: v.weight || '' };
  }
  return null;
}
// „4 × 10 · Tempo 3/3“ → Platzhalter 4 und 10
function doseParts(dose) {
  const m = /^(\d+)\s*×\s*([\d–-]+)/.exec(dose || '');
  return m ? { sets: m[1], reps: m[2] } : { sets: '', reps: '' };
}

function exPickerHtml() {
  const pool = TYPES[draft.type].pool;

  let h = `<div class="field"><span class="field-label">Übungen</span><p class="hint">Antippen zum Auswählen, dann Sätze und Wiederholungen eintragen.</p>`;

    h += '<div class="seg">' + g.ids.map(id =>

  });
  h += '</div>';
  const chosen = groups.flatMap(g => g.ids).filter(id => draft.ex[id]);
  if (chosen.length) {
    h += '<div class="field">';
    chosen.forEach(id => {
      const ex = EX[id], v = draft.ex[id], last = lastExUse(id), ph = doseParts(ex.dose);
      h += `<div class="exrow">
        <div class="exrow-top"><span class="exrow-name">${esc(ex.name)}</span><span class="exrow-dose">Ziel: ${esc(ex.dose)}</span></div>
        <div class="exrow-in">
          <div><label for="f-ex-${id}-sets">Sätze</label>${num(`ex.${id}.sets`, v.sets, ph.sets)}</div>
          <div><label for="f-ex-${id}-reps">${UNIT_LABEL[ex.unit]}</label>${num(`ex.${id}.reps`, v.reps, ph.reps)}</div>
          ${ex.unit === 'wdh' ? `<div><label for="f-ex-${id}-weight">kg</label>${num(`ex.${id}.weight`, v.weight, last && last.weight ? last.weight : '0', true)}</div>` : ''}
        </div>
        ${last ? `<div class="exrow-last"><span>Zuletzt ${esc(relDay(last.date))}: ${esc(exDoseText(last, ex.unit))}</span><button type="button" class="sc-link" data-exlast="${id}">übernehmen</button></div>` : ''}
      </div>`;
    });
    h += '</div>';
  }
  return h;
}
function runFieldsHtml() {

/* ============================================ Diagramm */
// Zwei Reihen, eine Achse (beides Schmerz 0–10). Farben aus einer auf Farbenblindheit
// geprüften Palette – Rot bleibt in der App dem „Zurücknehmen“ vorbehalten.
const C_MORNING = 'var(--c-morning)', C_DURING = 'var(--c-during)';   // Tokens: passen sich dem Dark Mode an
let chartState = null;   // Geometrie + Tage mit Werten – fürs Antippen, bei jedem Zeichnen neu

// Breite des Platzes, den das Diagramm tatsächlich hat – auf dem Desktop steht es in einer Spalte
function chartWidth() {
  const box = document.getElementById('chartbox');
  if (box && box.clientWidth) return Math.max(240, box.clientWidth);
  const root = document.getElementById('root');
  const w = root && root.clientWidth ? root.clientWidth : 390;
  return Math.max(240, Math.min(w - 28, 640) - 38);   // Schätzung vor dem ersten Aufbau
}
function chartOutOfDate() {
  const box = document.getElementById('chartbox');
  return !!(box && box.clientWidth && chartState && Math.max(240, box.clientWidth) !== chartState.W);
}

function chartInnerHtml() {
  const t = today();
  const morn = state.mornings.filter(m => !m.skipped && typeof m.pain === 'number' && m.date <= t)
    .sort((a,b) => a.date.localeCompare(b.date));
  const dur = days().filter(d => d.painDuring != null && d.date <= t);   // höchster Wert je Trainingstag
  const firstDate = [...morn.map(m => m.date), ...dur.map(d => d.date)].sort()[0];
  if (!firstDate) { chartState = null; return ''; }

  let start = chartRange === 'all' ? firstDate : addDays(t, -(chartRange - 1));
  if (daysBetween(start, t) < 13) start = addDays(t, -13);   // mindestens zwei Wochen breit
  const nDays = daysBetween(start, t) + 1;

  const W = chartWidth(), H = 200, M = { l: 26, r: 8, t: 14, b: 26 };
  const pw = W - M.l - M.r, ph = H - M.t - M.b;
  // Jeder Tag bekommt eine Spalte: der Morgen links darin, das Training rechts – so, wie der Tag abläuft
  const X = (d, f) => M.l + ((daysBetween(start, d) + f) / nDays) * pw;
  const Y = v => M.t + ph - (v / 10) * ph;
  const n1 = v => v.toFixed(1);

  const mIn = morn.filter(m => m.date >= start);
  const dIn = dur.filter(d => d.date >= start).map(d => [d.date, d.painDuring]);

  // Y-Achse: Raster als feine, durchgezogene Linien
  let s = '';
  for (let v = 0; v <= 10; v += 2) {
    s += `<line x1="${M.l}" x2="${W - M.r}" y1="${n1(Y(v))}" y2="${n1(Y(v))}" style="stroke:var(${v ? '--chart-grid' : '--chart-axis'})" stroke-width="1"/>`
       + `<text x="${M.l - 7}" y="${n1(Y(v) + 3.5)}" text-anchor="end" class="chart-axis">${v}</text>`;
  }
  // Die Grenze ist eine Schwelle, kein Raster – deshalb gestrichelt und beschriftet
  s += `<line x1="${M.l}" x2="${W - M.r}" y1="${n1(Y(SCHMERZ_MAX))}" y2="${n1(Y(SCHMERZ_MAX))}" style="stroke:var(--chart-limit)" stroke-width="1" stroke-dasharray="4 3"/>`
     + `<text x="${M.l + 4}" y="${n1(Y(SCHMERZ_MAX) - 5)}" class="chart-axis chart-halo">Grenze ${SCHMERZ_MAX}</text>`;

  // X-Achse: Montage als Raster, Abstand passend zur verfügbaren Breite
  const maxTicks = Math.max(2, Math.floor(pw / 58));
  const step = [7, 14, 28, 56, 91, 182, 364].find(k => nDays / k <= maxTicks) || 364;
  let tick = start, lastX = -Infinity;
  while (new Date(tick + 'T12:00:00Z').getUTCDay() !== 1) tick = addDays(tick, 1);
  for (; tick <= t; tick = addDays(tick, step)) {
    const x = X(tick, 0.5);
    s += `<line x1="${n1(x)}" x2="${n1(x)}" y1="${n1(Y(0))}" y2="${n1(Y(0) + 4)}" style="stroke:var(--chart-axis)" stroke-width="1"/>`
       + `<text x="${n1(Math.min(Math.max(x, M.l + 12), W - M.r - 12))}" y="${H - 7}" text-anchor="middle" class="chart-axis">${fmt(tick)}</text>`;
    lastX = x;
  }
  if (W - M.r - lastX > 52) s += `<text x="${W - M.r}" y="${H - 7}" text-anchor="end" class="chart-axis">heute</text>`;

  // Beide Marker in der Tagesmitte: Morgen als Punkt, Training als Ring darum (gleicher Wert =
  // Ring um den Punkt). Die Größe hängt an der Spaltenbreite; bei „3 Monate“/„alles“ auf dem
  // Handy werden Punkte zur Linie und Ringe zu Strichen, sonst verschmilzt alles zu einem Band.
  const cell = pw / nDays;
  const tier = cell >= 8 ? 'dots' : cell >= 5 ? 'small' : 'dense';
  const rM = tier === 'dots' ? Math.min(4, cell * 0.3) : 2, rD = tier === 'dots' ? rM + 2 : 3.2;
  let path = '', prev = null;
  mIn.forEach(m => {
    path += `${prev && daysBetween(prev, m.date) === 1 ? 'L' : 'M'}${n1(X(m.date, 0.5))},${n1(Y(m.pain))} `;
    prev = m.date;
  });
  if (path) s += `<path d="${path.trim()}" fill="none" style="stroke:${C_MORNING}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  if (tier !== 'dense') s += mIn.map(m => `<circle cx="${n1(X(m.date, 0.5))}" cy="${n1(Y(m.pain))}" r="${n1(rM)}" style="fill:${C_MORNING};stroke:var(--card)" stroke-width="${tier === 'dots' ? 2 : 1.5}"/>`).join('');
  s += dIn.map(([day, v]) => tier === 'dense'
    ? `<line x1="${n1(X(day, 0.5))}" x2="${n1(X(day, 0.5))}" y1="${n1(Y(v) - 4)}" y2="${n1(Y(v) + 4)}" style="stroke:${C_DURING}" stroke-width="2" stroke-linecap="round"/>`
    : `<circle cx="${n1(X(day, 0.5))}" cy="${n1(Y(v))}" r="${n1(rD)}" fill="none" style="stroke:${C_DURING}" stroke-width="2"/>`).join('');

  // Namen am jeweils letzten Punkt – außer sie kämen sich ins Gehege, dann tragen Legende und Antippen
  const lm = mIn[mIn.length - 1], ld = dIn[dIn.length - 1];
  const pM = lm && { x: X(lm.date, 0.5), y: Y(lm.pain), text: 'Morgen' };
  const pD = ld && { x: X(ld[0], 0.5), y: Y(ld[1]), text: 'während' };
  const eng = pM && pD && Math.abs(pM.x - pD.x) < 64 && Math.abs(pM.y - pD.y) < 16;
  if (!eng) [pM, pD].filter(Boolean).forEach(q => {
    const links = q.x - M.l > 64;
    const y = q.y - M.t < 16 ? q.y + 16 : q.y - 8;
    s += `<text x="${n1(links ? q.x - 7 : q.x + 7)}" y="${n1(y)}" text-anchor="${links ? 'end' : 'start'}" class="chart-label chart-halo">${q.text}</text>`;
  });

  if (!mIn.length && !dIn.length) s += `<text x="${n1(M.l + pw / 2)}" y="${n1(M.t + ph / 2)}" text-anchor="middle" class="chart-axis">Keine Werte in diesem Zeitraum</text>`;

  s += `<line class="chart-cross" x1="0" x2="0" y1="${M.t}" y2="${n1(Y(0))}" style="stroke:var(--ink)" stroke-width="1" visibility="hidden"/>`
     + `<rect x="${M.l}" y="0" width="${pw}" height="${H}" fill="transparent"/>`;

  chartState = { W, M, pw, start, nDays, X, sel: null,
    dataDays: [...new Set([...mIn.map(m => m.date), ...dIn.map(([day]) => day)])].sort() };

  const zeitraum = chartRange === 28 ? 'den letzten 4 Wochen' : chartRange === 91 ? 'den letzten 3 Monaten' : `der Zeit seit ${fmt(start)}`;
  return `<div class="chart-head">
      <span class="chart-title">Schmerz 0–10</span>
      <div class="seg chart-range">${[[28, '4 Wochen'], [91, '3 Monate'], ['all', 'alles']].map(([v, l]) =>
        `<button type="button" data-act="chartRange" data-range="${v}" aria-pressed="${chartRange === v}">${l}</button>`).join('')}</div>
    </div>
    <div class="chart-wrap">
      <svg class="chart-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" tabindex="0"
        aria-label="Schmerzverlauf in ${zeitraum}: ${mIn.length} Morgenwerte, ${dIn.length} Trainingstage. Antippen oder Pfeiltasten zeigen die Werte eines Tages; alle Werte stehen auch im Verlauf darunter, ältere Tage nach dem Aufklappen.">${s}</svg>
      <div class="chart-tip" hidden></div>
    </div>
    <div class="chart-legend">
      <span><svg width="22" height="10" aria-hidden="true"><line x1="1" y1="5" x2="21" y2="5" style="stroke:${C_MORNING}" stroke-width="2"/><circle cx="11" cy="5" r="3.5" style="fill:${C_MORNING};stroke:var(--card)" stroke-width="1.5"/></svg>Schmerz am Morgen</span>
      <span><svg width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" style="stroke:${C_DURING}" stroke-width="2"/></svg>Schmerz während (Ring um den Tag, höchster Wert)</span>
    </div>`;
}

function updateChart() {
  const box = document.getElementById('chartbox');
  if (!box) return;
  const focusKey = focusKeyOf(document.activeElement);
  box.innerHTML = chartInnerHtml();
  focusEl(focusKey);
}

// Fadenkreuz + Werte eines Tages. Inhalt über textContent – Wert vorne und kräftig.
function chartShow(date) {
  const box = document.getElementById('chartbox');
  if (!box || !chartState) return;
  const tip = box.querySelector('.chart-tip'), cross = box.querySelector('.chart-cross'), svg = box.querySelector('.chart-svg');
  if (!tip || !cross || !svg) return;
  chartState.sel = date || null;
  if (!date) { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); return; }
  const x = chartState.X(date, 0.5);
  cross.setAttribute('x1', x.toFixed(1)); cross.setAttribute('x2', x.toFixed(1)); cross.setAttribute('visibility', 'visible');
  tip.replaceChildren();
  const head = document.createElement('div');
  head.className = 'chart-tip-date';
  head.textContent = `${weekday(date)}, ${fmt(date)}`;
  tip.append(head);
  const m = morningOf(date);
  const arten = [...new Set(entriesOf(date).map(e => typeLabel(e.type)))].join(', ');
  const rows = [[C_MORNING, m && !m.skipped ? m.pain : null, 'Morgen', m && !m.skipped && m.stiff ? 'steif ' + stiffLabel(m.stiff) : ''],
                [C_DURING, maxDuring(date), 'während', arten]];
  rows.forEach(([c, v, name, extra]) => {
    const row = document.createElement('div');
    row.className = 'chart-tip-row';
    const key = document.createElement('i');
    key.style.background = c;
    const val = document.createElement('b');
    val.textContent = v == null ? '–' : String(v);
    row.append(key, val, document.createTextNode(name + (extra ? ' · ' + extra : '')));
    tip.append(row);
  });
  tip.hidden = false;
  announce(`${weekday(date)}, ${fmt(date)}: ` + rows.map(([, v, name]) => `${name} ${v == null ? 'kein Wert' : v}`).join(', '));
  const w = svg.getBoundingClientRect().width;
  const px = x * (w / chartState.W);
  tip.style.left = Math.min(Math.max(px - tip.offsetWidth / 2, 0), Math.max(0, w - tip.offsetWidth)) + 'px';
}

// Heute Morgen: Pflicht, wenn gestern trainiert wurde – sonst freiwillig. Ältere offene
// Morgen kommen als eigene Liste darunter, damit der heutige nie verdrängt wird.
function morningTarget() {
  const t = today();
  if (morningOf(t)) return null;
  return { date: t, due: hasTraining(addDays(t, -1)) };
}
function openMornings() {
  const t = today();
  return pending().map(d => d.morningDate).filter(md => md !== t).sort().reverse();
}
function morningCardHtml(mt) {
  const prev = addDays(mt.date, -1);
  if (!mt.due && !morningOpen) return `<div class="card">

  return `<div class="card${mt.due ? ' pending' : ''}">
