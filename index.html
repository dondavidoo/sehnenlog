/* ============================================ Diagramm */
// Zwei Reihen, eine Achse (beides Schmerz 0–10). Farben aus einer auf Farbenblindheit
// geprüften Palette – Rot bleibt in der App dem „Zurücknehmen“ vorbehalten.
const C_MORNING = 'var(--c-morning)', C_DURING = 'var(--c-during)';   // Tokens: passen sich dem Dark Mode an
let chartState = null;   // Geometrie + Tage mit Werten – fürs Antippen, bei jedem Zeichnen neu

// Breite des Platzes, den das Diagramm tatsächlich hat – auf dem Desktop steht es in einer Spalte
function chartWidth() {
  const box = document.getElementById('chartbox');
  if (box && box.clientWidth) return Math.max(240, box.clientWidth);
  const root = document.getElementById('root');
  const w = root && root.clientWidth ? root.clientWidth : 390;
  return Math.max(240, Math.min(w - 28, 640) - 38);   // Schätzung vor dem ersten Aufbau
}
function chartOutOfDate() {
  const box = document.getElementById('chartbox');
  return !!(box && box.clientWidth && chartState && Math.max(240, box.clientWidth) !== chartState.W);
}

function chartInnerHtml() {
  const t = today();
  const morn = state.mornings.filter(m => !m.skipped && typeof m.pain === 'number' && m.date <= t)
    .sort((a,b) => a.date.localeCompare(b.date));
  const dur = days().filter(d => d.painDuring != null && d.date <= t);   // höchster Wert je Trainingstag
  const firstDate = [...morn.map(m => m.date), ...dur.map(d => d.date)].sort()[0];
  if (!firstDate) { chartState = null; return ''; }

  let start = chartRange === 'all' ? firstDate : addDays(t, -(chartRange - 1));
  if (daysBetween(start, t) < 13) start = addDays(t, -13);   // mindestens zwei Wochen breit
  const nDays = daysBetween(start, t) + 1;

  const W = chartWidth(), H = 200, M = { l: 26, r: 8, t: 14, b: 26 };
  const pw = W - M.l - M.r, ph = H - M.t - M.b;
  // Jeder Tag bekommt eine Spalte: der Morgen links darin, das Training rechts – so, wie der Tag abläuft
  const X = (d, f) => M.l + ((daysBetween(start, d) + f) / nDays) * pw;
  const Y = v => M.t + ph - (v / 10) * ph;
  const n1 = v => v.toFixed(1);

  const mIn = morn.filter(m => m.date >= start);
  const dIn = dur.filter(d => d.date >= start).map(d => [d.date, d.painDuring]);

  // Y-Achse: Raster als feine, durchgezogene Linien
  let s = '';
  for (let v = 0; v <= 10; v += 2) {
    s += `<line x1="${M.l}" x2="${W - M.r}" y1="${n1(Y(v))}" y2="${n1(Y(v))}" style="stroke:var(${v ? '--chart-grid' : '--chart-axis'})" stroke-width="1"/>`
       + `<text x="${M.l - 7}" y="${n1(Y(v) + 3.5)}" text-anchor="end" class="chart-axis">${v}</text>`;
  }
  // Die Grenze ist eine Schwelle, kein Raster – deshalb gestrichelt und beschriftet
  s += `<line x1="${M.l}" x2="${W - M.r}" y1="${n1(Y(SCHMERZ_MAX))}" y2="${n1(Y(SCHMERZ_MAX))}" style="stroke:var(--chart-limit)" stroke-width="1" stroke-dasharray="4 3"/>`
     + `<text x="${M.l + 4}" y="${n1(Y(SCHMERZ_MAX) - 5)}" class="chart-axis chart-halo">Grenze ${SCHMERZ_MAX}</text>`;

  // X-Achse: Montage als Raster, Abstand passend zur verfügbaren Breite
  const maxTicks = Math.max(2, Math.floor(pw / 58));
  const step = [7, 14, 28, 56, 91, 182, 364].find(k => nDays / k <= maxTicks) || 364;
  let tick = start, lastX = -Infinity;
  while (new Date(tick + 'T12:00:00Z').getUTCDay() !== 1) tick = addDays(tick, 1);
  for (; tick <= t; tick = addDays(tick, step)) {
    const x = X(tick, 0.5);
    s += `<line x1="${n1(x)}" x2="${n1(x)}" y1="${n1(Y(0))}" y2="${n1(Y(0) + 4)}" style="stroke:var(--chart-axis)" stroke-width="1"/>`
       + `<text x="${n1(Math.min(Math.max(x, M.l + 12), W - M.r - 12))}" y="${H - 7}" text-anchor="middle" class="chart-axis">${fmt(tick)}</text>`;
    lastX = x;
  }
  if (W - M.r - lastX > 52) s += `<text x="${W - M.r}" y="${H - 7}" text-anchor="end" class="chart-axis">heute</text>`;

  // Beide Marker in der Tagesmitte: Morgen als Punkt, Training als Ring darum (gleicher Wert =
  // Ring um den Punkt). Die Größe hängt an der Spaltenbreite; bei „3 Monate“/„alles“ auf dem
  // Handy werden Punkte zur Linie und Ringe zu Strichen, sonst verschmilzt alles zu einem Band.
  const cell = pw / nDays;
  const tier = cell >= 8 ? 'dots' : cell >= 5 ? 'small' : 'dense';
  const rM = tier === 'dots' ? Math.min(4, cell * 0.3) : 2, rD = tier === 'dots' ? rM + 2 : 3.2;
  let path = '', prev = null;
  mIn.forEach(m => {
    path += `${prev && daysBetween(prev, m.date) === 1 ? 'L' : 'M'}${n1(X(m.date, 0.5))},${n1(Y(m.pain))} `;
    prev = m.date;
  });
  if (path) s += `<path d="${path.trim()}" fill="none" style="stroke:${C_MORNING}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  if (tier !== 'dense') s += mIn.map(m => `<circle cx="${n1(X(m.date, 0.5))}" cy="${n1(Y(m.pain))}" r="${n1(rM)}" style="fill:${C_MORNING};stroke:var(--card)" stroke-width="${tier === 'dots' ? 2 : 1.5}"/>`).join('');
  s += dIn.map(([day, v]) => tier === 'dense'
    ? `<line x1="${n1(X(day, 0.5))}" x2="${n1(X(day, 0.5))}" y1="${n1(Y(v) - 4)}" y2="${n1(Y(v) + 4)}" style="stroke:${C_DURING}" stroke-width="2" stroke-linecap="round"/>`
    : `<circle cx="${n1(X(day, 0.5))}" cy="${n1(Y(v))}" r="${n1(rD)}" fill="none" style="stroke:${C_DURING}" stroke-width="2"/>`).join('');

  // Namen am jeweils letzten Punkt – außer sie kämen sich ins Gehege, dann tragen Legende und Antippen
  const lm = mIn[mIn.length - 1], ld = dIn[dIn.length - 1];
  const pM = lm && { x: X(lm.date, 0.5), y: Y(lm.pain), text: 'Morgen' };
  const pD = ld && { x: X(ld[0], 0.5), y: Y(ld[1]), text: 'während' };
  const eng = pM && pD && Math.abs(pM.x - pD.x) < 64 && Math.abs(pM.y - pD.y) < 16;
  if (!eng) [pM, pD].filter(Boolean).forEach(q => {
    const links = q.x - M.l > 64;
    const y = q.y - M.t < 16 ? q.y + 16 : q.y - 8;
    s += `<text x="${n1(links ? q.x - 7 : q.x + 7)}" y="${n1(y)}" text-anchor="${links ? 'end' : 'start'}" class="chart-label chart-halo">${q.text}</text>`;
  });

  if (!mIn.length && !dIn.length) s += `<text x="${n1(M.l + pw / 2)}" y="${n1(M.t + ph / 2)}" text-anchor="middle" class="chart-axis">Keine Werte in diesem Zeitraum</text>`;

  s += `<line class="chart-cross" x1="0" x2="0" y1="${M.t}" y2="${n1(Y(0))}" style="stroke:var(--ink)" stroke-width="1" visibility="hidden"/>`
     + `<rect x="${M.l}" y="0" width="${pw}" height="${H}" fill="transparent"/>`;

  chartState = { W, M, pw, start, nDays, X, sel: null,
    dataDays: [...new Set([...mIn.map(m => m.date), ...dIn.map(([day]) => day)])].sort() };

  const zeitraum = chartRange === 28 ? 'den letzten 4 Wochen' : chartRange === 91 ? 'den letzten 3 Monaten' : `der Zeit seit ${fmt(start)}`;
  return `<div class="chart-head">
      <span class="chart-title">Schmerz 0–10</span>
      <div class="seg chart-range">${[[28, '4 Wochen'], [91, '3 Monate'], ['all', 'alles']].map(([v, l]) =>
        `<button type="button" data-act="chartRange" data-range="${v}" aria-pressed="${chartRange === v}">${l}</button>`).join('')}</div>
    </div>
    <div class="chart-wrap">
      <svg class="chart-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" tabindex="0"
        aria-label="Schmerzverlauf in ${zeitraum}: ${mIn.length} Morgenwerte, ${dIn.length} Trainingstage. Antippen oder Pfeiltasten zeigen die Werte eines Tages; alle Werte stehen auch im Verlauf darunter, ältere Tage nach dem Aufklappen.">${s}</svg>
      <div class="chart-tip" hidden></div>
    </div>
    <div class="chart-legend">
      <span><svg width="22" height="10" aria-hidden="true"><line x1="1" y1="5" x2="21" y2="5" style="stroke:${C_MORNING}" stroke-width="2"/><circle cx="11" cy="5" r="3.5" style="fill:${C_MORNING};stroke:var(--card)" stroke-width="1.5"/></svg>Schmerz am Morgen</span>
      <span><svg width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" style="stroke:${C_DURING}" stroke-width="2"/></svg>Schmerz während (Ring um den Tag, höchster Wert)</span>
    </div>`;
}

function updateChart() {
  const box = document.getElementById('chartbox');
  if (!box) return;
  const focusKey = focusKeyOf(document.activeElement);
  box.innerHTML = chartInnerHtml();
  focusEl(focusKey);
}

// Fadenkreuz + Werte eines Tages. Inhalt über textContent – Wert vorne und kräftig.
function chartShow(date) {
  const box = document.getElementById('chartbox');
  if (!box || !chartState) return;
  const tip = box.querySelector('.chart-tip'), cross = box.querySelector('.chart-cross'), svg = box.querySelector('.chart-svg');
  if (!tip || !cross || !svg) return;
  chartState.sel = date || null;
  if (!date) { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); return; }
  const x = chartState.X(date, 0.5);
  cross.setAttribute('x1', x.toFixed(1)); cross.setAttribute('x2', x.toFixed(1)); cross.setAttribute('visibility', 'visible');
  tip.replaceChildren();
  const head = document.createElement('div');
  head.className = 'chart-tip-date';
  head.textContent = `${weekday(date)}, ${fmt(date)}`;
  tip.append(head);
  const m = morningOf(date);
  const arten = [...new Set(entriesOf(date).map(e => typeLabel(e.type)))].join(', ');
  const rows = [[C_MORNING, m && !m.skipped ? m.pain : null, 'Morgen', m && !m.skipped && m.stiff ? 'steif ' + stiffLabel(m.stiff) : ''],
                [C_DURING, maxDuring(date), 'während', arten]];
  rows.forEach(([c, v, name, extra]) => {
    const row = document.createElement('div');
    row.className = 'chart-tip-row';
    const key = document.createElement('i');
    key.style.background = c;
    const val = document.createElement('b');
    val.textContent = v == null ? '–' : String(v);
    row.append(key, val, document.createTextNode(name + (extra ? ' · ' + extra : '')));
    tip.append(row);
  });
  tip.hidden = false;
  announce(`${weekday(date)}, ${fmt(date)}: ` + rows.map(([, v, name]) => `${name} ${v == null ? 'kein Wert' : v}`).join(', '));
  const w = svg.getBoundingClientRect().width;
  const px = x * (w / chartState.W);
  tip.style.left = Math.min(Math.max(px - tip.offsetWidth / 2, 0), Math.max(0, w - tip.offsetWidth)) + 'px';
}

// Notausgang: wirft ein Tab beim Aufbau, bleibt die Seite sonst auf dem alten Stand

  let dump;

  catch (e) { dump = ''; }
  return `<div class="flag">
      <b>Die Ansicht konnte nicht aufgebaut werden</b>

    <div class="card">
      <h2>Rohdaten sichern</h2>
      <p class="lede">Vollständige Kopie deiner Einträge – erst sichern, dann zurücksetzen.</p>

// Fokus über den Neuaufbau retten: das aktive Element an seinen Datenattributen wiederfinden
function focusKeyOf(el) {
  if (!el || el === document.body || !document.getElementById('root').contains(el)) return null;
  if (el.id) return '#' + CSS.escape(el.id);
  if (el.classList.contains('chart-svg')) return '.chart-svg';
  const attrs = ['data-tab','data-act','data-ex','data-key','data-scale','data-seg','data-chips','data-apath','data-extoggle','data-exblock','data-exlast','data-acc','data-val','data-id','data-date','data-snap','data-type','data-range','data-sc','data-where','data-path','data-mpath','data-epath','data-tpath'];
  const parts = attrs.filter(a => el.hasAttribute(a)).map(a => `[${a}="${CSS.escape(el.getAttribute(a))}"]`);
  return parts.length ? parts.join('') : null;
}
const SCROLL = { block: 'start', behavior: (window.matchMedia && matchMedia('(prefers-reduced-motion: no-preference)').matches) ? 'smooth' : 'auto' };
function focusEl(sel) {
  const el = sel && document.querySelector(sel);
  if (el) el.focus({ preventScroll: true });
}
// Ansage für Hilfstechnik – die Seite wird komplett neu aufgebaut, sonst hört niemand die Rückmeldung
function announce(text) {
  const l = document.getElementById('live');
  if (!l) return;
  l.textContent = '';
  setTimeout(() => { l.textContent = text; }, 40);
}

function render() {
  if (!state.loaded) return;
  invalidate();
  const focusKey = focusKeyOf(document.activeElement);

  try {
    body = tab === 'heute' ? tabToday() : tab === 'fort' ? tabProgress() : tab === 'mehr' ? tabMore() : tab === 'plan' ? tabPlan() : tab === 'ex' ? tabEx() : tab === 'supp' ? tabSupp() : tab === 'scale' ? tabScales() : tab === 'data' ? tabData() : tabLog();
    if (MORE_IDS.includes(tab)) body = moreBarHtml() + body;
  } catch (err) {
    body = crashHtml(err);
  }
  document.getElementById('root').innerHTML = `<div class="wrap">
    <header class="masthead">
      <h1>Sehnenlog</h1>
      <p>Trainingstagebuch und kriterienbasiertes Programm für die Tibialis-posterior-Sehne. Offline, gespeichert auf diesem Gerät.</p>
    </header>
    <nav class="tabs" role="tablist" aria-label="Bereiche">
      ${TABS.map(([v,l]) => `<button role="tab" id="tab-${v}" aria-controls="panel" data-tab="${v}" aria-selected="${mainTab(tab)===v}" tabindex="${mainTab(tab)===v ? 0 : -1}">${l}</button>`).join('')}
    </nav>
    ${state.error ? `<div class="flag">
      <b>Konnte nicht gespeichert werden</b>
      <div>Deine Daten sind in dieser Sitzung vorhanden – aber beim Neuladen sind sie weg. Erzeug dir jetzt eine Sicherung, damit nichts verlorengeht.</div>
      <div style="margin-top:8px;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--card);border-radius:5px;padding:8px 10px">${esc(state.error)}</div>
      <div class="btn-row" style="margin-top:8px"><button class="btn small" data-act="backupFile">Sicherung als Datei</button><button class="btn quiet small" data-act="retrySave">Speichern erneut versuchen</button></div>
    </div>` : ''}
    <main id="panel" role="tabpanel" aria-labelledby="tab-${mainTab(tab)}">${body}</main>
  </div>`;
  // Das Diagramm rechnet in echten Pixeln – hat sich die Breite beim Aufbau verschoben, neu zeichnen
  if (tab === 'log' && chartOutOfDate()) updateChart();
  focusEl(focusKey);
}

/* ============================================ Sicherung */
function backupPayload() {
  return JSON.stringify({ app:'sehnenlog', exported:new Date().toISOString(), ...packState() });
}

// Auf dem Handy ist das Teilen-Blatt der richtige Weg (dort landet OneDrive),
// am Rechner ein normaler Download. Beides zählt als erfolgte Sicherung.
async function saveBackupFile() {
  const name = `sehnenlog-${today()}.json`;
  const text = backupPayload();
  try {
    const file = new File([text], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Sehnenlog-Sicherung' });
      await markBackup();
      return { ok: true, text: 'Sicherung geteilt. Leg sie in OneDrive ab, dann ist sie vom Gerät unabhängig.' };
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return { ok: false, text: 'Abgebrochen – es wurde nichts gesichert.' };
    // sonst fällt es unten auf den Download zurück
  }
  try {
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    await markBackup();
    return { ok: true, text: `Gespeichert als ${name}. Leg die Datei in OneDrive, dann überlebt sie dieses Gerät.` };
  } catch (e) {
    return { ok: false, text: 'Die Datei ließ sich nicht erzeugen. Nimm den Textweg weiter unten.' };
  }
}

// Gemeinsamer Weg für Textfeld und Datei. Nimmt auch Sicherungen aus der Zeit
// vor der Umstellung an und rechnet sie um.
async function applyBackup(raw) {
  if (!raw || !raw.trim()) {
    importMsg = { ok:false, text:'Das Feld ist leer. Füg zuerst den Sicherungstext ein oder wähl eine Datei.' };
    return render();
  }
  // Erst vollständig einlesen und prüfen, dann anwenden – sonst landen bei einem
  // Fehlschlag halbe Daten im Speicher, während die Meldung „ungültig“ behauptet.
  let n = null, parsed = null;
  try { parsed = JSON.parse(raw); n = normalize(parsed); } catch (e) { n = null; }
  if (!n) {
    importMsg = { ok:false, text:'Das war keine gültige Sicherung. Nimm die komplette Datei bzw. den kompletten Text, ohne etwas wegzulassen. Es wurde nichts verändert.' };
    return render();
  }
  let neu = 0, ersetzt = 0, mNeu = 0, mErsetzt = 0, tNeu = 0, tErsetzt = 0;
  n.entries.forEach(e => {
    const i = state.entries.findIndex(x => x.id === e.id);
    if (i >= 0) { state.entries[i] = e; ersetzt++; } else { state.entries.push(e); neu++; }
  });
  n.mornings.forEach(m => {
    const cur = morningOf(m.date);
    if (!cur) { state.mornings.push(m); invalidate(); mNeu++; }
    else if (m.skipped && !cur.skipped) { /* einen echten Wert nicht durch „übersprungen“ ersetzen */ }
    else { upsertMorning(m); mErsetzt++; }
  });
  n.tests.forEach(x => {
    if (testOf(x.date)) { upsertTest(x); tErsetzt++; } else { state.tests.push(x); invalidate(); tNeu++; }
  });
  // Programmstand (Leitern, Lauf, Ausrüstung) nur übernehmen, wenn die Sicherung ihn enthält
  let prog = false;
  if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
    if (parsed.ladders) { state.ladders = n.ladders; prog = true; }
    if (parsed.run) { state.run = n.run; prog = true; }
    if (parsed.settings) { state.settings = n.settings; prog = true; }
    if (parsed.plyo) { state.plyo = n.plyo; prog = true; }
  }
  importBuf = ''; state.dataNote = null; mEdit = null; closeForm();
  await save();
  importMsg = { ok:!state.error, text: state.error ? 'Nicht gespeichert – siehe Fehlermeldung oben.' :
    `Einheiten: ${neu} neu, ${ersetzt} aktualisiert. Morgen: ${mNeu} neu, ${mErsetzt} aktualisiert.${n.tests.length ? ` Tests: ${tNeu} neu, ${tErsetzt} aktualisiert.` : ''}${prog ? ' Stufenpläne und Ausrüstung übernommen.' : ''} Insgesamt ${state.entries.length} ${state.entries.length === 1 ? 'Einheit' : 'Einheiten'}.`
    + (n.dropped ? ` ${n.dropped} unvollständige ${n.dropped === 1 ? 'Zeile wurde' : 'Zeilen wurden'} übersprungen.` : '')
    + (n.doppelt ? ` Bei ${n.doppelt} Morgen gab es zwei Werte – übernommen wurde der Morgen-Check, der zweite steht in der Notiz.` : '') };
  announce(importMsg.text);
  render();
}

// Erfassung zuklappen und Entwurf verwerfen – nach Speichern, Abbrechen, Löschen, Import, Zurückholen
function closeForm() { editingId = null; draft = newDraft(); formOpen = false; whenOpen = false; testDraft = null; }
// Steht noch nichts im Entwurf, beginnt „Einheit erfassen“ frisch – mit der aktuellen Uhrzeit
function draftIsEmpty(d) {
  return d.painDuring == null && d.effort == null && !d.collagen && !d.progressed && !d.progressedWhat.trim() && !d.note.trim()
    && !Object.keys(d.ex).length && !Object.values(d.run).some(v => String(v).trim()) && !Object.values(d.session).some(v => String(v).trim());
}
function setPath(path, val) {
  const p = path.split('.');
  let o = draft;
  for (let i = 0; i < p.length - 1; i++) o = o[p[i]];
  o[p[p.length-1]] = val;
}

document.addEventListener('click', async (ev) => {
  if (chartState && chartState.sel && !(ev.target.closest && ev.target.closest('.chart-svg'))) chartShow(null);
  const t = ev.target.closest('[data-scale],[data-seg],[data-chips],[data-act],[data-tab],[data-extoggle],[data-exblock],[data-exlast],[data-acc]');
  if (!t) return;
  uiFlash = null;   // Rückmeldungen gelten nur bis zum nächsten Tippen

  if (t.dataset.tab) { tab = t.dataset.tab; openAcc = null; scaleJump = null; exJump = null; window.scrollTo(0,0); return render(); }
  if (t.dataset.acc) { openAcc = openAcc === t.dataset.acc ? null : t.dataset.acc; return render(); }
  if (t.dataset.extoggle) {
    const id = t.dataset.extoggle;
    if (draft.ex[id]) delete draft.ex[id]; else draft.ex[id] = exDefaults(id);
    return render();
  }
  if (t.dataset.exblock) {
    const ids = Object.keys(EX).filter(id => EX[id].g === t.dataset.exblock);
    const all = ids.every(id => draft.ex[id]);
    ids.forEach(id => { if (all) delete draft.ex[id]; else if (!draft.ex[id]) draft.ex[id] = { sets:'', reps:'', weight:'' }; });
    return render();
  }
  if (t.dataset.exlast) {
    const last = lastExUse(t.dataset.exlast);
    if (last) draft.ex[t.dataset.exlast] = { sets: last.sets, reps: last.reps, weight: last.weight };
    return render();
  }
  if (t.dataset.scale) {
    const v = +t.dataset.val;
    if (t.dataset.scale === 'mPain') morningDraft.pain = v;
    else if (t.dataset.scale === 'ePain') { if (mEdit) mEdit.pain = v; }
    else if (t.dataset.scale === 'aPain') { if (afterEdit) afterEdit.pain = v; }
    else if (t.dataset.scale === 'tAfter') { if (testDraft) testDraft.after = v; }
    else draft[t.dataset.scale] = v;
    return render();
  }
  if (t.dataset.chips) {
    const n = t.dataset.chips, v = t.dataset.val;
    const target = n === 'spots' ? draft : n === 'mSpots' ? morningDraft : n === 'eSpots' ? mEdit : n === 'aSpots' ? afterEdit : null;
    if (!target) return;
    const cur = asSpots(target.spots);
    target.spots = cur.includes(v) ? cur.filter(x => x !== v) : cur.concat([v]);
    return render();
  }
  if (t.dataset.seg) {
    if (t.dataset.seg === 'mStiff') morningDraft.stiff = t.dataset.val;
    else if (t.dataset.seg === 'eStiff') { if (mEdit) mEdit.stiff = t.dataset.val; }
    else { draft.type = t.dataset.val; draft.ex = {}; }
    return render();
  }

  const act = t.dataset.act;
  if (act === 'gotoScale') {
    const sc = t.dataset.sc, from = t.dataset.from;
    scaleJump = { sc, from };
    tab = 'scale'; openAcc = null;
    render();
    document.getElementById('sc-' + sc)?.scrollIntoView({ block:'start' });
    return;
  }
  if (act === 'gotoEx') {
    const id = t.dataset.ex; if (!EX[id]) return;
    exJump = { id, from: tab };
    tab = 'ex'; openAcc = id; scaleJump = null;
    render();
    document.querySelector(`[data-acc="${CSS.escape(id)}"]`)?.scrollIntoView({ block: 'start' });
    focusEl(`[data-acc="${CSS.escape(id)}"]`);
    return;
  }
  if (act === 'backFromEx') {
    const from = exJump && exJump.from;
    exJump = null; openAcc = null; tab = from === 'log' ? 'log' : 'heute';
    render(); window.scrollTo(0, 0);
    return;
  }
  if (act === 'backFromScale') {
    const from = scaleJump && scaleJump.from;
    scaleJump = null; tab = 'log';
    render();
    const el = from && document.getElementById(from);
    if (el) el.scrollIntoView({ block:'center' }); else window.scrollTo(0,0);
    return;
  }
  if (act === 'setToday') { draft.date = today(); draft.time = nowTime(); whenOpen = false; return render(); }
  if (act === 'openFromToday') {
    draft = newDraft(); draft.type = TYPES[t.dataset.type] ? t.dataset.type : 'kraft';
    if (draft.type === 'kraft') draft.ex = exFromLadders();
    if (draft.type === 'plyo') { const s = plyoStatus(), tgt = s.ready && s.next ? s.next : s.cur; if (tgt) draft.ex = { [tgt.ex]: { sets: String(tgt.sets), reps: String(tgt.reps), weight: '' } }; }
    testDraft = null; formOpen = true; editingId = null; tab = 'log';
    render();
    document.getElementById('form')?.scrollIntoView(SCROLL);
    focusEl('#form h2');
    return;
  }
  if (act === 'ladderUp' || act === 'ladderDown') {
    const k = t.dataset.key, L = LADDERS[k]; if (!L) return;
    const st = state.ladders[k], ns = act === 'ladderUp' ? Math.min(st.step + 1, L.steps.length - 1) : Math.max(-1, st.step - 1);
    if (ns === st.step) return;
    state.ladders[k] = { step: ns, since: today() };
    await save(); announce(`${L.name}: ${ns < 0 ? 'aus der Einheit genommen' : 'Stufe ' + (ns + 1)}.`);
    return;
  }
  if (act === 'plyoUp' || act === 'plyoDown') {
    const st = state.plyo || cleanPlyo(null), ns = act === 'plyoUp' ? Math.min(st.step + 1, PLYO_STEPS.length - 1) : Math.max(-1, st.step - 1);
    if (ns === st.step) return;
    state.plyo = { step: ns, since: today() };
    await save(); announce(ns < 0 ? 'Plyometrie zurückgesetzt.' : `Plyometrie: ${PLYO_STEPS[ns].label}.`);
    return;
  }
  if (act === 'runUp' || act === 'runDown') {
    const st = state.run, ns = act === 'runUp' ? Math.min(st.step + 1, RUN_MAX_STEPS - 1) : Math.max(-1, st.step - 1);
    if (ns === st.step) return;
    state.run = { step: ns, since: today() };
    await save(); announce(ns < 0 ? 'Laufen zurückgesetzt.' : `Laufen: ${runStepText(ns)}.`);
    return;
  }
  if (act === 'editWhen') { whenOpen = true; return render(); }
  if (act === 'openForm') {
    if (!TYPES[t.dataset.type]) return;
    if (draftIsEmpty(draft)) draft = newDraft();
    if (draft.type !== t.dataset.type) { draft.type = t.dataset.type; draft.ex = {}; }
    testDraft = null; formOpen = true;
    render();
    document.getElementById('form')?.scrollIntoView(SCROLL);
    focusEl('#form h2');
    return;
  }
  if (act === 'saveEntry') {
    const kind = TYPES[draft.type].kind;
    const details = kind === 'ex' ? { ex: JSON.parse(JSON.stringify(draft.ex)) }
      : kind === 'run' ? { ...draft.run } : { ...draft.session };
    const base = { date:draft.date, time:draft.time, type:draft.type, details,
      painDuring:draft.painDuring, painAfter: draft.painAfter, allDay: !!draft.allDay, spots: asSpots(draft.spots),
      effort: draft.type === 'kraft' ? draft.effort : null,
      collagen:draft.collagen, progressed:draft.progressed, progressedWhat: draft.progressed ? draft.progressedWhat.trim() : '', note:draft.note.trim() };

    if (!entryOk()) return;   // der Knopf ist dann ohnehin gesperrt
    const art = typeLabel(base.type);
    const wann = `${relDay(base.date)}${base.time ? ' ' + base.time : ''}`;
    let text;
    if (editingId) {
      // Morgenwerte hängen nicht mehr an der Einheit – Umdatieren ist deshalb unkritisch
      const e = state.entries.find(x => x.id === editingId);
      // Alteinträge (v1/v2) trugen den Freitext in „detail“; der steht seit dem Öffnen in der Notiz und würde sonst die neuen Felder verdecken
      if (e) {
        delete e.detail; Object.assign(e, base); text = `Änderung gespeichert: ${art}, ${wann}.`;
        invalidate();
        if (!entryClean(e)) revertLadderAdvance(e);   // nachträglich Schmerz eingetragen: Schritt zurück
        else { const adv = applyLadderAdvance(e); if (adv) text += ` Neue Stufe: ${adv.join(', ')}.`; }
      }
      else text = null;   // die Einheit gibt es nicht mehr (gelöscht, zurückgeholt, ersetzt)
      editingId = null;
    } else {
      const neu = { id:'e'+Date.now(), ...base };
      state.entries.push(neu);
      text = `Gespeichert: ${art}, ${wann}.`;
      invalidate();
      const adv = applyLadderAdvance(neu), radv = applyRunAdvance(neu), padv = applyPlyoAdvance(neu);
      if (adv) text += ` Neue Stufe: ${adv.join(', ')}.`;
      if (radv) text += ` Laufstufe: ${radv}.`;
      if (padv) text += ` Plyometrie: ${padv}.`;
    }
    closeForm();
    await save();
    // Erst nach dem Speichern bestätigen – ein Speicherfehler zeigt sonst „Gespeichert“ neben der Fehlerkarte
    if (text === null) uiFlash = { where: 'entry', ok: false, text: 'Diese Einheit gibt es nicht mehr – die Änderung wurde nicht gespeichert.' };
    else if (!state.error) uiFlash = { where: 'entry', ok: true, text };
    if (uiFlash) announce(uiFlash.text);
    render();
    // Das Formular klappt zu – die Bestätigung im Blick behalten, Fokus auf den Kartentitel
    document.getElementById('form')?.scrollIntoView({ block: 'nearest' });
    focusEl('#form h2');
    return;
  }
  if (act === 'edit') {
    const e = state.entries.find(x => x.id === t.dataset.id);
    if (e) { editingId = e.id; draft = draftFromEntry(e); formOpen = true; render(); document.getElementById('form')?.scrollIntoView(SCROLL); focusEl('#form h2'); }
    return;
  }
  if (act === 'cancelEdit') { closeForm(); return render(); }

  if (act === 'editAfter') {
    const e = state.entries.find(x => x.id === t.dataset.id);
    if (e) { const withVal = entriesOf(e.date).find(x => x.painAfter != null) || e; afterEdit = { date: e.date, pain: withVal.painAfter ?? null, allDay: !!withVal.allDay, spots: asSpots(withVal.spots) }; render(); focusEl('#f-aPain button'); }
    return;
  }
  if (act === 'cancelAfter') { afterEdit = null; return render(); }
  if (act === 'saveAfter') {
    const es = afterEdit ? entriesOf(afterEdit.date) : [];
    if (!es.length || afterEdit.pain == null || needSpots(afterEdit.pain, afterEdit.spots)) return;
    es.forEach(e => { e.painAfter = afterEdit.pain; e.allDay = !!afterEdit.allDay; e.spots = asSpots([...(e.spots || []), ...afterEdit.spots]); if (!entryClean(e)) revertLadderAdvance(e); });
    const wann = fmt(afterEdit.date);
    afterEdit = null; await save();
    if (!state.error) { uiFlash = { where: tab === 'heute' ? 'today' : 'history', ok: true, text: `Schmerz danach für den ${wann} gespeichert.` }; announce(uiFlash.text); }
    return render();
  }
  if (act === 'saveMorning') {
    const date = t.dataset.date;
    if (!isIsoDate(date) || !morningOk(morningDraft)) return;
    const m = makeMorning(date, morningDraft.pain, morningDraft.stiff, morningDraft.note, morningDraft.spots);
    upsertMorning(m);
    morningDraft = {}; morningOpen = false; await save();
    const text = `Morgen vom ${fmt(date)} gespeichert: Schmerz ${m.pain}, Sehne steif ${stiffLabel(m.stiff)}`;
    if (!state.error) { uiFlash = { where: 'morning', ok: true, text: text.endsWith('.') ? text : text + '.' }; announce(uiFlash.text); }
    render(); focusEl('#morning-flash');
    return;
  }
  if (act === 'skipMorning') {
    const date = t.dataset.date;
    if (!isIsoDate(date)) return;
    upsertMorning(skippedMorning(date));
    morningDraft = {}; await save();
    if (!state.error) { uiFlash = { where: 'morning', ok: true, text: `Morgen vom ${fmt(date)} übersprungen – im Verlauf lässt er sich nachtragen.` }; announce(uiFlash.text); }
    render(); focusEl('#morning-flash');
    return;
  }
  if (act === 'openMorning') { morningOpen = true; return render(); }
  if (act === 'closeMorning') { morningOpen = false; morningDraft = {}; return render(); }
  if (act === 'editMorning') {
    const date = t.dataset.date, m = morningOf(date);
    mEdit = { date, pain: m && !m.skipped ? m.pain : null, stiff: m && !m.skipped ? m.stiff : null,
      note: m ? m.note || '' : '', spots: m && !m.skipped ? asSpots(m.spots) : [], where: t.dataset.where || 'day' };
    return render();
  }
  if (act === 'addMorning') {
    mEdit = { date: today(), pain: null, stiff: null, note: '', spots: [], where: 'free' };
    render();
    document.querySelector('.m-edit')?.scrollIntoView({ block: 'center' });
    return;
  }
  if (act === 'saveMorningEdit') {
    if (!mEdit || !isIsoDate(mEdit.date) || mEdit.date > today() || !morningOk(mEdit)) return;
    upsertMorning(makeMorning(mEdit.date, mEdit.pain, mEdit.stiff, mEdit.note, mEdit.spots));
    const gespeichert = mEdit.date;
    mEdit = null; await save();
    announce(`Morgen vom ${fmt(gespeichert)} gespeichert.`);
    return;
  }
  if (act === 'cancelMorningEdit') { mEdit = null; return render(); }
  if (act === 'delMorning') {
    if (!mEdit || !confirm(`Morgenwert vom ${fmt(mEdit.date)} entfernen?`)) return;
    const date = mEdit.date;
    state.mornings = state.mornings.filter(x => x.date !== date);
    mEdit = null; await save();
    return;
  }
  if (act === 'toggleDays') {
    histOpen = !histOpen;
    // Ein offener Morgen-Editor in einem jetzt verborgenen Tag würde unsichtbar weiterlaufen
    if (!histOpen && mEdit && mEdit.where === 'day' && !dayList().slice(0, HIST_KURZ).includes(mEdit.date)) mEdit = null;
    render();
    // Beim Einklappen schrumpft die Seite – den Knopf im Blick behalten statt irgendwo weiter unten zu landen
    if (!histOpen) document.querySelector('[data-act="toggleDays"]')?.scrollIntoView({ block: 'center' });
    return;
  }
  if (act === 'chartRange') { chartRange = t.dataset.range === 'all' ? 'all' : +t.dataset.range; updateChart(); return; }
  if (act === 'dismissMigration') { state.migrationNote = null; return render(); }
  if (act === 'dismissItp') { state.meta.itpSeen = true; await saveMeta(); return render(); }
  if (act === 'copyRescue') {
    if (!state.rescue) return;
    try { await navigator.clipboard.writeText(state.rescue.raw); t.textContent = 'Kopiert'; announce('Rohtext kopiert.'); setTimeout(() => { t.textContent = 'Kopieren'; }, 1600); }
    catch (e) { importMsg = { ok:false, text:'Kopieren hat nicht geklappt – der Rohtext bleibt im Sicherheitsnetz liegen.' }; render(); }
    return;
  }
  if (act === 'dropRescue') {
    if (!confirm('Den unlesbaren Rohtext verwerfen? Danach ist er weg.')) return;
    await dropSnapshot(KEY_RESCUE); state.rescue = null;
    return render();
  }

  // Löschen gibt es nur im Bearbeitungsformular – die Zeilen im Verlauf haben alle denselben einen Knopf „ändern“
  if (act === 'del') {
    const e = state.entries.find(x => x.id === t.dataset.id);
    if (!e) return;
    closeForm();
    state.entries = state.entries.filter(x => x.id !== e.id);
    lastDeleted = e;
    revertLadderAdvance(e);
    await save();
    if (!state.error) { uiFlash = { where: 'entry', ok: true, undo: true, text: `Einheit vom ${fmt(e.date)} (${typeLabel(e.type)}) gelöscht.` }; announce(uiFlash.text + ' Rückgängig ist möglich.'); }
    render();
    document.getElementById('form')?.scrollIntoView({ block: 'nearest' });
    focusEl('#form h2');
    return;
  }
  if (act === 'undoDel') {
    if (!lastDeleted) return;
    const e = lastDeleted;
    if (!state.entries.some(x => x.id === e.id)) state.entries.push(e);
    lastDeleted = null;
    invalidate(); applyLadderAdvance(e); applyRunAdvance(e); applyPlyoAdvance(e);
    await save();
    if (!state.error) { uiFlash = { where: 'entry', ok: true, text: `Einheit vom ${fmt(e.date)} wiederhergestellt.` }; announce(uiFlash.text); }
    return render();
  }

  if (act === 'openTest') {
    closeForm();
    testDraft = { date: today(), right: '', left: '', note: '', jumpR: '', jumpL: '', hops: '', balance: false, after: null, orig: null };
    render();
    document.getElementById('form')?.scrollIntoView(SCROLL);
    focusEl('#form h2');
    return;
  }
  if (act === 'editTest') {
    const x = testOf(t.dataset.date);
    if (!x) return;
    closeForm();
    testDraft = { date: x.date, right: String(x.right), left: String(x.left), note: x.note || '', jumpR: x.jumpR ?? '', jumpL: x.jumpL ?? '', hops: x.hops ?? '', balance: !!x.balance, after: x.after ?? null, orig: x.date };
    render();
    document.getElementById('form')?.scrollIntoView(SCROLL);
    focusEl('#form h2');
    return;
  }
  if (act === 'cancelTest') { testDraft = null; return render(); }
  if (act === 'saveTest') {
    if (!testDraft) return;
    const d = testDraft, c = testCheck(d);
    if (!c.ok) return;   // der Knopf ist dann ohnehin gesperrt
    if (d.orig && d.orig !== d.date) state.tests = state.tests.filter(x => x.date !== d.orig);   // umdatiert
    upsertTest(makeTest(d.date, c.r, c.l, d.note, d));
    const text = `${d.orig ? 'Änderung gespeichert' : 'Gespeichert'}: Test, ${relDay(d.date)} – rechts ${c.r}, links ${c.l}. Das Ergebnis steht, sobald der Morgenwert vom Folgetag da ist.`;
    testDraft = null;
    await save();
    if (!state.error) { uiFlash = { where: 'entry', ok: true, text }; announce(text); }
    render();
    document.getElementById('form')?.scrollIntoView({ block: 'nearest' });
    focusEl('#form h2');
    return;
  }
  if (act === 'delTest') {
    if (!testDraft || !testDraft.orig || !confirm(`Monatstest vom ${fmt(testDraft.orig)} entfernen?`)) return;
    const date = testDraft.orig;
    state.tests = state.tests.filter(x => x.date !== date);
    testDraft = null;
    await save();
    announce(`Monatstest vom ${fmt(date)} entfernt.`);
    return;
  }
  if (act === 'export') { showExport = true; render(); document.getElementById('exportbox')?.scrollIntoView({block:'nearest'}); return; }
  if (act === 'copy') {
    const box = document.getElementById('exportbox');
    if (box) {
      box.select();
      try { await navigator.clipboard.writeText(box.value); } catch (e) { document.execCommand('copy'); }
      t.textContent = 'Kopiert'; announce('In die Zwischenablage kopiert.'); setTimeout(() => { t.textContent = 'Kopieren'; }, 1600);
    }
    return;
  }
  if (act === 'retrySave') { await save(); return; }
  if (act === 'backup') {
    showBackup = true;
    importMsg = null; render();
    document.getElementById('backupbox')?.scrollIntoView({ block:'nearest' });
    return;
  }
  if (act === 'copyBackup') {
    const box = document.getElementById('backupbox');
    if (box) {
      box.select();
      try { await navigator.clipboard.writeText(box.value); } catch (e) { document.execCommand('copy'); }
      await markBackup();
      t.textContent = 'Kopiert'; setTimeout(() => { t.textContent = 'Kopieren'; }, 1600);
    }
    return;
  }
  if (act === 'restore') {
    const box = document.getElementById('impbox');
    const raw = (box && box.value ? box.value : importBuf) || '';
    await applyBackup(raw);
    return;
  }
  if (act === 'reset') {
    if (!hasData()) return;
    const ersetzt = state.snapTrash ? `\n\nAchtung: Im Papierkorb liegt schon ein Stand vom ${fmtWhen(state.snapTrash.at)} – der wird dabei ersetzt.` : '';
    if (!confirm('Alle Einträge löschen?\n\nDer Stand wandert in den Papierkorb und lässt sich danach zurückholen – bis du ihn dort endgültig leerst. Ältere Kopien auf diesem Gerät werden entfernt.' + ersetzt)) return;
    await writeSnapshot(KEY_TRASH, packState());
    state.entries = []; state.mornings = []; state.tests = []; mEdit = null; morningDraft = {}; state.dataNote = null;
    closeForm(); lastDeleted = null;
    await save({ skipPrev: true, silent: true });                    // sonst läge das Gelöschte noch einmal im Vorgängerstand
    await dropSnapshot(KEY_PREV);
    for (const k of KEYS_ALT) { try { await window.storage.remove(k); } catch (e) {} }   // Kopien aus der Zeit vor der Umstellung
    state.snapPrev = null;
    state.snapTrash = await readSnapshot(KEY_TRASH);
    announce('Alle Einträge gelöscht. Der Stand liegt im Papierkorb.');
    return render();
  }

  if (act === 'backupFile') {
    const r = await saveBackupFile();
    importMsg = tab === 'data' ? r : null;
    if (tab === 'log') uiFlash = { where: 'backup', ok: r.ok, text: r.text };
    announce(r.text);
    return render();
  }
  if (act === 'restoreSnap') {
    const snap = t.dataset.snap === 'trash' ? state.snapTrash : state.snapPrev;
    if (!snap) return;
    // save() legt den jetzigen Stand automatisch als Vorgänger ab – also umkehrbar
    // Kopieren – sonst teilen sich Verlauf und Papierkorb dieselben Objekte und jede Änderung landet im Papierkorb
    state.entries = JSON.parse(JSON.stringify(snap.entries)); state.mornings = JSON.parse(JSON.stringify(snap.mornings));
    state.tests = JSON.parse(JSON.stringify(snap.tests || [])); mEdit = null;
    state.dataNote = null; importMsg = null;
    closeForm(); lastDeleted = null;
    await save({ silent: true });
    return render();
  }
  if (act === 'emptyTrash') {
    if (!confirm('Papierkorb endgültig leeren? Der gelöschte Stand ist danach wirklich weg.')) return;
    await dropSnapshot(KEY_TRASH);
    state.snapTrash = null;
    return render();
  }
  if (act === 'askPersist') {
    await checkPersistence(true);
    return render();
  }
});

async function readBackupFile(file) {
  if (!file) return;
  try {
    const text = await file.text();
    await applyBackup(text);
  } catch (e) {
    importMsg = { ok:false, text:'Die Datei ließ sich nicht lesen.' };
    render();
  }
}

function onField(ev) {
  if (ev.target.id === 'impfile') {
    const f = ev.target.files && ev.target.files[0];
    ev.target.value = '';   // damit dieselbe Datei erneut gewählt werden kann
    readBackupFile(f);
    return;
  }
  if (ev.target.id === 'impbox') { importBuf = ev.target.value; return; }
  const ep = ev.target.dataset.epath;
  if (ep) { if (mEdit) { mEdit[ep] = ev.target.value; if (ep === 'date') refreshMorningEdit(); } return; }
  const ap = ev.target.dataset.apath;
  if (ap) { if (afterEdit) afterEdit[ap] = ev.target.type === 'checkbox' ? ev.target.checked : ev.target.value; return; }
  const tp = ev.target.dataset.tpath;
  if (tp) { if (testDraft) { testDraft[tp] = ev.target.type === 'checkbox' ? ev.target.checked : ev.target.value; updateTestForm(); } return; }
  const sp = ev.target.dataset.spath;
  if (sp) {
    if (ev.type !== 'change') return;   // erst beim Verlassen des Felds speichern
    const [kind, i, f] = sp.split('.');
    if (kind === 'hantelSchritt') { const v = +ev.target.value; if (v > 0) state.settings.hantelSchritt = v; }
    else if (state.settings[kind] && state.settings[kind][+i]) state.settings[kind][+i][f] = ev.target.value.trim();
    save({ silent: true }).then(render);
    return;
  }
  const mp = ev.target.dataset.mpath;
  if (mp) { morningDraft[mp] = ev.target.value; return; }
  const p = ev.target.dataset.path;
  if (!p) return;
  const isCb = ev.target.type === 'checkbox';
  setPath(p, isCb ? ev.target.checked : ev.target.value);
  // Kein Neuaufbau beim Tippen – nur die abhängigen Hinweise und der Knopf werden nachgeführt
  if (isCb || p === 'time' || p === 'date' || p.startsWith('run.')) refreshEntryForm();
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);

/* Diagramm: Antippen, Maus, Tastatur. Das Fadenkreuz springt zum nächsten Tag mit
   Werten – man zielt auf ein Datum, nicht auf einen Punkt. */
function chartPick(ev) {
  const svg = ev.target && ev.target.closest ? ev.target.closest('.chart-svg') : null;
  if (!svg || !chartState || !chartState.dataDays.length) return;
  const r = svg.getBoundingClientRect();
  const px = (ev.clientX - r.left) * (chartState.W / r.width);
  const pos = ((px - chartState.M.l) / chartState.pw) * chartState.nDays - 0.5;
  let best = null, dist = Infinity;
  chartState.dataDays.forEach(day => {
    const k = Math.abs(daysBetween(chartState.start, day) - pos);
    if (k < dist) { dist = k; best = day; }
  });
  if (best !== chartState.sel) chartShow(best);
}
document.addEventListener('pointermove', chartPick);
document.addEventListener('pointerdown', chartPick);
document.addEventListener('pointerout', ev => {
  if (ev.pointerType !== 'mouse') return;
  const svg = ev.target && ev.target.closest ? ev.target.closest('.chart-svg') : null;
  if (svg && !svg.contains(ev.relatedTarget)) chartShow(null);
});
document.addEventListener('focusin', ev => {
  const c = ev.target.classList;
  if (c && c.contains('chart-svg') && chartState && chartState.dataDays.length && !chartState.sel)
    chartShow(chartState.dataDays[chartState.dataDays.length - 1]);
});
document.addEventListener('keydown', ev => {
  const c = ev.target.classList;
  if (!c || !c.contains('chart-svg') || !chartState || !chartState.dataDays.length) return;
  const list = chartState.dataDays;
  let i = list.indexOf(chartState.sel);
  if (ev.key === 'ArrowLeft') i = i < 0 ? list.length - 1 : Math.max(0, i - 1);
  else if (ev.key === 'ArrowRight') i = i < 0 ? list.length - 1 : Math.min(list.length - 1, i + 1);
  else if (ev.key === 'Escape') { chartShow(null); return; }
  else return;
  ev.preventDefault();
  chartShow(list[i]);
});
// Tabs: Pfeiltasten wechseln den Bereich (der gewählte Tab ist der einzige mit tabindex 0)
document.addEventListener('keydown', ev => {
  const b = ev.target && ev.target.closest ? ev.target.closest('.tabs [data-tab]') : null;
  if (!b) return;
  const i = TABS.findIndex(([v]) => v === tab);
  let j = null;
  if (ev.key === 'ArrowRight') j = (i + 1) % TABS.length;
  else if (ev.key === 'ArrowLeft') j = (i - 1 + TABS.length) % TABS.length;
  else if (ev.key === 'Home') j = 0;
  else if (ev.key === 'End') j = TABS.length - 1;
  if (j === null) return;
  ev.preventDefault();
  tab = TABS[j][0]; openAcc = null; scaleJump = null; render();
  focusEl(`[data-tab="${tab}"]`);
});

// Nur bei geänderter Breite neu zeichnen – die Bildschirmtastatur ändert nur die Höhe
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (chartOutOfDate()) updateChart();
  }, 150);
});

/* Offline-Cache. Nur unter http(s) möglich – wird die Datei direkt vom Dateisystem
   geöffnet (file://), gibt es keinen Service Worker. Die App läuft dann trotzdem,
   nur eben ohne Offline-Garantie. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { /* ohne Cache weiterarbeiten */ });
  });
}

// Nur für Tests (siehe test/): Uhr, Datenstand und Entwurf von außen setzen
const _test = {
  setNow(f) { _now = f; },
  setState(s) { state.entries = s.entries || []; state.mornings = s.mornings || []; state.tests = s.tests || [];
    state.settings = cleanSettings(s.settings); state.ladders = cleanLadders(s.ladders); state.run = cleanRun(s.run); state.plyo = cleanPlyo(s.plyo); state.loaded = true; invalidate(); },
  setDraft(d, editing) { draft = d; editingId = editing ?? null; },
  setTab(t) { tab = t; },
  ui() { return { tab, formOpen, editingId, testDraft, uiFlash, lastDeleted, draft, mEdit }; },
  setMEdit(m) { mEdit = m; },
  setAfterEdit(a) { afterEdit = a; },
  setProgrammStart(d) { PROGRAMM_START = d; },
  openForm(on) { formOpen = !!on; }
};

load();

</script>
