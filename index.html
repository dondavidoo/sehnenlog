<!DOCTYPE html>

<head>

<title>Sehnenlog</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%2318211F%22%2F%3E%3Cpath%20d%3D%22M20%2044%20L20%2020%20M20%2032%20Q32%2020%2044%2032%22%20stroke%3D%22%235FB79A%22%20stroke-width%3D%226%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">

<style>
html, body { margin: 0; padding: 0; background: #F1F4F5; }
body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }

  :root {
    --paper: #F1F4F5; --card: #FFFFFF; --ink: #18211F; --ink-soft: #5C6A6B;
    --rule: #D2DBDC; --rule-soft: #E5EBEC; --act: #1D5B6E;
    --up: #2E7D5B; --down: #A93B31;
    --up-bg: #E6F1EC; --hold-bg: #F6EEDD; --down-bg: #F7E7E5;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  #root { font-family: var(--sans); color: var(--ink); background: var(--paper); line-height: 1.5;
    -webkit-font-smoothing: antialiased; padding: 20px 14px 48px; }
  #root * { box-sizing: border-box; }
  .boot { padding: 40px 0; text-align: center; color: var(--ink-soft); }
  .wrap { max-width: 640px; margin: 0 auto; }

  .masthead { margin-bottom: 14px; }
  .masthead h1 { margin: 0; font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }
  .masthead p { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-soft); }

  .tabs { display: flex; gap: 5px; margin-bottom: 16px; flex-wrap: wrap; }
  .tabs button { font-family: inherit; font-size: 14px; font-weight: 600; padding: 9px 14px;
    border-radius: 7px; border: 1px solid var(--rule); background: #fff; color: var(--ink-soft); cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }

  .card { background: var(--card); border: 1px solid var(--rule-soft); border-radius: 10px; padding: 18px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 4px; font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  .card .lede { margin: 0 0 14px; font-size: 13.5px; color: var(--ink-soft); }

  .verdict { border: 1px solid var(--rule); border-radius: 10px; padding: 20px; margin-bottom: 14px; }
  .verdict.up { background: var(--up-bg); border-color: #BFDACE; }
  .verdict.hold { background: var(--hold-bg); border-color: #E3D2AE; }
  .verdict.down { background: var(--down-bg); border-color: #E8C4C0; }
  .verdict.none { background: var(--card); }
  .verdict-kicker { font-size: 13px; color: var(--ink-soft); margin: 0 0 6px; }
  .verdict-word { margin: 0; font-size: 32px; font-weight: 680; letter-spacing: -0.03em; line-height: 1.1; }
  .verdict.up .verdict-word { color: var(--up); }
  .verdict.hold .verdict-word { color: #9A6B12; }
  .verdict.down .verdict-word { color: var(--down); }
  .verdict ul { margin: 12px 0 0; padding-left: 18px; font-size: 14px; }
  .verdict li { margin-bottom: 5px; }
  .verdict .todo { margin: 14px 0 0; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.09); font-size: 14px; }

  .field { margin-bottom: 18px; }
  .field > label, .field-label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .hint { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 8px; }

  .scale { display: flex; gap: 3px; }
  .scale button { flex: 1; min-width: 0; height: 42px; font-family: inherit; font-size: 14px;
    font-variant-numeric: tabular-nums; color: var(--ink); background: #EDF1F2;
    border: 1px solid transparent; border-radius: 5px; cursor: pointer; padding: 0; }
  .scale button:hover { background: #E2E9EA; }
  .scale button[aria-pressed="true"] { background: var(--ink); color: #fff; font-weight: 650; }
  .scale-rule { position: relative; height: 17px; margin-top: 4px; font-size: 11.5px; color: var(--ink-soft); }
  .scale-rule span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
  .scale-rule i { position: absolute; top: -4px; width: 1px; height: 6px; background: var(--ink-soft); }

  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { font-family: inherit; font-size: 13.5px; padding: 8px 13px; border-radius: 6px;
    border: 1px solid var(--rule); background: #fff; color: var(--ink); cursor: pointer; }
  .seg button:hover { border-color: var(--act); }
  .seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }

  input[type="text"], input[type="date"], input[type="time"], input[type="number"], textarea {
    width: 100%; font-family: inherit; font-size: 15px; color: var(--ink);
    padding: 9px 11px; border: 1px solid var(--rule); border-radius: 6px; background: #fff; }
  input[type="number"] { -moz-appearance: textfield; }
  textarea { resize: vertical; min-height: 58px; }
  input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--act); outline-offset: 1px; }

  .grid2 { display: flex; gap: 10px; }
  .grid2 > div { flex: 1; min-width: 0; }
  .sublabel { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 3px; display: block; }

  .exrow { background: #F7F9F9; border: 1px solid var(--rule-soft); border-radius: 7px; padding: 10px 11px; margin-bottom: 8px; }
  .exrow-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 7px; }
  .exrow-name { font-size: 14px; font-weight: 600; }
  .exrow-dose { font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; }
  .exrow-in { display: flex; gap: 7px; }
  .exrow-in > div { flex: 1; min-width: 0; }
  .exrow-in input { padding: 7px 8px; font-size: 14px; text-align: center; }
  .exrow-in span { font-size: 11px; color: var(--ink-soft); display: block; text-align: center; margin-bottom: 2px; }

  .check { display: flex; align-items: flex-start; gap: 9px; font-size: 14px; cursor: pointer; margin-bottom: 10px; }
  .check input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--act); }

  .btn { font-family: inherit; font-size: 15px; font-weight: 600; padding: 11px 18px; border-radius: 7px;
    border: 1px solid var(--act); background: var(--act); color: #fff; cursor: pointer; }
  .btn:hover { background: #17495A; }
  .btn.ghost { background: #fff; color: var(--act); }
  .btn.quiet { background: #fff; color: var(--ink-soft); border-color: var(--rule); font-weight: 500; }
  .btn.small { font-size: 13.5px; padding: 8px 13px; }
  .btn[disabled] { opacity: .45; cursor: default; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  .pending { border-left: 3px solid var(--act); }
  .warnbox { background: var(--hold-bg); border: 1px solid #E3D2AE; border-radius: 7px;
    padding: 10px 12px; font-size: 13px; margin: -2px 0 12px; }
  .warnbox b { color: #9A6B12; }

  .row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--rule-soft); }
  .row:last-child { border-bottom: 0; }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font-size: 14.5px; font-weight: 600; }
  .row-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 1px; }
  .nums { display: flex; gap: 6px; flex-shrink: 0; }
  .num { width: 38px; text-align: center; font-variant-numeric: tabular-nums; }
  .num b { display: block; font-size: 17px; font-weight: 650; line-height: 1.2; }
  .num s { display: block; font-size: 10.5px; color: var(--ink-soft); text-decoration: none; }
  .num.miss b { color: var(--rule); }
  .del { background: none; border: 0; cursor: pointer; color: var(--rule); font-size: 18px;
    line-height: 1; padding: 4px 2px; flex-shrink: 0; font-family: inherit; }
  .del:hover { color: var(--down); }
  .rowbtns { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
  .edit { background: none; border: 0; cursor: pointer; color: var(--ink-soft); font-size: 11.5px;
    padding: 2px 3px; font-family: inherit; text-decoration: underline; }
  .edit:hover { color: var(--act); }
  .row.editing { background: #EAF1F3; border-radius: 6px; }
  .editbar { background: #EAF1F3; border: 1px solid #C4D7DD; border-radius: 7px;
    padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }
  .editbar b { color: var(--act); }
  .empty { font-size: 14px; color: var(--ink-soft); padding: 6px 0 2px; }

  .spark { width: 100%; height: 68px; display: block; margin-bottom: 4px; }
  .spark-legend { font-size: 12px; color: var(--ink-soft); display: flex; gap: 16px; }
  .spark-legend i { display: inline-block; width: 16px; height: 2px; vertical-align: middle; margin-right: 5px; }

  .flag { background: var(--down-bg); border: 1px solid #E8C4C0; border-radius: 8px;
    padding: 14px 16px; font-size: 14px; margin-bottom: 14px; }
  .flag b { display: block; margin-bottom: 4px; color: var(--down); }

  .exportbox { width: 100%; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; line-height: 1.45; min-height: 150px; margin-top: 10px; }
  .note { font-size: 12.5px; color: var(--ink-soft); margin-top: 14px; }
  .err { font-size: 13px; color: var(--down); margin-top: 8px; }

  /* Akkordeon (Übungen & Plan) */
  .blockhead { font-size: 15px; font-weight: 650; margin: 20px 0 3px; }
  .blockhead:first-child { margin-top: 0; }
  .blocksub { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 10px; }
  .acc { border: 1px solid var(--rule-soft); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
  .acc > button { width: 100%; text-align: left; font-family: inherit; cursor: pointer; background: #fff;
    border: 0; padding: 13px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .acc > button:hover { background: #F7F9F9; }
  .acc-name { font-size: 14.5px; font-weight: 600; display: block; }
  .acc-meta { font-size: 12px; color: var(--act); font-weight: 600; margin-top: 2px; display: block; }
  .acc-chev { color: var(--rule); font-size: 15px; flex-shrink: 0; }
  .acc-body { padding: 0 14px 14px; border-top: 1px solid var(--rule-soft); background: #FAFCFC; }
  .acc-body h4 { margin: 13px 0 5px; font-size: 12px; color: var(--ink-soft); font-weight: 600;
    letter-spacing: .04em; text-transform: uppercase; }
  .acc-body ul { margin: 0; padding-left: 17px; font-size: 13.5px; }
  .acc-body li { margin-bottom: 4px; }
  .acc-err { background: var(--down-bg); border-radius: 6px; padding: 9px 11px; font-size: 13px; margin-top: 11px; }
  .acc-err b { color: var(--down); }
  .fig { background: #fff; border: 1px solid var(--rule-soft); border-radius: 7px;
    padding: 8px; margin-top: 12px; }
  .fig svg { width: 100%; height: auto; display: block; }

  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0;
    border-bottom: 1px solid var(--rule-soft); font-size: 13.5px; }
  .kv:last-child { border-bottom: 0; }
  .kv b { font-weight: 600; }
  .kv span { color: var(--act); font-weight: 600; white-space: nowrap; }

  .prod { border: 1px solid var(--rule-soft); border-radius: 8px; padding: 13px 14px; margin-bottom: 9px; }
  .prod-name { font-size: 14.5px; font-weight: 650; }
  .prod-price { font-size: 13px; color: var(--act); font-weight: 600; margin: 2px 0 6px; }
  .prod-role { font-size: 13px; color: var(--ink-soft); }

  @media (max-width: 420px) {
    .scale button { height: 38px; font-size: 13px; }
    .verdict-word { font-size: 27px; }
    .grid2 { flex-wrap: wrap; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .btn, .seg button, .scale button, .tabs button { transition: background-color .12s ease, color .12s ease; }
  }

</style>
</head>

<script type="module">


/* Lokaler Speicher dieses Geräts. Ersetzt die Artefakt-Schnittstelle der Chat-Version. */
const LOCAL_PREFIX = 'sehnenlog.local:';
let memFallback = {};
let lsOk = true;
try { localStorage.setItem(LOCAL_PREFIX + 'probe', '1'); localStorage.removeItem(LOCAL_PREFIX + 'probe'); }
catch (e) { lsOk = false; }

window.storage = {
  async get(k) {
    const key = LOCAL_PREFIX + k;
    const v = lsOk ? localStorage.getItem(key) : (key in memFallback ? memFallback[key] : null);
    return v === null || v === undefined ? null : { key: k, value: v };
  },
  async set(k, v) {
    const key = LOCAL_PREFIX + k;
    if (lsOk) localStorage.setItem(key, v); else memFallback[key] = v;
    if (!lsOk) throw new Error('Der Browser erlaubt keinen dauerhaften Speicher (privater Modus?). Die Daten gelten nur für diese Sitzung – bitte eine Sicherung erzeugen.');
    return { key: k, value: v };
  }
};

function nowTime() { const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function today() {
  // Bewusst lokale Datumsteile statt toISOString() – letzteres rechnet auf UTC
  // und liefert in mitteleuropäischer Zeit nachts den Vortag.
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function newDraft() {
  return { date: today(), time: nowTime(), type: 'kraft', ex: {},
    run: { min:'', pace:'', hr:'', intervals:'' }, session: { min:'', hr:'', what:'' },
    painDuring: null, effort: null, collagen: false, progressed: false, note: '' };
}
function fmt(iso) { const [y,m,d] = iso.split('-'); return `${+d}.${+m}.`; }
function draftFromEntry(e) {
  const kind = TYPES[e.type] ? TYPES[e.type].kind : 'session';
  const d = newDraft();
  d.date = e.date; d.time = e.time || '';
  d.type = TYPES[e.type] ? e.type : 'crossfit';
  d.painDuring = e.painDuring; d.effort = e.effort;
  d.collagen = !!e.collagen; d.progressed = !!e.progressed;
  d.note = [e.note, e.detail ? 'Alteintrag: ' + e.detail : ''].filter(Boolean).join(' · ');
  if (kind === 'ex') d.ex = JSON.parse(JSON.stringify((e.details || {}).ex || {}));
  else if (kind === 'run') d.run = { min:'', pace:'', hr:'', intervals:'', ...(e.details || {}) };
  else d.session = { min:'', hr:'', what:'', ...(e.details || {}) };
  return d;
}
function daysBetween(a,b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// er würde beim Rendern eine Ausnahme werfen und die App unbenutzbar machen.
// Darum an jeder Außengrenze prüfen: beim Laden und beim Einspielen.
const isIsoDate = d => typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d);
function validEntry(e) { return !!e && typeof e === 'object' && !!e.id && isIsoDate(e.date); }
function validRest(r)  { return !!r && typeof r === 'object' && !!r.id && isIsoDate(r.date); }
function keepValid(list, check) {
  const arr = Array.isArray(list) ? list : [];
  const ok = arr.filter(check);
  return { ok, dropped: arr.length - ok.length };
}
function noteDropped(n) {
  state.dataNote = n
    ? `${n} ${n === 1 ? 'Datensatz war' : 'Datensätze waren'} unvollständig (Kennung oder Datum fehlt) und ${n === 1 ? 'wurde' : 'wurden'} nicht übernommen. Der Rest deiner Daten ist unverändert.`
    : null;
}

function adopt(p) {
  let rawEntries, rawRest;
  if (Array.isArray(p)) { rawEntries = p; rawRest = []; }
  else if (p && Array.isArray(p.entries)) { rawEntries = p.entries; rawRest = p.rest; }
  else return false;
  const e = keepValid(rawEntries, validEntry), r = keepValid(rawRest, validRest);
  state.entries = e.ok;
  state.rest = r.ok;
  noteDropped(e.dropped + r.dropped);
  return state.entries.length > 0 || state.rest.length > 0;
}
async function load() {
  try {
    const r = await window.storage.get(KEY);
    adopt(r && r.value ? JSON.parse(r.value) : null);
  } catch (e) { state.entries = []; state.rest = []; }

  if (!state.entries.length) {
    for (const old of ['sehnenlog:v2','sehnenlog:v1']) {
      try {
        const r = await window.storage.get(old);
        if (adopt(r && r.value ? JSON.parse(r.value) : null)) {
          await window.storage.set(KEY, JSON.stringify({ entries: state.entries, rest: state.rest }));
          break;
        }
      } catch (e) { /* nichts zu übernehmen */ }
    }
  }
  state.loaded = true;
  render();
}
async function save() {
  try {
    if (!window.storage || typeof window.storage.set !== 'function') throw new Error('window.storage steht in dieser Umgebung nicht zur Verfügung');
    await window.storage.set(KEY, JSON.stringify({ entries: state.entries, rest: state.rest }));
    state.error = null;
  } catch (e) {
    state.error = (e && e.message) ? String(e.message) : String(e);
  }
  render();
}

/* ============================================ Logik */
function summary(e) {
  const d = e.details || {};
  if (e.detail) return e.detail;
  const k = TYPES[e.type] ? TYPES[e.type].kind : null;
  if (k === 'ex') {
    const list = Object.entries(d.ex || {}).map(([id,v]) => {
      const ex = EX[id]; if (!ex) return null;
      const b = [];
      if (v.sets) b.push(v.sets + '×');
      if (v.reps) b.push(v.reps + ' ' + UNIT_LABEL[ex.unit]);
      if (v.weight) b.push(v.weight + ' kg');
      return ex.name.split('(')[0].trim() + (b.length ? ' ' + b.join(' ') : '');
    }).filter(Boolean);
    return list.length ? list.join(' · ') : 'keine Übungen erfasst';
  }
  if (k === 'run') {
    const b = [];
    if (d.min) b.push(d.min + ' Min.');
    if (d.pace) b.push(d.pace);
    if (d.hr) b.push('Ø ' + d.hr + ' bpm');
    if (d.intervals) b.push('Intervalle: ' + d.intervals);
    return b.length ? b.join(' · ') : 'keine Angabe';
  }
  if (k === 'session') {
    const b = [];
    if (d.min) b.push(d.min + ' Min.');
    if (d.hr) b.push('Ø ' + d.hr + ' bpm');
    if (d.what) b.push(d.what);
    return b.length ? b.join(' · ') : 'keine Angabe';
  }
  return 'keine Angabe';
}

function collagenGap() {
  if (!draft.collagen || !draft.time || !draft.date) return null;
  const mine = new Date(draft.date + 'T' + draft.time);
  if (isNaN(mine)) return null;
  let best = null;
  state.entries.forEach(e => {
    if (!e.collagen || !e.time || !e.date) return;
    const t = new Date(e.date + 'T' + e.time);
    if (isNaN(t)) return;
    const h = (mine - t) / 3600000;
    if (h > 0 && h < 6 && (best === null || h < best)) best = h;
  });
  return best;
}

function sorted() { return [...state.entries].sort((a,b) => String(a.date + (a.time||'')).localeCompare(String(b.date + (b.time||'')))); }

// Der Morgenwert gehört zum Tag, nicht zur einzelnen Einheit:
// nach einem Tag mit zwei Einheiten gibt es genau einen Morgen danach.
function days() {
  const map = new Map();
  sorted().forEach(e => {
    if (!map.has(e.date)) map.set(e.date, { date:e.date, n:0, painDuring:null, painMorning:null,
      stiffness:null, progressed:false, efforts:[], skipped:false, labels:[] });
    const d = map.get(e.date);
    d.n++;
    d.labels.push(TYPES[e.type] ? TYPES[e.type].label : e.type);
    if (e.painDuring != null) d.painDuring = d.painDuring == null ? e.painDuring : Math.max(d.painDuring, e.painDuring);
    if (e.painMorning != null) { d.painMorning = e.painMorning; d.stiffness = e.stiffness; }
    if (e.skipped) d.skipped = true;
    if (e.progressed) d.progressed = true;
    if (e.effort != null) d.efforts.push(e.effort);
  });
  return [...map.values()].sort((a,b) => a.date.localeCompare(b.date));
}
function pending() { return days().filter(d => d.painMorning == null && !d.skipped && daysBetween(d.date, today()) >= 1); }
function restSorted() { return [...state.rest].sort((a,b) => String(a.date).localeCompare(String(b.date))); }
function hasTrainingMorning(date) { return state.entries.some(e => e.date === date && e.painMorning != null); }

function assess() {
  const all = days();
  const done = all.filter(d => d.painMorning != null);
  if (pending().length) return { tone:'none', word:'Morgen-Check offen', kicker:'Noch keine Bewertung möglich',
    reasons:['Ohne den Wert vom Folgemorgen fehlt der wichtigste Marker.'], todo:'Trag den Morgen-Check oben nach, dann bewerte ich die Einheit.' };
  if (done.length < 2) return { tone:'none', word:'Noch zu wenig Daten', kicker:`${done.length} von 2 bewerteten Trainingstagen`,
    reasons:['Ein Trainingstag gilt als vollständig, sobald am Folgetag der Morgen-Check ausgefüllt ist. Ab dem zweiten vergleiche ich die beiden Morgenwerte miteinander.'], todo:'Weiter erfassen und nichts an der Last ändern.' };

  const last = done[done.length-1], prev = done[done.length-2];
  const stiff = STIFF.find(s => s.v === last.stiffness);
  const stiffMins = stiff ? stiff.mins : 0;
  const delta = last.painMorning - prev.painMorning;
  const red = [], amber = [], green = [];

  if (last.painDuring > 3) red.push(`Höchster Schmerzwert an diesem Tag lag bei ${last.painDuring}/10 – über der 3/10-Grenze.`);
  if (delta >= 2) red.push(`Morgenschmerz ist von ${prev.painMorning} auf ${last.painMorning} gestiegen.`);
  else if (delta === 1) amber.push(`Morgenschmerz ist um einen Punkt gestiegen (${prev.painMorning} → ${last.painMorning}).`);
  if (stiffMins > 45) red.push('Morgensteifigkeit über 45 Minuten.');
  else if (stiffMins > 30) amber.push('Morgensteifigkeit zwischen 30 und 45 Minuten.');

  const recent = done.slice(-3);
  const calm = recent.length === 3 && recent.every(d => d.painDuring <= 3)
    && recent.every(d => { const s = STIFF.find(x => x.v === d.stiffness); return !s || s.mins <= 30; })
    && recent[2].painMorning <= recent[0].painMorning;

  const lastProgress = [...all].reverse().find(d => d.progressed);
  const sinceProgress = lastProgress ? daysBetween(lastProgress.date, today()) : 999;

  if (calm) {
    green.push('Die letzten drei Trainingstage waren ruhig: Schmerz während ≤ 3/10, Steifigkeit unter 30 Minuten, Schmerz am Morgen nicht gestiegen.');
    const eff = recent.flatMap(d => d.efforts);
    if (eff.length && Math.max(...eff) <= 6) green.push(`Der letzte Satz fühlte sich zuletzt bei höchstens ${Math.max(...eff)}/10 an – das ist zu leicht.`);
  }

  if (red.length) return { tone:'down', word:'Zurücknehmen', kicker:`Nach dem Trainingstag ${fmt(last.date)}`, reasons:red.concat(amber),
    todo:'Auf das letzte funktionierende Level zurück, dort ein bis zwei Wochen bleiben, dann in kleineren Schritten weiter. Isometrie geht fast immer.' };
  if (amber.length) return { tone:'hold', word:'Level halten', kicker:`Nach dem Trainingstag ${fmt(last.date)}`, reasons:amber,
    todo:'Nichts steigern. Gleiche Last noch einmal wiederholen und beobachten, ob sich der Wert einpendelt.' };
  if (green.length && sinceProgress < 7) return { tone:'hold', word:'Level halten', kicker:'Alles ruhig – aber die Woche ist noch nicht um',
    reasons:green.concat([`Die letzte Steigerung war vor ${sinceProgress} ${sinceProgress===1?'Tag':'Tagen'}. Eine Variable pro Woche.`]),
    todo:`Noch ${7-sinceProgress} ${7-sinceProgress===1?'Tag':'Tage'} auf diesem Level bleiben.` };
  if (green.length) return { tone:'up', word:'Steigern', kicker:'Die Sehne verträgt mehr', reasons:green,
    todo:'Beim Krafttraining zuerst das Gewicht erhöhen, nicht die Wiederholungen. Beim Laufen eine Variable um etwa 10 %. Hak beim nächsten Eintrag „Das war eine Steigerung“ an.' };
  return { tone:'hold', word:'Level halten', kicker:`Nach dem Trainingstag ${fmt(last.date)}`,
    reasons:['Keine Warnzeichen, aber auch noch keine drei durchgehend ruhigen Trainingstage.'],
    todo:'Gleiche Last beibehalten, bis drei Trainingstage in Folge ruhig verlaufen sind.' };
}

function redFlags() {
  const done = days().filter(d => d.painMorning != null);
  const recent = done.filter(d => daysBetween(d.date, today()) <= 21);
  const out = [];
  if (recent.filter(e => e.painMorning >= 6).length >= 3) out.push('Der Morgenschmerz lag in den letzten drei Wochen mehrfach bei 6/10 oder höher.');
  if (recent.filter(e => e.stiffness === 'ueber45').length >= 2) out.push('Die Morgensteifigkeit lag mehrfach über 45 Minuten.');
  if (recent.length >= 4) {
    const f = recent.slice(0,2).reduce((s,e) => s + e.painMorning, 0) / 2;
    const l = recent.slice(-2).reduce((s,e) => s + e.painMorning, 0) / 2;
    if (l - f >= 2) out.push('Der Morgenschmerz steigt über die letzten Wochen kontinuierlich an.');
  }
  return out;
}

function buildExport() {
  const all = sorted();
  if (!all.length) return 'Noch keine Einträge.';
  const a = assess();
  const L = ['Sehnenlog – Auswertung bitte', `Stand: ${new Date().toLocaleDateString('de-DE')}`,
    `Einträge: ${all.length}, davon ${all.filter(e => e.painMorning != null).length} mit Morgen-Check`,
    `Aktuelle Einschätzung der App: ${a.word}`, '',
    'Datum | Zeit | Art | Inhalt | Schmerz während | Schmerz morgens | Steifigkeit | Anstrengung | Kollagen | Steigerung'];
  all.slice(-30).forEach(e => {
    const s = STIFF.find(x => x.v === e.stiffness);
    L.push([fmt(e.date), e.time || '–', TYPES[e.type] ? TYPES[e.type].label : e.type, summary(e),
      e.painDuring != null ? e.painDuring + '/10' : '–',
      e.painMorning != null ? e.painMorning + '/10' : 'offen',
      s ? s.label : '–', e.effort != null ? e.effort + '/10' : '–',
      e.collagen ? 'ja' : 'nein', e.progressed ? 'ja' : 'nein'].join(' | '));
  });
  const notes = all.filter(e => e.note).slice(-8);
  if (notes.length) { L.push('', 'Notizen zur Einheit:'); notes.forEach(e => L.push(`${fmt(e.date)}: ${e.note}`)); }
  const mnotes = all.filter(e => e.morningNote).slice(-8);
  if (mnotes.length) { L.push('', 'Notizen zum Morgen danach:'); mnotes.forEach(e => L.push(`${fmt(e.date)}: ${e.morningNote}`)); }
  const rest = restSorted().slice(-20);
  if (rest.length) {
    L.push('', 'Morgenwerte an Ruhetagen (ohne Training am Vortag):');
    L.push('Datum | Schmerz morgens | Steifigkeit | Notiz');
    rest.forEach(r => {
      const st = STIFF.find(x => x.v === r.stiff);
      L.push([fmt(r.date), r.pain + '/10', st ? st.label : '–', r.note || '–'].join(' | '));
    });
  }
  return L.join('\n');
}

/* ============================================ Render-Bausteine */
function scaleHtml(name, value, showLimit) {
  let s = '<div class="scale">';
  for (let i = 0; i <= 10; i++)
    s += `<button type="button" data-scale="${name}" data-val="${i}" aria-pressed="${value===i}" aria-label="${i} von 10">${i}</button>`;
  s += '</div>';
  if (showLimit) s += `<div class="scale-rule"><i style="left:36.4%"></i><span style="left:36.4%">3/10 – bis hier erlaubt</span></div>`;
  return s;
}
function segHtml(name, options, value) {
  return '<div class="seg">' + options.map(o =>
    `<button type="button" data-seg="${name}" data-val="${o.v}" aria-pressed="${value===o.v}">${esc(o.label)}</button>`).join('') + '</div>';
}
function num(path, val, ph) {
  return `<input type="number" inputmode="numeric" data-path="${path}" value="${esc(val)}" placeholder="${esc(ph||'')}">`;
}
function acc(id, name, meta, bodyHtml) {
  const open = openAcc === id;
  return `<div class="acc">
    <button type="button" data-acc="${id}" aria-expanded="${open}">
      <span><span class="acc-name">${esc(name)}</span>${meta ? `<span class="acc-meta">${esc(meta)}</span>` : ''}</span>
      <span class="acc-chev">${open ? '−' : '+'}</span>
    </button>
    ${open ? `<div class="acc-body">${bodyHtml}</div>` : ''}
  </div>`;
}
function figHtml(key) { return FIGS[key] ? `<div class="fig">${FIGS[key]}</div>` : ''; }

function exPickerHtml() {
  const pool = TYPES[draft.type].pool;
  const ids = Object.keys(EX).filter(id => pool.includes(EX[id].g));
  let h = `<div class="field"><span class="field-label">Übungen</span><p class="hint">Antippen zum Auswählen, dann Sätze und Wiederholungen eintragen.</p>`;
  h += '<div class="seg">' + ids.map(id =>
    `<button type="button" data-extoggle="${id}" aria-pressed="${!!draft.ex[id]}">${esc(EX[id].name.split('(')[0].trim())}</button>`).join('') + '</div></div>';
  const chosen = ids.filter(id => draft.ex[id]);
  if (chosen.length) {
    h += '<div class="field">';
    chosen.forEach(id => {
      const ex = EX[id], v = draft.ex[id];
      h += `<div class="exrow">
        <div class="exrow-top"><span class="exrow-name">${esc(ex.name)}</span><span class="exrow-dose">Ziel: ${esc(ex.dose)}</span></div>
        <div class="exrow-in">
          <div><span>Sätze</span>${num(`ex.${id}.sets`, v.sets, '3')}</div>
          <div><span>${UNIT_LABEL[ex.unit]}</span>${num(`ex.${id}.reps`, v.reps, ex.unit==='sek'?'30':'12')}</div>
          ${ex.unit === 'wdh' ? `<div><span>kg</span>${num(`ex.${id}.weight`, v.weight, '–')}</div>` : ''}
        </div></div>`;
    });
    h += '</div>';
  }
  return h;
}

function sparkHtml() {
  const done = days().filter(d => d.painMorning != null).slice(-14);
  if (done.length < 2) return '';
  const W = 560, H = 68, pad = 6;
  const step = (W - pad*2) / (done.length - 1);
  const y = v => H - pad - (v/10) * (H - pad*2);
  const path = k => done.map((e,i) => `${i?'L':'M'}${(pad+i*step).toFixed(1)},${y(e[k]).toFixed(1)}`).join(' ');
  const dots = done.map((e,i) => `<circle cx="${(pad+i*step).toFixed(1)}" cy="${y(e.painMorning).toFixed(1)}" r="2.6" fill="#A93B31"/>`).join('');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Verlauf der Schmerzwerte">
    <line x1="${pad}" y1="${y(3)}" x2="${W-pad}" y2="${y(3)}" stroke="#C6D0D1" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="${path('painDuring')}" fill="none" stroke="#5C6A6B" stroke-width="1.8"/>
    <path d="${path('painMorning')}" fill="none" stroke="#A93B31" stroke-width="2.2"/>${dots}</svg>
    <div class="spark-legend"><span><i style="background:#A93B31"></i>Schmerz am Morgen</span><span><i style="background:#5C6A6B"></i>Schmerz während</span></div>`;
}

const TABS = [['log','Logbuch'],['plan','Plan'],['ex','Übungen'],['supp','Supplemente']];

// Notausgang: wirft ein Tab beim Aufbau, bleibt die Seite sonst auf dem alten Stand
// stehen und ist auch nach dem Neuladen tot. Lieber die Rohdaten zum Sichern anbieten.
function crashHtml(err) {
  let dump;
  try { dump = JSON.stringify({ app:'sehnenlog', v:3, exported:new Date().toISOString(), entries:state.entries, rest:state.rest }); }
  catch (e) { dump = ''; }
  return `<div class="flag">
      <b>Die Ansicht konnte nicht aufgebaut werden</b>
      <div>Deine Daten sind nicht verloren. Kopier den Text unten und leg ihn beiseite – damit kannst du nach „Alles löschen“ alles wieder einspielen.</div>
      <div style="margin-top:8px;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#fff;border-radius:5px;padding:8px 10px">${esc(err && err.message ? err.message : String(err))}</div>
    </div>
    <div class="card">
      <h2>Rohdaten sichern</h2>
      <p class="lede">Vollständige Kopie deiner Einträge – erst sichern, dann zurücksetzen.</p>
      ${dump ? `<textarea class="exportbox" readonly>${esc(dump)}</textarea>` : '<p class="err">Die Daten ließen sich nicht in Text umwandeln.</p>'}
      <div class="btn-row" style="margin-top:10px"><button class="btn quiet small" data-act="reset">Alles löschen</button></div>
    </div>`;
}

function render() {
  if (!state.loaded) return;
  let body;
  try {
    body = tab === 'plan' ? tabPlan() : tab === 'ex' ? tabEx() : tab === 'supp' ? tabSupp() : tabLog();
  } catch (err) {
    body = crashHtml(err);
  }
  document.getElementById('root').innerHTML = `<div class="wrap">
    <div class="masthead">
      <h1>Sehnenlog</h1>
      <p>Plan, Übungen und Trainingstagebuch für die Tibialis-posterior-Sehne. Offline-Version, gespeichert auf diesem Gerät.</p>
    </div>
    <div class="tabs" role="tablist">
      ${TABS.map(([v,l]) => `<button role="tab" data-tab="${v}" aria-selected="${tab===v}">${l}</button>`).join('')}
    </div>
    ${body}
  </div>`;
}

/* ============================================ Events */
function setPath(path, val) {
  const p = path.split('.');
  let o = draft;
  for (let i = 0; i < p.length - 1; i++) o = o[p[i]];
  o[p[p.length-1]] = val;
}

document.addEventListener('click', async (ev) => {
  const t = ev.target.closest('[data-scale],[data-seg],[data-act],[data-tab],[data-extoggle],[data-acc]');
  if (!t) return;

  if (t.dataset.tab) { tab = t.dataset.tab; openAcc = null; window.scrollTo(0,0); return render(); }
  if (t.dataset.acc) { openAcc = openAcc === t.dataset.acc ? null : t.dataset.acc; return render(); }
  if (t.dataset.extoggle) {
    const id = t.dataset.extoggle;
    if (draft.ex[id]) delete draft.ex[id]; else draft.ex[id] = { sets:'', reps:'', weight:'' };
    return render();
  }
  if (t.dataset.scale) {
    const v = +t.dataset.val;
    if (t.dataset.scale === 'mPain') morningDraft.pain = v;
    else if (t.dataset.scale === 'rPain') restDraft.pain = v;
    else draft[t.dataset.scale] = v;
    return render();
  }
  if (t.dataset.seg) {
    if (t.dataset.seg === 'mStiff') morningDraft.stiff = t.dataset.val;
    else if (t.dataset.seg === 'rStiff') restDraft.stiff = t.dataset.val;
    else { draft.type = t.dataset.val; draft.ex = {}; }
    return render();
  }

  const act = t.dataset.act;
  if (act === 'setToday') { draft.date = today(); draft.time = nowTime(); return render(); }
  if (act === 'saveEntry') {
    const kind = TYPES[draft.type].kind;
    const details = kind === 'ex' ? { ex: JSON.parse(JSON.stringify(draft.ex)) }
      : kind === 'run' ? { ...draft.run } : { ...draft.session };
    const base = { date:draft.date, time:draft.time, type:draft.type, details,
      painDuring:draft.painDuring, effort: draft.type === 'kraft' ? draft.effort : null,
      collagen:draft.collagen, progressed:draft.progressed, note:draft.note.trim() };

    if (editingId) {
      const e = state.entries.find(x => x.id === editingId);
      if (e) {
        const moved = e.date !== base.date;
        Object.assign(e, base);
        if (moved) {
          // Morgenwerte gehören zum Tag – beim Umdatieren die des Zieltags übernehmen
          const twin = state.entries.find(x => x.id !== e.id && x.date === base.date && x.painMorning != null);
          if (twin) { e.painMorning = twin.painMorning; e.stiffness = twin.stiffness; e.morningNote = twin.morningNote; e.skipped = twin.skipped; }
          else { e.painMorning = null; e.stiffness = null; e.morningNote = ''; e.skipped = false; }
        }
      }
      editingId = null;
    } else {
      state.entries.push({ id:'e'+Date.now(), ...base, painMorning:null, stiffness:null });
    }
    draft = newDraft(); exportText = null; await save();
  }
  if (act === 'edit') {
    const e = state.entries.find(x => x.id === t.dataset.id);
    if (e) { editingId = e.id; draft = draftFromEntry(e); render(); document.getElementById('form')?.scrollIntoView({ block:'start', behavior:'smooth' }); }
    return;
  }
  if (act === 'cancelEdit') { editingId = null; draft = newDraft(); return render(); }
  if (act === 'resetMorning') {
    const e = state.entries.find(x => x.id === editingId);
    if (e) state.entries.filter(x => x.date === e.date).forEach(x => {
      x.painMorning = null; x.stiffness = null; x.morningNote = ''; x.skipped = false;
    });
    exportText = null; await save();
  }
  if (act === 'saveMorning') {
    const p = pending()[0];
    state.entries.filter(x => x.date === p.date).forEach(e => {
      e.painMorning = morningDraft.pain;
      e.stiffness = morningDraft.stiff;
      e.morningNote = (morningDraft.note || '').trim();
    });
    morningDraft = {}; exportText = null; await save();
  }
  if (act === 'skipMorning') {
    const p = pending()[0];
    state.entries.filter(x => x.date === p.date).forEach(e => { e.skipped = true; });
    morningDraft = {}; await save();
  }
  if (act === 'del') { if (editingId === t.dataset.id) { editingId = null; draft = newDraft(); } state.entries = state.entries.filter(x => x.id !== t.dataset.id); exportText = null; await save(); }
  if (act === 'export') { exportText = buildExport(); render(); document.getElementById('exportbox')?.scrollIntoView({block:'nearest'}); }
  if (act === 'copy') {
    const box = document.getElementById('exportbox');
    if (box) {
      box.select();
      try { await navigator.clipboard.writeText(box.value); } catch (e) { document.execCommand('copy'); }
      t.textContent = 'Kopiert'; setTimeout(() => { t.textContent = 'Kopieren'; }, 1600);
    }
  }
  if (act === 'retrySave') { await save(); return; }
  if (act === 'openRest') { restOpen = true; restDraft = { date: today(), pain:null, stiff:null, note:'' }; return render(); }
  if (act === 'closeRest') { restOpen = false; return render(); }
  if (act === 'saveRest') {
    state.rest.push({ id:'r'+Date.now(), date: restDraft.date || today(),
      pain: restDraft.pain, stiff: restDraft.stiff, note: (restDraft.note||'').trim() });
    restOpen = false; restDraft = { date:'', pain:null, stiff:null, note:'' };
    exportText = null; await save();
  }
  if (act === 'delRest') { state.rest = state.rest.filter(x => x.id !== t.dataset.id); exportText = null; await save(); }
  if (act === 'backup') {
    backupText = JSON.stringify({ app:'sehnenlog', v:3, exported:new Date().toISOString(), entries:state.entries, rest:state.rest });
    importMsg = null; render();
    document.getElementById('backupbox')?.scrollIntoView({ block:'nearest' });
    return;
  }
  if (act === 'copyBackup') {
    const box = document.getElementById('backupbox');
    if (box) {
      box.select();
      try { await navigator.clipboard.writeText(box.value); } catch (e) { document.execCommand('copy'); }
      t.textContent = 'Kopiert'; setTimeout(() => { t.textContent = 'Kopieren'; }, 1600);
    }
    return;
  }
  if (act === 'restore') {
    const box = document.getElementById('impbox');
    const raw = (box && box.value ? box.value : importBuf) || '';
    if (!raw.trim()) {
      importMsg = { ok:false, text:'Das Feld ist leer. Füg zuerst den Sicherungstext ein.' };
      return render();
    }
    // Erst vollständig einlesen und prüfen, dann anwenden – sonst landen bei einem
    // Fehlschlag halbe Daten im Speicher, während die Meldung „ungültig“ behauptet.
    let incoming = null, incomingRest = [];
    try {
      const parsed = JSON.parse(raw);
      incoming = Array.isArray(parsed) ? parsed : (parsed && parsed.entries);
      if (parsed && Array.isArray(parsed.rest)) incomingRest = parsed.rest;
    } catch (e) { incoming = null; }
    if (!Array.isArray(incoming)) {
      importMsg = { ok:false, text:'Das war kein gültiger Sicherungstext. Kopier den kompletten Inhalt aus dem oberen Feld, ohne etwas wegzulassen. Es wurde nichts verändert.' };
      return render();
    }
    let neu = 0, ersetzt = 0, uebersprungen = 0;
    incoming.forEach(e => {
      if (!validEntry(e)) { uebersprungen++; return; }
      const i = state.entries.findIndex(x => x.id === e.id);
      if (i >= 0) { state.entries[i] = e; ersetzt++; } else { state.entries.push(e); neu++; }
    });
    let neuRest = 0;
    incomingRest.forEach(r => {
      if (!validRest(r)) { uebersprungen++; return; }
      if (!state.rest.some(x => x.id === r.id)) { state.rest.push(r); neuRest++; }
    });
    importBuf = ''; exportText = null; state.dataNote = null;
    importMsg = { ok:true, text:
      `${neu} ${neu === 1 ? 'Eintrag' : 'Einträge'} hinzugefügt, ${ersetzt} aktualisiert`
      + (neuRest ? `, ${neuRest} ${neuRest === 1 ? 'Ruhetag' : 'Ruhetage'} übernommen` : '')
      + `. Insgesamt ${state.entries.length}.`
      + (uebersprungen ? ` ${uebersprungen} unvollständige ${uebersprungen === 1 ? 'Zeile wurde' : 'Zeilen wurden'} übersprungen.` : '') };
    await save();
    return;
  }
  if (act === 'reset') {
    if (!confirm('Alle Einträge löschen? Das lässt sich nicht rückgängig machen.')) return;
    state.entries = []; state.rest = []; exportText = null; await save();
  }
});

function onField(ev) {
  if (ev.target.id === 'impbox') { importBuf = ev.target.value; return; }
  const rp = ev.target.dataset.rpath;
  if (rp) { restDraft[rp] = ev.target.value; if (rp === 'date' && ev.type === 'change') render(); return; }
  const mp = ev.target.dataset.mpath;
  if (mp) { morningDraft[mp] = ev.target.value; return; }
  const p = ev.target.dataset.path;
  if (!p) return;
  const isCb = ev.target.type === 'checkbox';
  setPath(p, isCb ? ev.target.checked : ev.target.value);
  // Neu zeichnen erst, wenn das Feld fertig ist – sonst springt der Fokus beim Tippen
  if (isCb || (ev.type === 'change' && (p === 'time' || p === 'date'))) render();
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);

/* Offline-Cache. Nur unter http(s) moeglich – wird die Datei direkt vom Dateisystem
   geoeffnet (file://), gibt es keinen Service Worker. Die App laeuft dann trotzdem,
   nur eben ohne Offline-Garantie. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { /* ohne Cache weiterarbeiten */ });
  });
}

load();

</script>
